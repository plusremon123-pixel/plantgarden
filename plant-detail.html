<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>식물 상세 — 식물 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .thumb-btn { transition: border-color .15s; }
    #thumb-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  </style>
</head>
<body class="min-h-screen bg-gray-50">

  <!-- 네비게이션 -->
  <nav class="bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between sticky top-0 z-20 shadow-sm">
    <a href="index.html" class="text-lg font-bold text-green-800">🌿 식물 관리</a>
    <div class="flex gap-3 text-sm items-end">
      <a href="mybook.html"    class="text-gray-400 hover:text-green-700">내 도감</a>
      <a href="garden.html"    class="text-gray-400 hover:text-green-700">내 정원</a>
      <a href="flowerbed.html" class="text-gray-400 hover:text-green-700">내 꽃밭</a>
      <a href="admin.html"     class="text-gray-400 hover:text-green-700">관리자</a>
    </div>
  </nav>

  <!-- 뒤로가기 -->
  <div class="max-w-2xl mx-auto px-4 pt-4">
    <button onclick="history.back()" class="flex items-center gap-1 text-sm text-green-700 hover:text-green-900 transition-colors">
      ← 목록으로
    </button>
  </div>

  <!-- 로딩 -->
  <div id="loading" class="max-w-2xl mx-auto px-4 py-16 text-center text-green-400">
    <span class="text-4xl">🌱</span>
    <p class="mt-2 text-sm">불러오는 중...</p>
  </div>

  <!-- 에러 -->
  <div id="error" class="hidden max-w-2xl mx-auto px-4 py-16 text-center text-gray-400">
    <span class="text-4xl">😢</span>
    <p class="mt-2 text-sm">식물 정보를 불러오지 못했습니다.</p>
    <p id="error-msg" class="mt-1 text-xs text-red-400"></p>
  </div>

  <!-- ── 고정 하단 바 ── -->
  <div id="bottom-bar" class="bottom-bar hidden">
    <button onclick="goAddToGarden()" class="bb-btn">내 정원에 추가</button>
  </div>

  <!-- 상세 내용 -->
  <main id="detail" class="hidden max-w-2xl mx-auto px-4 py-4 pb-24">

    <!-- ── 메인 이미지 ── -->
    <div id="img-main-wrap"
      class="w-full h-72 rounded-2xl overflow-hidden bg-green-100 mb-3 relative plant-img-wrap">
      <div class="plant-img-skeleton absolute inset-0 flex items-center justify-center animate-pulse">
        <span class="text-5xl opacity-20">🌿</span>
      </div>
    </div>

    <!-- ── 썸네일 스트립 (최대 5개, + 버튼 포함) ── -->
    <div id="thumb-strip" class="mb-4"></div>

    <!-- ── 사진 추가 바텀시트 ── -->
    <div id="photo-sheet" class="hidden fixed inset-0 z-50 flex items-end justify-center">
      <div class="absolute inset-0 bg-black/40" onclick="closePhotoSheet()"></div>
      <div class="relative w-full max-w-lg bg-white rounded-t-2xl px-5 pt-5 pb-8">
        <p class="text-sm font-bold text-gray-700 mb-4 text-center">사진 추가</p>
        <div class="flex gap-3">
          <label class="flex-1 flex flex-col items-center gap-2 bg-gray-50 rounded-2xl py-5 cursor-pointer hover:bg-green-50 transition-colors">
            <span class="text-2xl">📷</span>
            <span class="text-sm font-semibold text-gray-600">카메라</span>
            <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoAdd(event)" />
          </label>
          <label class="flex-1 flex flex-col items-center gap-2 bg-gray-50 rounded-2xl py-5 cursor-pointer hover:bg-green-50 transition-colors">
            <span class="text-2xl">🖼️</span>
            <span class="text-sm font-semibold text-gray-600">갤러리</span>
            <input type="file" accept="image/*" class="hidden" onchange="handlePhotoAdd(event)" />
          </label>
        </div>
      </div>
    </div>

    <!-- 기본 정보 -->
    <div class="bg-white rounded-2xl p-5 shadow-sm mb-4">
      <div class="flex items-start justify-between gap-2 mb-1">
        <h1 id="d-name" class="text-2xl font-bold text-green-900"></h1>
        <span id="d-price" class="text-sm font-semibold text-green-700 bg-green-50 px-3 py-1 rounded-full whitespace-nowrap"></span>
      </div>
      <p id="d-category" class="text-sm text-gray-400 mb-2"></p>
      <div id="d-locations" class="hidden flex gap-1.5 overflow-x-auto tab-scroll pb-0.5 mb-4"></div>

      <div class="grid grid-cols-2 gap-3">
        <div id="row-sun" class="info-row hidden">
          <span class="info-label">☀️ 햇빛</span>
          <span id="d-sun" class="info-val"></span>
        </div>
        <div id="row-height" class="info-row hidden">
          <span class="info-label">📏 키</span>
          <span id="d-height" class="info-val"></span>
        </div>
        <div id="row-width" class="info-row hidden">
          <span class="info-label">↔️ 너비</span>
          <span id="d-width" class="info-val"></span>
        </div>
        <div id="row-bloom" class="info-row hidden">
          <span class="info-label">🌸 개화</span>
          <span id="d-bloom" class="info-val"></span>
        </div>
        <div id="row-bloom-after" class="info-row hidden">
          <span class="info-label">⏳ 개화까지</span>
          <span id="d-bloom-after" class="info-val"></span>
        </div>
        <div id="row-sowing" class="info-row hidden">
          <span class="info-label">🌾 파종</span>
          <span id="d-sowing" class="info-val"></span>
        </div>
        <div id="row-germination" class="info-row hidden">
          <span class="info-label">🌱 발아</span>
          <span id="d-germination" class="info-val"></span>
        </div>
        <div id="row-soil" class="info-row hidden col-span-2">
          <span class="info-label">🪴 토양</span>
          <span id="d-soil" class="info-val"></span>
        </div>
      </div>
    </div>

    <!-- 특징 -->
    <div id="row-feature" class="hidden bg-white rounded-2xl p-5 shadow-sm mb-4">
      <h2 class="text-sm font-semibold text-green-800 mb-2">✨ 특징</h2>
      <p id="d-feature" class="text-sm text-gray-600 leading-relaxed"></p>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/user.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/plants.js"></script>
  <script>
    let currentPlant = null

    function setField(id, rowId, value) {
      if (value) {
        document.getElementById(id).textContent = value
        document.getElementById(rowId).classList.remove('hidden')
      }
    }

    // ── 메인 이미지 교체 ──────────────────────────────────
    function setMainImage(url, alt) {
      const wrap = document.getElementById('img-main-wrap')
      // 기존 img 제거 후 새로 삽입
      wrap.querySelectorAll('img').forEach(el => el.remove())
      const skel = wrap.querySelector('.plant-img-skeleton')

      if (!url) {
        wrap.innerHTML = '<div class="w-full h-full flex items-center justify-center text-6xl">🌿</div>'
        return
      }
      const img = document.createElement('img')
      img.src = url
      img.alt = alt ?? ''
      img.className = 'w-full h-full object-cover opacity-0 transition-opacity duration-500 relative z-10'
      img.onload  = () => { img.classList.remove('opacity-0'); skel?.remove() }
      img.onerror = () => { wrap.innerHTML = '<div class="w-full h-full flex items-center justify-center text-6xl">🌿</div>' }
      wrap.appendChild(img)
    }

    // ── 썸네일 스트립 렌더 (최대 5개 + 버튼) ────────────────
    let _activeThumbIdx = 0

    function renderThumbs(images, plant) {
      const strip = document.getElementById('thumb-strip')
      strip.innerHTML = ''
      _activeThumbIdx = Math.min(_activeThumbIdx, Math.max(images.length - 1, 0))

      // 이미지 슬롯
      images.forEach((img, i) => {
        const btn = document.createElement('button')
        btn.dataset.idx = i
        btn.className = [
          'thumb-btn aspect-square rounded-xl overflow-hidden border-2 transition-colors',
          i === _activeThumbIdx ? 'border-green-500' : 'border-transparent hover:border-gray-300'
        ].join(' ')
        btn.innerHTML = `<img src="${img.image_url}" alt="${plant.name} ${i + 1}" class="w-full h-full object-cover" />`
        btn.addEventListener('click', () => {
          _activeThumbIdx = i
          setMainImage(img.image_url, plant.name)
          strip.querySelectorAll('.thumb-btn').forEach((b, j) => {
            b.classList.toggle('border-green-500', j === i)
            b.classList.toggle('border-transparent', j !== i)
            if (j !== i) b.classList.add('hover:border-gray-300')
          })
        })
        strip.appendChild(btn)
      })

      // "+" 추가 버튼 (5개 미만일 때)
      if (images.length < 5) {
        const addBtn = document.createElement('button')
        addBtn.id = 'add-photo-btn'
        addBtn.type = 'button'
        addBtn.className = 'aspect-square rounded-xl border-2 border-dashed border-gray-300 bg-gray-50 flex items-center justify-center text-gray-400 hover:border-green-400 hover:text-green-500 transition-colors'
        addBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>`
        addBtn.addEventListener('click', openPhotoSheet)
        strip.appendChild(addBtn)
      }
    }

    // ── 사진 추가: 바텀시트 ───────────────────────────────
    function openPhotoSheet() {
      if (_isUploading) return
      document.getElementById('photo-sheet').classList.remove('hidden')
    }

    function closePhotoSheet() {
      document.getElementById('photo-sheet').classList.add('hidden')
    }

    // ── WebP 변환 ─────────────────────────────────────────
    function toWebP(file, quality = 0.90) {
      return new Promise((resolve, reject) => {
        const img = new Image()
        const url = URL.createObjectURL(file)
        img.onload = () => {
          const canvas = document.createElement('canvas')
          canvas.width  = img.naturalWidth
          canvas.height = img.naturalHeight
          canvas.getContext('2d').drawImage(img, 0, 0)
          canvas.toBlob(blob => {
            URL.revokeObjectURL(url)
            blob ? resolve(blob) : reject(new Error('WebP 변환 실패'))
          }, 'image/webp', quality)
        }
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지 로드 실패')) }
        img.src = url
      })
    }

    // ── 사진 업로드 처리 ──────────────────────────────────
    let _isUploading = false

    async function handlePhotoAdd(event) {
      closePhotoSheet()
      const file = event.target.files?.[0]
      if (!file || !currentPlant) return
      event.target.value = '' // 동일 파일 재선택 가능하도록 초기화

      const images = sortedImages(currentPlant)
      if (images.length >= 5) return

      _isUploading = true
      // + 버튼을 로딩 스피너로 교체
      const addBtn = document.getElementById('add-photo-btn')
      if (addBtn) {
        addBtn.innerHTML = `<svg class="w-5 h-5 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>`
        addBtn.disabled = true
        addBtn.className = addBtn.className.replace('hover:border-green-400 hover:text-green-500', '') + ' opacity-70'
      }

      try {
        const plantId   = currentPlant.id
        const sortOrder = images.length + 1
        const fileName  = `${plantId}_${String(sortOrder).padStart(2, '0')}.webp`
        const isMain    = images.length === 0

        const blob = await toWebP(file, 0.90)

        const { error: upErr } = await window._supabase.storage
          .from('plant').upload(fileName, blob, { contentType: 'image/webp', upsert: true })
        if (upErr) throw upErr

        const { data: urlData } = window._supabase.storage.from('plant').getPublicUrl(fileName)

        const { error: dbErr } = await window._supabase.from('plant_images').upsert({
          plant_id:     plantId,
          image_url:    urlData.publicUrl,
          storage_path: fileName,
          sort_order:   sortOrder,
          is_main:      isMain,
        }, { onConflict: 'plant_id,sort_order' })
        if (dbErr) throw dbErr

        // 최신 데이터로 갱신
        _activeThumbIdx = sortOrder - 1
        const updated = await plantsApi.getById(plantId)
        currentPlant = updated
        const newImages = sortedImages(updated)
        setMainImage(newImages[_activeThumbIdx]?.image_url ?? newImages[0]?.image_url, updated.name)
        renderThumbs(newImages, updated)

      } catch (err) {
        alert('사진 업로드 실패: ' + err.message)
        // 버튼 복원
        renderThumbs(sortedImages(currentPlant), currentPlant)
      } finally {
        _isUploading = false
      }
    }

    async function loadDetail() {
      const id = decodeURIComponent(location.hash.slice(1))
      if (!id) { showError('URL에 id가 없습니다.'); return }

      try {
        const plant = await plantsApi.getById(id)
        currentPlant = plant

        // 이미지 처리
        _activeThumbIdx = 0
        const images = sortedImages(plant)
        const mainUrl = images.length > 0 ? images[0].image_url : null
        setMainImage(mainUrl, plant.name)
        renderThumbs(images, plant)

        // 기본 정보
        document.getElementById('d-name').textContent = plant.name
        document.getElementById('d-category').textContent = plant.category ?? ''

        // 심어진 위치 조회
        loadPlantLocations(id)
        document.getElementById('d-price').textContent = plant.price
          ? Number(plant.price).toLocaleString() + '원' : ''

        setField('d-sun',         'row-sun',         plant.sun)
        setField('d-height',      'row-height',      plant.height)
        setField('d-width',       'row-width',       plant.width)
        setField('d-bloom',       'row-bloom',       plant.bloom)
        setField('d-bloom-after', 'row-bloom-after', plant.bloom_after)
        setField('d-sowing',      'row-sowing',      plant.sowing)
        setField('d-germination', 'row-germination', plant.germination)
        setField('d-soil',        'row-soil',        plant.soil)

        if (plant.feature) {
          document.getElementById('d-feature').textContent = plant.feature
          document.getElementById('row-feature').classList.remove('hidden')
        }

        document.getElementById('loading').classList.add('hidden')
        document.getElementById('detail').classList.remove('hidden')
        document.getElementById('bottom-bar').classList.remove('hidden')

      } catch (err) {
        showError(err.message)
      }
    }

    function showError(msg) {
      document.getElementById('loading').classList.add('hidden')
      if (msg) document.getElementById('error-msg').textContent = msg
      document.getElementById('error').classList.remove('hidden')
    }

    async function loadPlantLocations(plantId) {
      try {
        const { data } = await window._supabase
          .from('plant_instances')
          .select('id, location_id, location')
          .eq('user_id', window.MY_USER_ID)
          .eq('plant_id', plantId)
        const rows = (data ?? []).filter(r => r.location)
        if (rows.length === 0) return
        const el = document.getElementById('d-locations')
        el.innerHTML = rows.map(r =>
          `<a href="flowerbed.html?loc=${r.location_id ?? ''}"
             class="flex-shrink-0 text-xs bg-green-50 text-green-700 border border-green-200
                    px-2.5 py-1 rounded-full hover:bg-green-100 transition-colors whitespace-nowrap">
             📍 ${r.location}
           </a>`
        ).join('')
        el.classList.remove('hidden')
      } catch (_) {}
    }

    function goAddToGarden() {
      if (currentPlant) {
        sessionStorage.setItem('preselect_plant_id', currentPlant.id)
        sessionStorage.setItem('preselect_plant_name', currentPlant.name)
      }
      window.location.href = 'flowerbed.html?add=1'
    }

    loadDetail()
  </script>
</body>
</html>
