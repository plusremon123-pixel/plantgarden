<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 도감 — 식물 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .tab-scroll::-webkit-scrollbar { display: none; }
    .tab-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .cat-tab-btn {
      flex-shrink: 0;
      height: 2rem;
      padding: 0 0.8rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
      color: #6b7280;
      background: #f3f4f6;
      transition: background-color .15s, color .15s, box-shadow .15s;
    }
    .cat-tab-btn.active {
      color: #fff;
      background: #16a34a;
      box-shadow: 0 5px 12px rgba(22, 163, 74, .18);
    }
    /* context menu */
    .ctx-menu { position: absolute; top: 2rem; right: 0.5rem; z-index: 50; background: #fff; border: 1px solid #e5e7eb; border-radius: 0.75rem; box-shadow: 0 8px 24px rgba(0,0,0,.12); min-width: 9rem; overflow: hidden; }
    .ctx-item { display: block; width: 100%; text-align: left; padding: 0.625rem 1rem; font-size: 0.8rem; color: #374151; cursor: pointer; }
    .ctx-item:hover { background: #f3f4f6; }
    .ctx-item.danger { color: #dc2626; }
  </style>
</head>
<body class="min-h-screen bg-gray-50">

  <!-- ── 네비게이션 ── -->
  <nav class="bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between sticky top-0 z-20 shadow-sm">
    <div class="flex gap-3 text-sm items-center">
      <a href="mybook.html"    class="nav-link text-green-700 border-green-600">내 도감</a>
      <a href="garden.html"    class="nav-link text-gray-400 hover:text-green-700">내 정원</a>
      <a href="flowerbed.html" class="nav-link text-gray-400 hover:text-green-700">내 꽃밭</a>
      <a href="admin.html"     class="nav-link text-gray-400 hover:text-green-700">관리자</a>
    </div>
    <button type="button" data-plant-finder-open class="app-camera-btn" aria-label="식물 찾기" title="식물 찾기"><span aria-hidden="true">camera</span></button>
  </nav>

  <!-- ── 검색바 (sticky) ── -->
  <div id="search-bar" class="bg-white border-b border-gray-100 px-4 py-3 sticky z-20">
    <div class="max-w-7xl mx-auto">
      <input id="search-input" type="text" placeholder="식물 이름으로 검색..."
        class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-400 bg-gray-50"
        oninput="debouncedSearch()" />
    </div>
  </div>

  <!-- ── 카테고리 탭 (sticky) ── -->
  <div id="cat-tab-bar" class="bg-white border-b border-gray-100 sticky z-20">
    <div class="max-w-7xl mx-auto flex items-center gap-2 px-4 py-2">
      <button id="cat-tab-all" data-cat="전체" onclick="selectCategory('전체')"
        class="cat-tab-btn active">전체</button>
      <div id="cat-tabs" class="tab-scroll flex items-center gap-2 overflow-x-auto flex-1 min-w-0"></div>
      <button id="cat-tab-next" onclick="scrollCategoryTabs()"
        class="hidden flex-shrink-0 w-7 h-8 items-center justify-center text-gray-400 hover:text-gray-700 transition-colors"
        aria-label="카테고리 더 보기">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ── 고정 하단 바 ── -->
  <div class="bottom-bar">
    <button onclick="openAddPlantModal()" class="bb-btn">식물 추가</button>
    <button onclick="openCatalogModal()"  class="bb-btn bb-btn-ghost">전체 도감 보기</button>
  </div>

  <main class="max-w-7xl mx-auto px-4 py-4 pb-24">
    <p id="result-count" class="text-xs text-gray-400 mb-3"></p>
    <div id="loading" class="text-center py-20 text-green-400">
      <div class="text-4xl mb-2">🌱</div>
      <p class="text-sm">불러오는 중...</p>
    </div>
    <div id="plant-grid" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3"></div>
    <div id="empty" class="hidden text-center py-20 text-gray-400">
      <div class="text-4xl mb-2">🔍</div>
      <p class="text-sm">검색 결과가 없습니다.</p>
    </div>
  </main>

  <!-- ══════════════════════════════════════
       Phase 4 — 전체 도감 모달
  ══════════════════════════════════════ -->
  <div id="modal-catalog" class="modal-backdrop hidden" onclick="onCatalogBackdropClick(event)">
    <div class="modal-sheet" style="max-height:90vh;display:flex;flex-direction:column;" onclick="event.stopPropagation()">
      <div class="modal-header flex-shrink-0">
        <h3 class="font-bold text-gray-800">전체 도감</h3>
        <button onclick="closeCatalogModal()" class="modal-close">✕</button>
      </div>
      <div class="flex-shrink-0 px-1 pb-3">
        <input id="catalog-search" type="text" placeholder="식물 이름으로 검색..."
          class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-400 bg-gray-50"
          oninput="debounceCatalog()" />
      </div>
      <div id="catalog-cats" class="flex-shrink-0 flex flex-wrap gap-2 pb-3 px-1"></div>
      <div class="flex-1 overflow-y-auto">
        <p id="catalog-count" class="text-xs text-gray-400 mb-2 px-1"></p>
        <div id="catalog-loading" class="text-center py-10 text-green-400 text-sm">불러오는 중...</div>
        <div id="catalog-grid" class="hidden grid grid-cols-2 sm:grid-cols-3 gap-3 px-1 pb-4"></div>
        <div id="catalog-empty" class="hidden text-center py-10 text-gray-400 text-sm">검색 결과가 없습니다.</div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       Phase 5 — 식물 추가 모달 (AI 생성)
  ══════════════════════════════════════ -->
  <div id="modal-add-plant" class="modal-backdrop hidden" onclick="onAddPlantBackdropClick(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 class="font-bold text-gray-800">식물 추가</h3>
        <button onclick="closeAddPlantModal()" class="modal-close">✕</button>
      </div>
      <p class="text-xs text-gray-400 mb-3">이름을 입력하면 도감에서 검색하고, 없으면 AI로 자동 등록합니다.</p>
      <div class="flex gap-2 mb-3">
        <input id="add-plant-name" type="text" placeholder="식물 이름 (한글/영문)"
          class="input flex-1" onkeydown="if(event.key==='Enter')doAddPlant()" />
        <button onclick="doAddPlant()" class="btn-primary flex-shrink-0 px-4">검색</button>
      </div>
      <p id="add-plant-status" class="hidden text-sm text-green-700 font-medium mb-2"></p>
      <div id="add-plant-found" class="hidden mb-3">
        <div id="found-list" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
        <button id="found-ai-btn" onclick="doAiGenerate()"
          class="hidden w-full mt-2 text-xs text-green-700 py-2 border border-dashed border-green-300 rounded-xl hover:bg-green-50 transition-colors">
          목록에 없음 — AI로 새로 등록
        </button>
      </div>
      <p id="add-plant-error" class="hidden text-sm text-red-500"></p>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       Phase 6 — 정원에 심기 모달
  ══════════════════════════════════════ -->
  <div id="modal-plant-instance" class="modal-backdrop hidden" onclick="onInstanceBackdropClick(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 class="font-bold text-gray-800">정원에 심기</h3>
        <button onclick="closeInstanceModal()" class="modal-close">✕</button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="label">상위 위치</label>
          <select id="inst-loc-l1" class="input" onchange="onInstL1Change()">
            <option value="">-- 정원 선택 --</option>
          </select>
        </div>
        <div id="inst-l2-wrap" class="hidden">
          <label class="label">세부 위치</label>
          <select id="inst-loc-l2" class="input">
            <option value="">-- 선택 안 함 --</option>
          </select>
        </div>
        <div>
          <label class="label">재배 형태</label>
          <select id="inst-cultivation-type" class="input">
            <option value="노지">노지</option>
            <option value="화분">화분</option>
            <option value="플랜터">플랜터</option>
            <option value="트레이">트레이</option>
            <option value="수경">수경</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="label">수량</label>
            <input id="inst-quantity" type="number" min="1" value="1" class="input" />
          </div>
          <div>
            <label class="label">상태</label>
            <select id="inst-status" class="input">
              <option value="생육중">생육중</option>
              <option value="파종">파종</option>
              <option value="모종">모종</option>
              <option value="구근">구근</option>
              <option value="삽목">삽목</option>
              <option value="묘목">묘목</option>
            </select>
          </div>
        </div>
        <div>
          <label class="label">심은 날짜</label>
          <input id="inst-planted-date" type="date" class="input" />
        </div>
        <p id="inst-error" class="hidden text-sm text-red-500"></p>
        <button onclick="doPlantInstance()" class="w-full btn-primary py-3">심기 완료</button>
      </div>
    </div>
  </div>

  <!-- 컨텍스트 메뉴 닫기용 오버레이 -->
  <div id="ctx-overlay" class="hidden fixed inset-0 z-40" onclick="closeCtxMenu()"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/user.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/plants.js"></script>
  <script src="js/locations.js"></script>
  <script src="js/garden.js"></script>
  <script src="js/mybook.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/plant-finder.js"></script>
  <script>
    // ═══════════════════════════════════════════════════
    // 상태 / 데이터
    // ═══════════════════════════════════════════════════
    let _allMyPlants    = []    // 전체 my_plants 원본
    let _selectedCat    = ''
    let _debounceTimer  = null
    let _myPlantLocMap  = {}    // my_plant_id → [{ label, locationId }, ...]
    let _plantLocMap    = {}    // plant_id → [{ label, locationId }, ...]

    // ── 카테고리 탭 ────────────────────────────────────
    function getCatsFromList(list) {
      const ORDER = ['장미','허브','꽃','나무','그라스','구근','채소']
      const set = new Set(list.map(m => m.plants?.category).filter(Boolean))
      return [...set].sort((a, b) => {
        const ai = ORDER.indexOf(a), bi = ORDER.indexOf(b)
        if (ai === -1 && bi === -1) return a.localeCompare(b)
        if (ai === -1) return 1; if (bi === -1) return -1
        return ai - bi
      })
    }

    function renderCategoryTabs(cats) {
      const bar = document.getElementById('cat-tabs')
      const allBtn = document.getElementById('cat-tab-all')
      allBtn.classList.toggle('active', !_selectedCat)
      bar.innerHTML = cats.map(c => `
        <button data-cat="${c}" onclick="selectCategory('${c}')"
          class="cat-tab-btn ${c === _selectedCat ? 'active' : ''}">
          ${c}
        </button>`).join('')
      bar.removeEventListener('scroll', updateCategoryArrow)
      bar.addEventListener('scroll', updateCategoryArrow, { passive: true })
      setTimeout(updateCategoryArrow, 0)
    }

    function selectCategory(cat) {
      _selectedCat = cat === '전체' ? '' : cat
      document.getElementById('cat-tab-all')?.classList.toggle('active', !_selectedCat)
      document.querySelectorAll('.cat-tab-btn').forEach(btn =>
        btn.classList.toggle('active', btn.dataset.cat === (_selectedCat || '전체'))
      )
      renderGrid()
    }

    function updateCategoryArrow() {
      const bar = document.getElementById('cat-tabs')
      const next = document.getElementById('cat-tab-next')
      if (!bar || !next) return
      const hasOverflow = bar.scrollWidth > bar.clientWidth + 1
      const isEnd = bar.scrollLeft + bar.clientWidth >= bar.scrollWidth - 1
      next.classList.toggle('hidden', !hasOverflow || isEnd)
      next.classList.toggle('flex', hasOverflow && !isEnd)
    }

    function scrollCategoryTabs() {
      const bar = document.getElementById('cat-tabs')
      if (!bar) return
      bar.scrollBy({ left: 120, behavior: 'smooth' })
      setTimeout(updateCategoryArrow, 300)
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]))
    }

    function addUniqueLocation(map, key, location) {
      if (!key || !location?.label) return
      if (!map[key]) map[key] = []
      const exists = map[key].some(item =>
        item.label === location.label && item.locationId === location.locationId
      )
      if (!exists) map[key].push(location)
    }

    async function loadMyPlantLocations() {
      try {
        const { data } = await window._supabase
          .from('plant_instances')
          .select('plant_id, my_plant_id, location_id, location')
          .eq('user_id', window.MY_USER_ID)

        _myPlantLocMap = {}
        _plantLocMap = {}

        ;(data ?? []).forEach(row => {
          const location = {
            label: row.location || '내 정원',
            locationId: row.location_id || ''
          }
          addUniqueLocation(_myPlantLocMap, row.my_plant_id, location)
          addUniqueLocation(_plantLocMap, row.plant_id, location)
        })
      } catch (_) {
        _myPlantLocMap = {}
        _plantLocMap = {}
      }
    }

    function getLocationsForMyPlant(mp) {
      const byMyPlant = _myPlantLocMap[mp.id] ?? []
      const byPlant = _plantLocMap[mp.plant_id || mp.plants?.id] ?? []
      const merged = []
      ;[...byMyPlant, ...byPlant].forEach(loc => {
        if (!merged.some(item => item.label === loc.label && item.locationId === loc.locationId)) {
          merged.push(loc)
        }
      })
      return merged
    }

    function locationHref(loc) {
      return loc?.locationId ? `flowerbed.html?loc=${encodeURIComponent(loc.locationId)}` : 'garden.html'
    }

    function formatPlantName(name) {
      const safeName = escapeHtml(name).trim()
      const parenMatch = safeName.match(/^(.+?)[(（]\s*(.+?)\s*[)）]$/)
      if (parenMatch) {
        return `${parenMatch[1].trim()}<br>${parenMatch[2].trim()}`
      }
      return safeName
    }

    // ── 검색 ───────────────────────────────────────────
    function debouncedSearch() {
      clearTimeout(_debounceTimer)
      _debounceTimer = setTimeout(renderGrid, 250)
    }

    // ── 카드 렌더 (plants.html 동일 형식) ──────────────
    function myPlantCard(mp) {
      const plant = mp.plants
      const name  = mp.nickname || plant?.name || '이름 없음'
      const url   = window.myPlantThumb(mp)
      const plantId = plant?.id ?? ''
      const detailHref = `plant-detail.html#${plantId}`

      const photoContent = url
        ? `<a href="${detailHref}" class="plant-photo-link block w-full h-full no-underline">
             <div class="plant-img-skeleton absolute inset-0 flex items-center justify-center animate-pulse">
               <span class="text-2xl opacity-20">🌿</span>
             </div>
             <img src="${url}" alt="${escapeHtml(name)}"
               class="w-full h-full object-cover opacity-0 transition-opacity duration-300"
               onload="this.classList.remove('opacity-0'); this.previousElementSibling?.remove()"
               onerror="this.closest('.plant-photo-link').innerHTML='<div class=\\'w-full h-full flex items-center justify-center text-4xl\\'>🌿</div>'" />
           </a>`
        : `<a href="${detailHref}" class="block w-full h-full no-underline">
             <div class="w-full h-full flex items-center justify-center text-4xl">🌿</div>
           </a>`

      const imgEl = `
        <div class="plant-img-wrap w-full aspect-square overflow-hidden rounded-xl bg-green-50 relative mb-2">
          ${photoContent}
          <button onclick="openCtxMenu(event,'${mp.id}','${plantId}')"
            class="absolute top-2 right-2 w-7 h-7 flex items-center justify-center rounded-full bg-white/55 hover:bg-white/80 text-gray-500 text-lg leading-none shadow-sm z-10"
            aria-label="메뉴">⋯</button>
        </div>`

      const locs = getLocationsForMyPlant(mp)
      const locsEl = locs.length > 0
        ? `<div class="flex gap-1 mt-1 items-center">
             <a href="${locationHref(locs[0])}" class="text-xs bg-green-50 text-green-700 px-1.5 py-0.5 rounded-full leading-tight truncate max-w-[80%] no-underline">${escapeHtml(locs[0].label)}</a>
             ${locs.length > 1 ? `<a href="${locationHref(locs[0])}" title="${escapeHtml(locs.map(l => l.label).join(', '))}" class="text-xs text-gray-400 flex-shrink-0 hover:text-green-600 no-underline">+${locs.length - 1}</a>` : ''}
           </div>`
        : ''

      return `
        <div data-my-card class="relative bg-white rounded-2xl p-3 shadow-sm border border-gray-100 hover:shadow-md transition-shadow active:scale-95">
          ${imgEl}
          <a href="${detailHref}" class="block no-underline">
            <p class="text-sm font-semibold text-gray-800 line-clamp-2 min-h-[2.15rem] leading-tight" style="word-break: keep-all !important; overflow-wrap: normal !important; word-wrap: normal !important; white-space: normal;">${formatPlantName(name)}</p>
          </a>
          ${locsEl}
        </div>`
    }

    // ── 그리드 렌더 ────────────────────────────────────
    function renderGrid() {
      const query  = (document.getElementById('search-input').value || '').toLowerCase().trim()
      const grid   = document.getElementById('plant-grid')
      const empty  = document.getElementById('empty')
      const count  = document.getElementById('result-count')

      let list = _allMyPlants

      // 카테고리 필터
      if (_selectedCat) list = list.filter(m => m.plants?.category === _selectedCat)

      // 검색 필터 (이름, nickname 포함)
      if (query) list = list.filter(m => {
        const name = (m.nickname || m.plants?.name || '').toLowerCase()
        return name.includes(query)
      })

      if (list.length === 0) {
        grid.classList.add('hidden'); empty.classList.remove('hidden')
        count.textContent = ''
      } else {
        grid.innerHTML = list.map(myPlantCard).join('')
        grid.classList.remove('hidden'); empty.classList.add('hidden')
        count.textContent = `${list.length}개의 식물`
      }
    }

    // ── 전체 로드 ──────────────────────────────────────
    async function loadMybook() {
      const grid    = document.getElementById('plant-grid')
      const loading = document.getElementById('loading')
      const empty   = document.getElementById('empty')
      grid.classList.add('hidden'); empty.classList.add('hidden'); loading.classList.remove('hidden')

      try {
        _allMyPlants = await myPlantsApi.list()
        await loadMyPlantLocations()
        loading.classList.add('hidden')

        // 카테고리 탭 업데이트
        const cats = getCatsFromList(_allMyPlants)
        renderCategoryTabs(cats)
        // 첫 카테고리 자동 선택 (없으면 '전체')
        if (cats.length > 0 && !_selectedCat) {
          _selectedCat = ''  // 전체로 시작
        }

        renderGrid()
      } catch (err) {
        loading.classList.add('hidden')
        document.getElementById('result-count').textContent = '불러오기 실패: ' + err.message
      }
    }

    // ── sticky 탭 top 계산 ────────────────────────────
    function fixTabTop() {
      const nav    = document.querySelector('nav')
      const search = document.getElementById('search-bar')
      const tabBar = document.getElementById('cat-tab-bar')
      if (!nav || !search || !tabBar) return
      const navH = nav.offsetHeight
      search.style.top = navH + 'px'
      tabBar.style.top = navH + search.offsetHeight + 'px'
      updateCategoryArrow()
    }

    // ═══════════════════════════════════════════════════
    // Phase 6 — 컨텍스트 메뉴
    // ═══════════════════════════════════════════════════
    function openCtxMenu(e, myPlantId, plantId) {
      e.preventDefault(); e.stopPropagation()
      document.querySelectorAll('.ctx-menu').forEach(m => m.remove())
      const btn  = e.currentTarget
      const host = btn.closest('[data-my-card]') || btn.parentElement
      const menu = document.createElement('div')
      menu.className = 'ctx-menu'
      menu.innerHTML = `
        <button class="ctx-item" onclick="closeCtxMenu();openInstanceModal('${myPlantId}','${plantId}')">정원에 심기</button>
        <button class="ctx-item danger" onclick="closeCtxMenu();removeFromMybook('${myPlantId}')">도감에서 제거</button>`
      host.style.position = 'relative'
      host.appendChild(menu)
      document.getElementById('ctx-overlay').classList.remove('hidden')
    }
    function closeCtxMenu() {
      document.querySelectorAll('.ctx-menu').forEach(m => m.remove())
      document.getElementById('ctx-overlay').classList.add('hidden')
    }
    async function removeFromMybook(id) {
      if (!confirm('내 도감에서 제거할까요?')) return
      try { await myPlantsApi.remove(id); await loadMybook() }
      catch (err) { alert('제거 실패: ' + err.message) }
    }

    // ── 정원에 심기 모달 ───────────────────────────────
    let _instLocAll = [], _instMyPlantId = null, _instPlantId = null

    async function openInstanceModal(myPlantId, plantId) {
      _instMyPlantId = myPlantId; _instPlantId = plantId
      document.getElementById('inst-error').classList.add('hidden')
      document.getElementById('inst-quantity').value = 1
      document.getElementById('inst-status').value   = '생육중'
      document.getElementById('inst-cultivation-type').value = '노지'
      document.getElementById('inst-planted-date').value = ''
      const l1Sel = document.getElementById('inst-loc-l1')
      try {
        _instLocAll = await locationsApi.getAll()
        const l1List = _instLocAll.filter(l => l.level === 1)
        l1Sel.innerHTML = '<option value="">-- 정원 선택 --</option>' +
          l1List.map(l => `<option value="${l.id}">${l.name}</option>`).join('')
        document.getElementById('inst-l2-wrap').classList.add('hidden')
      } catch (_) {}
      document.getElementById('modal-plant-instance').classList.remove('hidden')
    }
    function closeInstanceModal() { document.getElementById('modal-plant-instance').classList.add('hidden') }
    function onInstanceBackdropClick(e) { if (e.target === e.currentTarget) closeInstanceModal() }
    function onInstL1Change() {
      const l1Val  = document.getElementById('inst-loc-l1').value
      const l2Wrap = document.getElementById('inst-l2-wrap')
      const l2Sel  = document.getElementById('inst-loc-l2')
      if (!l1Val) { l2Wrap.classList.add('hidden'); return }
      const l2List = _instLocAll.filter(l => l.level === 2 && l.parent_id === l1Val)
      if (l2List.length === 0) { l2Wrap.classList.add('hidden'); return }
      l2Sel.innerHTML = '<option value="">-- 선택 안 함 --</option>' +
        l2List.map(l => `<option value="${l.id}">${l.name}</option>`).join('')
      l2Wrap.classList.remove('hidden')
    }
    async function doPlantInstance() {
      const errEl = document.getElementById('inst-error'); errEl.classList.add('hidden')
      const l2Val = document.getElementById('inst-loc-l2').value
      const l1Val = document.getElementById('inst-loc-l1').value
      const locId = l2Val || l1Val || null
      let locText = null
      if (locId) {
        const loc = _instLocAll.find(l => l.id === locId)
        if (loc?.level === 2) {
          const par = _instLocAll.find(l => l.id === loc.parent_id)
          locText = par ? `${par.name}/${loc.name}` : loc.name
        } else if (loc) { locText = loc.name }
      }
      try {
        await gardenApi.insert({
          plant_id: _instPlantId || null, my_plant_id: _instMyPlantId || null,
          location_id: locId, location: locText,
          quantity:     parseInt(document.getElementById('inst-quantity').value) || 1,
          status:       document.getElementById('inst-status').value || '생육중',
          cultivation_type: document.getElementById('inst-cultivation-type').value || '노지',
          planted_date: document.getElementById('inst-planted-date').value || null,
        })
        await loadMyPlantLocations()
        renderGrid()
        closeInstanceModal()
        alert('정원에 심었습니다!')
      } catch (err) { errEl.textContent = err.message; errEl.classList.remove('hidden') }
    }

    // ═══════════════════════════════════════════════════
    // Phase 4 — 전체 도감 모달
    // ═══════════════════════════════════════════════════
    let _catalogCatFilter = '', _catalogTimer = null, _myPlantIdSet = new Set()
    let _catalogAllList = []   // 전체 식물 목록 캐시 (탭/검색은 클라이언트 필터링)

    async function openCatalogModal() {
      document.getElementById('modal-catalog').classList.remove('hidden')
      document.getElementById('catalog-search').value = ''
      _catalogCatFilter = ''
      _myPlantIdSet = new Set(_allMyPlants.map(m => m.plant_id))

      // 최초 1회만 DB 조회, 이후 캐시 재사용
      if (_catalogAllList.length === 0) {
        const grid = document.getElementById('catalog-grid'), loading = document.getElementById('catalog-loading')
        const empty = document.getElementById('catalog-empty')
        grid.classList.add('hidden'); empty.classList.add('hidden'); loading.classList.remove('hidden')
        try {
          _catalogAllList = await plantsApi.list('', '')
          document.getElementById('catalog-loading').classList.add('hidden')
        } catch (err) {
          document.getElementById('catalog-loading').classList.add('hidden')
          document.getElementById('catalog-count').textContent = '불러오기 실패: ' + err.message
          return
        }
      }
      renderCatalogCats()
      renderCatalogGrid()
    }
    function closeCatalogModal() { document.getElementById('modal-catalog').classList.add('hidden') }
    function onCatalogBackdropClick(e) { if (e.target === e.currentTarget) closeCatalogModal() }
    function debounceCatalog() { clearTimeout(_catalogTimer); _catalogTimer = setTimeout(renderCatalogGrid, 150) }

    function renderCatalogCats() {
      const ORDER = ['장미','허브','꽃','나무','그라스','구근','채소']
      const catSet = new Set(_catalogAllList.map(p => p.category).filter(Boolean))
      const cats = [...catSet].sort((a, b) => {
        const ai = ORDER.indexOf(a), bi = ORDER.indexOf(b)
        if (ai === -1 && bi === -1) return a.localeCompare(b)
        if (ai === -1) return 1; if (bi === -1) return -1
        return ai - bi
      })
      const bar = document.getElementById('catalog-cats')
      bar.innerHTML = ['전체', ...cats].map(c => `
        <button onclick="selectCatalogCat('${c}')" data-cat="${c}"
          class="px-3 py-1.5 rounded-full text-xs font-semibold border transition-colors whitespace-nowrap
            ${!_catalogCatFilter && c === '전체' ? 'border-green-400 bg-green-50 text-green-700' : 'border-gray-200 text-gray-500 hover:border-green-300'}">
          ${c}</button>`).join('')
    }
    function selectCatalogCat(cat) {
      _catalogCatFilter = cat === '전체' ? '' : cat
      document.querySelectorAll('#catalog-cats button').forEach(b => {
        const active = b.dataset.cat === cat
        b.className = `px-3 py-1.5 rounded-full text-xs font-semibold border transition-colors whitespace-nowrap ${active ? 'border-green-400 bg-green-50 text-green-700' : 'border-gray-200 text-gray-500 hover:border-green-300'}`
      })
      renderCatalogGrid()   // DB 호출 없이 클라이언트 필터링만
    }
    function renderCatalogGrid() {
      const grid  = document.getElementById('catalog-grid')
      const empty = document.getElementById('catalog-empty')
      const count = document.getElementById('catalog-count')
      const loading = document.getElementById('catalog-loading')
      loading.classList.add('hidden')

      const query = (document.getElementById('catalog-search').value || '').trim().toLowerCase()
      let list = _catalogAllList
      if (_catalogCatFilter) list = list.filter(p => p.category === _catalogCatFilter)
      if (query)             list = list.filter(p => p.name.toLowerCase().includes(query))

      count.textContent = `${list.length}개의 식물`
      if (list.length === 0) { grid.classList.add('hidden'); empty.classList.remove('hidden'); return }

      grid.innerHTML = list.map(p => {
        const url = window.plantImageUrl(p)
        const already = _myPlantIdSet.has(p.id)
        const imgEl = url
          ? `<img src="${url}" alt="${p.name}" class="w-full h-full object-cover" loading="lazy" />`
          : `<div class="w-full h-full flex items-center justify-center text-4xl">🌿</div>`
        return `
          <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100">
            <p class="text-sm font-semibold text-gray-800 mb-2 line-clamp-2 min-h-[2.5rem] leading-tight">${p.name}</p>
            <div class="plant-img-wrap w-full aspect-square overflow-hidden rounded-xl bg-green-50 mb-2">${imgEl}</div>
            <p class="text-xs text-gray-400 mb-2">${p.category ?? ''}</p>
            ${already
              ? `<div class="w-full text-center text-xs text-green-600 font-semibold py-1.5 border border-green-200 rounded-lg bg-green-50">이미 추가됨</div>`
              : `<button onclick="addToCatalog('${p.id}')" class="w-full text-xs text-green-700 font-semibold py-1.5 border border-green-300 rounded-lg hover:bg-green-50 transition-colors">내 도감에 추가</button>`}
          </div>`
      }).join('')
      grid.classList.remove('hidden'); empty.classList.add('hidden')
    }
    async function addToCatalog(plantId) {
      try {
        await myPlantsApi.add(plantId)
        _myPlantIdSet.add(plantId)
        renderCatalogGrid()   // 깜빡임 없이 버튼만 교체
        loadMybook()          // 배경에서 내 도감 갱신
      } catch (err) { alert('추가 실패: ' + err.message) }
    }

    // ═══════════════════════════════════════════════════
    // Phase 5 — 식물 추가 (AI 생성)
    // ═══════════════════════════════════════════════════
    let _foundList = [], _addPlantName = ''

    function openAddPlantModal() {
      document.getElementById('modal-add-plant').classList.remove('hidden')
      document.getElementById('add-plant-name').value = ''
      document.getElementById('add-plant-status').classList.add('hidden')
      document.getElementById('add-plant-found').classList.add('hidden')
      document.getElementById('add-plant-error').classList.add('hidden')
      _foundList = []; _addPlantName = ''
      setTimeout(() => document.getElementById('add-plant-name').focus(), 100)
    }
    function closeAddPlantModal() { document.getElementById('modal-add-plant').classList.add('hidden') }
    function onAddPlantBackdropClick(e) { if (e.target === e.currentTarget) closeAddPlantModal() }

    async function doAddPlant() {
      const name     = document.getElementById('add-plant-name').value.trim()
      const statusEl = document.getElementById('add-plant-status')
      const errorEl  = document.getElementById('add-plant-error')
      const foundEl  = document.getElementById('add-plant-found')
      if (!name) { alert('식물 이름을 입력해주세요.'); return }
      _addPlantName = name
      statusEl.textContent = '도감에서 검색 중...'; statusEl.classList.remove('hidden')
      errorEl.classList.add('hidden'); foundEl.classList.add('hidden'); _foundList = []
      try {
        const existing = await plantsApi.list(name, '')
        if (existing.length > 0) {
          _foundList = existing
          statusEl.textContent = `검색 결과 ${existing.length}개`
          renderFoundList()
          document.getElementById('found-ai-btn').classList.remove('hidden')
          foundEl.classList.remove('hidden')
          return
        }
        // 결과 없음 → AI 자동 생성
        statusEl.textContent = '도감에 없음 — AI로 식물 정보를 생성 중...'
        await runAiGenerate(name, statusEl, errorEl)
      } catch (err) {
        statusEl.classList.add('hidden')
        errorEl.textContent = err.message; errorEl.classList.remove('hidden')
      }
    }

    function renderFoundList() {
      const alreadySet = new Set(_allMyPlants.map(m => m.plant_id))
      document.getElementById('found-list').innerHTML = _foundList.map(p => {
        const url = window.plantImageUrl(p)
        const already = alreadySet.has(p.id)
        return `
          <div class="border border-green-200 rounded-xl p-3 bg-green-50 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl overflow-hidden bg-green-100 flex-shrink-0 flex items-center justify-center">
              ${url ? `<img src="${url}" class="w-full h-full object-cover" loading="lazy" />` : '<span class="text-xl">🌿</span>'}
            </div>
            <div class="flex-1 min-w-0">
              <p class="font-semibold text-gray-800 text-sm truncate">${p.name}</p>
              <p class="text-xs text-gray-500">${p.category ?? ''}</p>
            </div>
            ${already
              ? `<span class="text-xs text-green-600 font-semibold px-3 py-1.5 border border-green-200 rounded-lg bg-white whitespace-nowrap">추가됨</span>`
              : `<button onclick="addFoundPlant('${p.id}')" class="btn-primary text-xs px-3 py-1.5 flex-shrink-0 whitespace-nowrap">추가</button>`}
          </div>`
      }).join('')
    }

    async function addFoundPlant(plantId) {
      try {
        await myPlantsApi.add(plantId)
        _allMyPlants = await myPlantsApi.list()   // 로컬 상태 갱신
        renderFoundList()                          // 버튼 → "추가됨" 즉시 반영
        renderGrid()                               // 메인 그리드 업데이트
      } catch (err) { alert('추가 실패: ' + err.message) }
    }

    async function doAiGenerate() {
      const statusEl = document.getElementById('add-plant-status')
      const errorEl  = document.getElementById('add-plant-error')
      document.getElementById('add-plant-found').classList.add('hidden')
      statusEl.textContent = 'AI로 식물 정보를 생성 중...'; statusEl.classList.remove('hidden')
      errorEl.classList.add('hidden')
      try { await runAiGenerate(_addPlantName, statusEl, errorEl) }
      catch (err) { statusEl.classList.add('hidden'); errorEl.textContent = err.message; errorEl.classList.remove('hidden') }
    }

    async function runAiGenerate(name, statusEl, errorEl) {
      const payload = await window.aiUtil.generatePlantData(name, msg => { statusEl.textContent = msg })
      statusEl.textContent = 'plants 테이블에 등록 중...'
      const { data: newPlant, error: insErr } = await window._supabase
        .from('plants').insert(payload).select('id, name, category').single()
      if (insErr) throw insErr
      statusEl.textContent = '내 도감에 추가 중...'
      await myPlantsApi.add(newPlant.id)
      statusEl.textContent = `"${newPlant.name}" 등록 및 추가 완료!`
      _catalogAllList = []   // 전체 도감 캐시 초기화
      _allMyPlants = await myPlantsApi.list()
      renderGrid()
      setTimeout(closeAddPlantModal, 1500)
    }

    // ═══════════════════════════════════════════════════
    // 초기화
    // ═══════════════════════════════════════════════════
    ;(async () => {
      fixTabTop()
      window.addEventListener('resize', fixTabTop)
      await loadMybook()
    })()
  </script>
</body>
</html>
