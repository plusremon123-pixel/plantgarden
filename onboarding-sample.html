<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>온보딩 디자인 샘플</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)),
        url('assets/onboarding/garden-onboarding-figma-bg.png');
      background-size: cover;
      background-position: center top;
    }
    .glass-card {
      background: rgba(255,255,255,.60);
      box-shadow: 0 22px 46px rgba(87,66,21,.12);
      backdrop-filter: blur(2px);
    }
    .choice {
      min-height: 39px;
      border: 1px solid #DDE3C9;
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(4px);
      word-break: keep-all;
      line-height: 1.25;
    }
  </style>
</head>
<body class="min-h-screen text-gray-950">
  <main class="relative mx-auto min-h-screen w-full max-w-md px-0 py-0">
    <section class="glass-card mx-auto mt-[220px] w-[calc(100%-52px)] max-w-[309px] rounded-[20px] px-[30px] py-[30px]">
      <h1 class="text-[23px] font-bold leading-[1.28] text-[#41500D]">정원의 이름을 정해주세요</h1>
      <p class="mt-3 text-[15px] font-semibold leading-[1.45] text-[#898F72]">관리할 정원의 이름을 적어주세요.<br />(추후 수정 가능)</p>

      <div class="mt-5 grid grid-cols-2 gap-x-[22px] gap-y-[11px]">
        <button class="choice rounded-[10px] bg-[#80962F] px-3 py-2 text-[15px] font-bold text-white">우리집</button>
        <button class="choice rounded-[10px] px-3 py-2 text-[15px] font-bold text-[#3D4A0E]">시골집</button>
        <button class="choice rounded-[10px] px-3 py-2 text-[15px] font-bold text-[#3D4A0E]">테라스</button>
        <button class="choice rounded-[10px] px-3 py-2 text-[15px] font-bold text-[#3D4A0E]">하우스</button>
        <button class="choice rounded-[10px] px-3 py-2 text-[15px] font-bold text-[#3D4A0E]">텃밭</button>
        <button class="choice rounded-[10px] px-3 py-2 text-[15px] font-bold text-[#3D4A0E]">직접 입력</button>
      </div>
    </section>

    <footer class="fixed bottom-[25px] left-1/2 grid w-[calc(100%-52px)] max-w-[309px] -translate-x-1/2 grid-cols-2 gap-3">
      <button class="h-[45px] rounded-[15px] border border-white/70 bg-white/72 px-5 text-[16px] font-bold text-[#3D4A0E] shadow-lg shadow-white/15 backdrop-blur">이전</button>
      <button class="h-[45px] rounded-[15px] bg-[#DEA51A] px-5 text-[16px] font-bold text-white shadow-lg shadow-[#DEA51A]/20">다음</button>
    </footer>
  </main>
</body>
</html>
