<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>온보딩 디자인 샘플</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      background:
        linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.16) 38%, rgba(236,253,245,.44)),
        url('assets/onboarding/garden-onboarding-bg.png');
      background-size: cover;
      background-position: center top;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 80%, rgba(255,255,255,.72), rgba(255,255,255,.32) 44%, rgba(255,255,255,.04) 76%);
      pointer-events: none;
    }
    .glass-card {
      background: rgba(255,252,242,.64);
      border: 1px solid rgba(255,255,255,.60);
      box-shadow: 0 24px 58px rgba(81,71,42,.16);
      backdrop-filter: blur(12px);
    }
    .choice {
      min-height: 3.25rem;
      border: 1px solid rgba(183,171,115,.42);
      background: rgba(255,252,242,.48);
      backdrop-filter: blur(12px);
      word-break: keep-all;
      line-height: 1.35;
    }
  </style>
</head>
<body class="min-h-screen text-gray-950">
  <main class="relative z-[1] mx-auto flex min-h-screen w-full max-w-md flex-col justify-end px-5 py-5">
    <header class="fixed left-1/2 top-4 z-[2] w-full max-w-md -translate-x-1/2 px-5">
      <div class="flex items-center justify-between">
        <span class="rounded-full border border-white/60 bg-white/42 px-3 py-2 text-xs font-black text-[#51472a] shadow-sm backdrop-blur-xl">처음 화면</span>
        <span class="rounded-full border border-white/60 bg-white/42 px-3 py-2 text-xs font-black text-[#51472a] shadow-sm backdrop-blur-xl">2 / 9</span>
      </div>
      <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-white/42 backdrop-blur">
        <div class="h-full w-[22%] rounded-full bg-[#75683a]"></div>
      </div>
    </header>

    <section class="glass-card rounded-[2rem] p-5">
      <h1 class="text-[1.7rem] font-black leading-tight">정원 관리를<br />시작해볼까요?</h1>
      <p class="mt-4 text-base leading-7 text-gray-600">처음이라면 정원집사가 정원 만들기를 도와드릴게요.</p>

      <div class="mt-5 grid grid-cols-2 gap-3">
        <button class="choice rounded-2xl px-4 py-3 text-base font-black text-[#51472a]">시골집</button>
        <button class="choice rounded-2xl px-4 py-3 text-base font-black text-[#51472a]">우리집</button>
        <button class="choice rounded-2xl px-4 py-3 text-base font-black text-[#51472a]">베란다</button>
        <button class="choice rounded-2xl px-4 py-3 text-base font-black text-[#51472a]">테라스</button>
        <button class="choice rounded-2xl px-4 py-3 text-base font-black text-[#51472a]">텃밭</button>
        <button class="choice rounded-2xl px-4 py-3 text-base font-black text-[#51472a]">하우스</button>
      </div>
    </section>

    <footer class="mt-4 grid grid-cols-2 gap-3">
      <button class="rounded-2xl border border-white/70 bg-white/48 px-5 py-4 text-base font-black text-[#51472a] backdrop-blur">‹ 이전</button>
      <button class="rounded-2xl bg-[#75683a] px-5 py-4 text-base font-black text-white shadow-lg shadow-[#51472a]/20">다음 ›</button>
    </footer>
  </main>
</body>
</html>
