<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모두의 정원 시작하기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .00), rgba(255, 255, 255, .18) 36%, rgba(236, 253, 245, .44)),
        url('../assets/onboarding/garden-onboarding-bg.png');
      background-size: cover;
      background-position: center top;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 82%, rgba(255,255,255,.72), rgba(255,255,255,.30) 42%, rgba(255,255,255,.04) 74%);
      pointer-events: none;
    }
    .choice-card {
      box-shadow: 0 24px 60px rgba(20, 83, 45, .16);
    }
  </style>
</head>
<body class="min-h-screen text-gray-900">
  <main class="relative z-[1] mx-auto flex min-h-screen w-full max-w-md flex-col justify-end px-5 py-8">
    <section class="choice-card overflow-hidden rounded-[2rem] border border-white/70 bg-white/72 backdrop-blur-xl">
      <div class="p-6">
        <p class="mb-2 text-sm font-black tracking-wide text-green-700">모두의 정원</p>
        <h1 class="text-[1.9rem] font-black leading-tight text-gray-950">정원 관리를<br />시작해볼까요?</h1>
        <p class="mt-3 text-base leading-7 text-gray-600">
          처음이라면 정원집사가 정원 만들기를 도와드릴게요.
          사용 중이라면 로그인해서 이어서 관리해요.
        </p>

        <div class="mt-6 space-y-3">
          <button type="button" onclick="goOnboarding()"
            class="w-full rounded-2xl bg-green-600/88 px-5 py-4 text-left text-white shadow-lg shadow-green-200/60 transition active:scale-[.99]">
            <span class="block text-xl font-black">처음이에요</span>
            <span class="mt-1 block text-sm font-semibold text-green-50">내 정원을 함께 만들어볼게요.</span>
          </button>

          <button type="button" onclick="location.href='../login/'"
            class="w-full rounded-2xl border border-green-200/70 bg-green-50/52 px-5 py-4 text-left text-green-900 backdrop-blur transition active:scale-[.99]">
            <span class="block text-xl font-black">이미 사용 중이에요</span>
            <span class="mt-1 block text-sm font-semibold text-green-700">로그인하고 내 정원을 이어서 관리해요.</span>
          </button>

        </div>
      </div>
    </section>
  </main>

  <script>
    function goOnboarding(guest) {
      location.href = guest ? '../onboarding/garden/?guest=1' : '../onboarding/garden/'
    }
  </script>
</body>
</html>
