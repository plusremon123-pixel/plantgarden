<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모두의 정원 시작하기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background:
        linear-gradient(180deg, rgba(255, 248, 220, .68), rgba(236, 253, 245, .86)),
        url('../assets/garden/dashboard-garden-bg.png');
      background-size: cover;
      background-position: center;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,.78) 72%);
      pointer-events: none;
    }
    .choice-card {
      box-shadow: 0 24px 60px rgba(20, 83, 45, .16);
    }
    .garden-preview {
      min-height: 10rem;
      background:
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(22,101,52,.08)),
        url('../assets/garden/dashboard-garden-bg.png');
      background-size: cover;
      background-position: center;
    }
  </style>
</head>
<body class="min-h-screen text-gray-900">
  <main class="relative z-[1] mx-auto flex min-h-screen w-full max-w-md flex-col justify-center px-5 py-8">
    <section class="choice-card overflow-hidden rounded-[2rem] border border-white/85 bg-white/90 backdrop-blur-xl">
      <div class="garden-preview"></div>
      <div class="p-6">
        <p class="mb-2 text-sm font-black text-green-700">모두의 정원</p>
        <h1 class="text-[1.75rem] font-black leading-tight text-gray-950">정원을 처음 시작하시나요?</h1>
        <p class="mt-3 text-base leading-7 text-gray-600">
          처음이라면 정원집사가 내 정원 만들기를 도와드릴게요.
          이미 사용 중이라면 로그인 후 이어서 관리할 수 있어요.
        </p>

        <div class="mt-6 space-y-3">
          <button type="button" onclick="goOnboarding()"
            class="w-full rounded-2xl bg-green-600 px-5 py-4 text-left text-white shadow-lg shadow-green-200 transition active:scale-[.99]">
            <span class="block text-xl font-black">처음이에요</span>
            <span class="mt-1 block text-sm font-semibold text-green-50">내 정원을 함께 만들어볼게요.</span>
          </button>

          <button type="button" onclick="location.href='../login/'"
            class="w-full rounded-2xl border border-green-100 bg-green-50 px-5 py-4 text-left text-green-900 transition active:scale-[.99]">
            <span class="block text-xl font-black">이미 사용 중이에요</span>
            <span class="mt-1 block text-sm font-semibold text-green-700">로그인하고 내 정원을 이어서 관리해요.</span>
          </button>

          <button type="button" onclick="goOnboarding(true)"
            class="w-full rounded-2xl border border-gray-200 bg-white px-5 py-4 text-left text-gray-800 transition active:scale-[.99]">
            <span class="block text-xl font-black">로그인 없이 시작하기</span>
            <span class="mt-1 block text-sm font-semibold text-gray-500">나중에 가입해도 정원 정보를 이어갈 수 있어요.</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <script>
    function goOnboarding(guest) {
      location.href = guest ? '../onboarding/garden/?guest=1' : '../onboarding/garden/'
    }
  </script>
</body>
</html>
