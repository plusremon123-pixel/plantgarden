<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>식물 도감 — 식물 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .tab-scroll::-webkit-scrollbar { display: none; }
    .tab-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .cat-tab-btn { color: #9ca3af; border-color: transparent; }
    .cat-tab-btn.active { color: #15803d; border-color: #16a34a; background: #f0fdf4; }
  </style>
</head>
<body class="min-h-screen bg-gray-50">

  <!-- ── 네비게이션 (garden.html 동일) ── -->
  <nav class="bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between sticky top-0 z-20 shadow-sm">
    <a href="index.html" class="text-lg font-bold text-green-800">🌿 식물 관리</a>
    <div class="flex gap-3 text-sm">
      <a href="plants.html"    class="font-semibold text-green-700 border-b-2 border-green-600 pb-0.5">도감</a>
      <a href="garden.html"    class="text-gray-400 hover:text-green-700">내 정원</a>
      <a href="flowerbed.html" class="text-gray-400 hover:text-green-700">내 꽃밭</a>
      <a href="admin.html"     class="text-gray-400 hover:text-green-700">관리자</a>
    </div>
  </nav>

  <!-- ── 검색바 (스크롤과 함께 올라감) ── -->
  <div class="bg-white border-b border-gray-100 px-4 py-3">
    <div class="max-w-7xl mx-auto">
      <input id="search-input" type="text" placeholder="식물 이름으로 검색..."
        class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-400 bg-gray-50"
        oninput="debouncedSearch()" />
    </div>
  </div>

  <!-- ── 카테고리 탭 (sticky, 탭만 고정) ── -->
  <div id="cat-tab-bar" class="bg-white border-b border-gray-100 sticky z-20">
    <div id="cat-tabs" class="max-w-7xl mx-auto flex tab-scroll overflow-x-auto">
      <!-- JS 렌더 -->
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-4 py-4 pb-12">

    <!-- 결과 수 -->
    <p id="result-count" class="text-xs text-gray-400 mb-3"></p>

    <!-- 로딩 -->
    <div id="loading" class="text-center py-20 text-green-400">
      <div class="text-4xl mb-2">🌱</div>
      <p class="text-sm">불러오는 중...</p>
    </div>

    <!-- 카드 그리드 (2열) -->
    <div id="plant-grid" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3"></div>

    <!-- 빈 결과 -->
    <div id="empty" class="hidden text-center py-20 text-gray-400">
      <div class="text-4xl mb-2">🔍</div>
      <p class="text-sm">검색 결과가 없습니다.</p>
    </div>

  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/plants.js"></script>
  <script>
    let debounceTimer = null
    let selectedCategory = ''
    let plantLocMap = {}   // plant_id → ['시골/화단', ...]

    async function loadPlantLocations() {
      try {
        const { data } = await window._supabase
          .from('plant_instances')
          .select('plant_id, location')
        plantLocMap = {}
        ;(data ?? []).forEach(row => {
          if (!row.plant_id || !row.location) return
          if (!plantLocMap[row.plant_id]) plantLocMap[row.plant_id] = []
          if (!plantLocMap[row.plant_id].includes(row.location))
            plantLocMap[row.plant_id].push(row.location)
        })
      } catch (_) {}
    }

    function debouncedSearch() {
      clearTimeout(debounceTimer)
      debounceTimer = setTimeout(loadPlants, 300)
    }

    function selectCategory(cat) {
      selectedCategory = cat
      // 탭 active 업데이트
      document.querySelectorAll('.cat-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cat === cat)
      })
      loadPlants()
    }

    function renderCategoryTabs(cats) {
      const bar = document.getElementById('cat-tabs')
      const all = ['', ...cats]
      bar.innerHTML = all.map(c => `
        <button data-cat="${c}"
          onclick="selectCategory('${c}')"
          class="cat-tab-btn flex-1 min-w-fit px-3 py-2.5 text-xs font-semibold border-b-2 transition-colors whitespace-nowrap text-center ${c === selectedCategory ? 'active' : ''}">
          ${c === '' ? '전체' : c}
        </button>`).join('')
    }

    function plantCard(p) {
      const imgUrl = plantImageUrl(p, 400, 400)
      const imgEl  = imgUrl
        ? `<div class="plant-img-wrap w-full aspect-square overflow-hidden rounded-xl bg-green-50 relative mb-2">
             <div class="plant-img-skeleton absolute inset-0 flex items-center justify-center animate-pulse">
               <span class="text-2xl opacity-20">🌿</span>
             </div>
             <img src="${imgUrl}" alt="${p.name}"
               class="w-full h-full object-cover opacity-0 transition-opacity duration-300"
               onload="this.classList.remove('opacity-0'); this.previousElementSibling.remove()"
               onerror="this.closest('.plant-img-wrap').innerHTML='<div class=\'w-full h-full flex items-center justify-center text-4xl\'>🌿</div>'" />
           </div>`
        : `<div class="w-full aspect-square rounded-xl bg-green-100 flex items-center justify-center text-4xl mb-2">🌿</div>`

      const locs = plantLocMap[p.id] ?? []
      const locsEl = locs.length > 0
        ? `<div class="flex gap-1 mt-2 items-center">
             <span class="text-xs bg-green-50 text-green-700 px-1.5 py-0.5 rounded-full leading-tight truncate max-w-[80%]">${locs[0]}</span>
             ${locs.length > 1 ? `<span class="text-xs text-gray-400 flex-shrink-0">+${locs.length - 1}</span>` : ''}
           </div>`
        : ''

      return `
        <a href="plant-detail.html#${p.id}"
           class="block bg-white rounded-2xl p-3 shadow-sm border border-gray-100 hover:shadow-md transition-shadow active:scale-95 no-underline">
          <p class="text-sm font-semibold text-gray-800 truncate mb-2">${p.name}</p>
          ${imgEl}
          ${locsEl}
        </a>`
    }

    async function loadPlants() {
      const query    = document.getElementById('search-input').value
      const category = selectedCategory
      const grid     = document.getElementById('plant-grid')
      const loading  = document.getElementById('loading')
      const empty    = document.getElementById('empty')
      const count    = document.getElementById('result-count')

      grid.classList.add('hidden')
      empty.classList.add('hidden')
      loading.classList.remove('hidden')

      try {
        const plants = await plantsApi.list(query, category)
        loading.classList.add('hidden')
        if (plants.length === 0) {
          empty.classList.remove('hidden')
          count.textContent = ''
        } else {
          grid.innerHTML = plants.map(plantCard).join('')
          grid.classList.remove('hidden')
          count.textContent = `${plants.length}개의 식물`
        }
      } catch (err) {
        loading.classList.add('hidden')
        count.textContent = '불러오기 실패: ' + err.message
      }
    }

    async function loadCategories() {
      try {
        const cats = await plantsApi.getCategories()
        renderCategoryTabs(cats)
      } catch (_) {
        renderCategoryTabs([])
      }
    }

    // nav 높이 기준으로 탭 sticky top 계산
    function fixTabTop() {
      const nav = document.querySelector('nav')
      const tabBar = document.getElementById('cat-tab-bar')
      if (nav && tabBar) {
        tabBar.style.top = nav.getBoundingClientRect().height + 'px'
      }
    }

    ;(async () => {
      fixTabTop()
      window.addEventListener('resize', fixTabTop)
      await Promise.all([loadCategories(), loadPlantLocations()])
      await loadPlants()
    })()
  </script>
</body>
</html>
