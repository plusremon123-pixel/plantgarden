<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 정원 — 식물 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .tab-scroll::-webkit-scrollbar { display: none; }
    .tab-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen bg-gray-50">

  <!-- ── 네비게이션 ── -->
  <nav class="bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between sticky top-0 z-20 shadow-sm">
    <a href="index.html" class="text-lg font-bold text-green-800">🌿 식물 관리</a>
    <div class="flex gap-3 text-sm">
      <a href="plants.html"    class="text-gray-400 hover:text-green-700">도감</a>
      <a href="garden.html"    class="font-semibold text-green-700 border-b-2 border-green-600 pb-0.5">내 정원</a>
      <a href="flowerbed.html" class="text-gray-400 hover:text-green-700">내 꽃밭</a>
    </div>
  </nav>

  <!-- ── 헤더 ── -->
  <div class="bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between">
    <h1 class="text-base font-bold text-gray-800">내 정원</h1>
    <button onclick="openGardenModal()"
      class="text-xs font-semibold px-3 py-1.5 rounded-lg border border-green-600 text-green-700 hover:bg-green-50 transition-colors">
      + 정원추가
    </button>
  </div>

  <!-- ── Level 1 탭 ── -->
  <div id="tab-l1-bar" class="bg-white border-b border-gray-100 sticky z-10">
    <div id="tab-l1" class="tab-scroll flex overflow-x-auto px-3 pt-2 pb-0 gap-1"></div>
  </div>

  <!-- ── Level 2 서브탭 ── -->
  <div id="tab-l2-bar" class="bg-white border-b border-gray-100 sticky z-10 flex items-center">
    <button id="tab-l2-prev" onclick="scrollL2Tab(-1)"
      class="hidden flex-shrink-0 w-7 h-8 flex items-center justify-center text-gray-400 hover:text-gray-700 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div id="tab-l2" class="tab-scroll flex overflow-x-auto px-3 py-2 gap-1 flex-1"></div>
    <button id="tab-l2-next" onclick="scrollL2Tab(1)"
      class="hidden flex-shrink-0 w-7 h-8 flex items-center justify-center text-gray-400 hover:text-gray-700 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>

  <main class="max-w-2xl mx-auto px-4 py-4 pb-12">

    <div id="loading" class="text-center py-20 text-green-400">
      <div class="text-4xl mb-2">🌱</div>
      <p class="text-sm">불러오는 중...</p>
    </div>

    <div id="no-location" class="hidden text-center py-20 text-gray-400">
      <div class="text-4xl mb-2">🗺️</div>
      <p class="text-sm">등록된 정원이 없습니다.</p>
      <p class="text-xs mt-1">+ 정원추가 버튼으로 위치를 만들어 보세요.</p>
    </div>

    <div id="content" class="hidden space-y-4">

      <!-- 위치 정보 카드 -->
      <div id="location-info" class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <div class="flex items-start justify-between">
          <div>
            <h2 id="loc-name" class="font-bold text-gray-800 text-base"></h2>
            <div class="flex flex-wrap gap-3 mt-1.5">
              <span id="loc-sun"  class="hidden text-xs text-yellow-600 bg-yellow-50 px-2 py-0.5 rounded-full"></span>
              <span id="loc-note" class="hidden text-xs text-gray-500"></span>
            </div>
          </div>
          <button onclick="openEditLocationModal()"
            class="w-8 h-8 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 text-gray-400 flex items-center justify-center transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- 식물 요약 카드 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <div class="flex items-center justify-between mb-3">
          <p class="text-sm font-semibold text-gray-700">
            식물 <span id="summary-count" class="text-green-600">0</span>종
          </p>
          <a id="flowerbed-link" href="flowerbed.html"
            class="text-xs text-green-600 font-semibold flex items-center gap-0.5">
            꽃밭 관리
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
          </a>
        </div>
        <div id="summary-thumbs" class="flex gap-2.5 overflow-x-auto tab-scroll pb-1 min-h-[5rem] items-start">
          <p class="text-xs text-gray-400 self-center">불러오는 중...</p>
        </div>
      </div>

    </div>
  </main>

  <!-- ══════════════════════════════════════
       정원추가 모달
  ══════════════════════════════════════ -->
  <div id="modal-garden" class="modal-backdrop hidden">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="font-bold text-gray-800">정원 추가</h3>
        <button onclick="closeGardenModal()" class="modal-close">✕</button>
      </div>
      <form id="form-garden" onsubmit="handleAddGarden(event)" class="space-y-3">
        <div>
          <label class="label">위치 레벨</label>
          <div class="flex gap-2">
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="radio" name="garden-level" value="1" checked onchange="toggleParentSelect(this.value)" class="accent-green-600" />
              <span class="text-sm text-gray-700">상위 위치 (예: 시골)</span>
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="radio" name="garden-level" value="2" onchange="toggleParentSelect(this.value)" class="accent-green-600" />
              <span class="text-sm text-gray-700">하위 위치 (예: 화단)</span>
            </label>
          </div>
        </div>
        <div id="parent-select-wrap" class="hidden">
          <label class="label">상위 위치 선택</label>
          <select id="g-parent-id" class="input"><option value="">-- 선택하세요 --</option></select>
        </div>
        <div>
          <label class="label">이름 *</label>
          <input id="g-name" type="text" required placeholder="예: 우측화단" class="input" />
        </div>
        <div>
          <label class="label">일조량</label>
          <select id="g-sunlight" class="input">
            <option value="">선택 안 함</option>
            <option value="직사광선">직사광선 (6시간 이상)</option>
            <option value="반음지">반음지 (3~6시간)</option>
            <option value="음지">음지 (3시간 미만)</option>
            <option value="실내 밝은 곳">실내 밝은 곳</option>
          </select>
        </div>
        <div>
          <label class="label">메모</label>
          <textarea id="g-note" rows="2" placeholder="특이사항, 환경 설명 등..." class="input resize-none"></textarea>
        </div>
        <details class="text-xs text-gray-400 cursor-pointer">
          <summary class="select-none">좌표 입력 (선택)</summary>
          <div class="grid grid-cols-2 gap-2 mt-2">
            <div><label class="label">위도 (lat)</label><input id="g-lat" type="number" step="any" placeholder="37.5665" class="input" /></div>
            <div><label class="label">경도 (lng)</label><input id="g-lng" type="number" step="any" placeholder="126.9780" class="input" /></div>
          </div>
        </details>
        <p id="garden-error" class="text-red-500 text-xs hidden"></p>
        <button type="submit" class="w-full btn-primary py-2.5 rounded-xl text-sm">저장</button>
      </form>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       위치 수정 모달
  ══════════════════════════════════════ -->
  <div id="modal-edit-location" class="modal-backdrop hidden">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="font-bold text-gray-800">위치 수정</h3>
        <button onclick="closeEditLocationModal()" class="modal-close">✕</button>
      </div>
      <form id="form-edit-location" onsubmit="handleEditLocation(event)" class="space-y-3">
        <div>
          <label class="label">이름 *</label>
          <input id="el-name" type="text" required class="input" />
        </div>
        <div>
          <label class="label">일조량</label>
          <select id="el-sunlight" class="input">
            <option value="">선택 안 함</option>
            <option value="직사광선">직사광선 (6시간 이상)</option>
            <option value="반음지">반음지 (3~6시간)</option>
            <option value="음지">음지 (3시간 미만)</option>
            <option value="실내 밝은 곳">실내 밝은 곳</option>
          </select>
        </div>
        <div>
          <label class="label">메모</label>
          <textarea id="el-note" rows="2" class="input resize-none" placeholder="특이사항, 환경 설명 등..."></textarea>
        </div>
        <p id="el-error" class="text-red-500 text-xs hidden"></p>
        <div class="flex gap-3 pt-1">
          <button type="button" onclick="handleDeleteLocation()"
            class="px-4 py-2.5 rounded-xl border border-red-200 text-red-400 text-sm font-semibold hover:bg-red-50 transition-colors">삭제</button>
          <button type="submit" class="flex-1 btn-primary py-2.5 rounded-xl text-sm">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/plants.js"></script>
  <script src="js/locations.js"></script>
  <script src="js/garden.js"></script>
  <script>
    // ════════════════════════════════════════════════
    // 상태
    // ════════════════════════════════════════════════
    const state = {
      level1List: [],
      level2List: [],
      selectedL1: null,
      selectedL2: null,
    }

    // ════════════════════════════════════════════════
    // Sticky top 동적 계산
    // ════════════════════════════════════════════════
    function fixStickyTops() {
      const navH  = document.querySelector('nav')?.getBoundingClientRect().height ?? 57
      const l1Bar = document.getElementById('tab-l1-bar')
      const l2Bar = document.getElementById('tab-l2-bar')
      if (l1Bar) l1Bar.style.top = navH + 'px'
      if (l2Bar) {
        const l1H = l1Bar?.getBoundingClientRect().height ?? 48
        l2Bar.style.top = (navH + l1H) + 'px'
      }
    }
    window.addEventListener('resize', fixStickyTops)

    // ════════════════════════════════════════════════
    // 탭 렌더
    // ════════════════════════════════════════════════
    function renderL1Tabs() {
      document.getElementById('tab-l1').innerHTML = state.level1List.map(loc => `
        <button data-id="${loc.id}" onclick="selectL1('${loc.id}')"
          class="l1-tab flex-shrink-0 px-4 py-2 text-sm font-semibold border-b-2 transition-colors whitespace-nowrap
                 ${state.selectedL1?.id === loc.id ? 'border-green-600 text-green-700' : 'border-transparent text-gray-400 hover:text-gray-600'}">
          ${loc.name}
        </button>`).join('')
    }

    function renderL2Tabs() {
      const bar  = document.getElementById('tab-l2')
      const prev = document.getElementById('tab-l2-prev')
      const next = document.getElementById('tab-l2-next')
      if (state.level2List.length === 0) {
        bar.innerHTML = '<span class="text-xs text-gray-400 py-2 px-1">하위 위치 없음</span>'
        prev.classList.add('hidden'); next.classList.add('hidden')
        return
      }
      bar.innerHTML = state.level2List.map(loc => `
        <button data-id="${loc.id}" onclick="selectL2('${loc.id}')"
          class="l2-tab flex-shrink-0 px-3 py-1 text-xs font-semibold rounded-full transition-colors whitespace-nowrap
                 ${state.selectedL2?.id === loc.id ? 'bg-green-600 text-white' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}">
          ${loc.name}
        </button>`).join('')
      updateL2Arrows()
      bar.addEventListener('scroll', updateL2Arrows, { passive: true })
    }

    function updateL2Arrows() {
      const bar  = document.getElementById('tab-l2')
      const prev = document.getElementById('tab-l2-prev')
      const next = document.getElementById('tab-l2-next')
      const has  = bar.scrollWidth > bar.clientWidth
      prev.classList.toggle('hidden', !has || bar.scrollLeft <= 0)
      next.classList.toggle('hidden', !has || bar.scrollLeft + bar.clientWidth >= bar.scrollWidth - 1)
    }

    function scrollL2Tab(dir) {
      const bar = document.getElementById('tab-l2')
      bar.scrollBy({ left: dir * 120, behavior: 'smooth' })
      setTimeout(updateL2Arrows, 300)
    }

    // ════════════════════════════════════════════════
    // 위치 정보 렌더
    // ════════════════════════════════════════════════
    function renderLocationInfo(loc) {
      document.getElementById('loc-name').textContent = loc.name
      const sunEl  = document.getElementById('loc-sun')
      const noteEl = document.getElementById('loc-note')
      if (loc.sunlight_type) { sunEl.textContent = '☀️ ' + loc.sunlight_type; sunEl.classList.remove('hidden') }
      else sunEl.classList.add('hidden')
      if (loc.note) { noteEl.textContent = loc.note; noteEl.classList.remove('hidden') }
      else noteEl.classList.add('hidden')
    }

    // ════════════════════════════════════════════════
    // 식물 요약
    // ════════════════════════════════════════════════
    function renderPlantSummary(plants) {
      document.getElementById('summary-count').textContent = plants.length
      const thumbs = document.getElementById('summary-thumbs')
      if (plants.length === 0) {
        thumbs.innerHTML = '<p class="text-xs text-gray-400 self-center">등록된 식물이 없습니다.</p>'
        return
      }
      const shown = plants.slice(0, 10)
      const locId = state.selectedL2?.id ?? state.selectedL1?.id ?? ''
      thumbs.innerHTML = shown.map(inst => {
        const p   = inst.plants
        const url = p ? plantImageUrl(p, 80, 80) : null
        return `
          <a href="instance-detail.html#${inst.id}" class="flex-shrink-0 flex flex-col items-center gap-1">
            <div class="w-14 h-14 rounded-xl overflow-hidden bg-green-100 flex items-center justify-center text-xl">
              ${url ? `<img src="${url}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='🌿'" />` : '🌿'}
            </div>
            <p class="text-xs text-gray-600 truncate w-14 text-center">${p?.name ?? ''}</p>
          </a>`
      }).join('')
      if (plants.length > 10) {
        thumbs.innerHTML += `
          <a href="flowerbed.html?loc=${locId}" class="flex-shrink-0 flex flex-col items-center gap-1">
            <div class="w-14 h-14 rounded-xl bg-gray-100 flex items-center justify-center text-sm font-bold text-gray-500">+${plants.length - 10}</div>
            <p class="text-xs text-gray-400 w-14 text-center">더보기</p>
          </a>`
      }
    }

    // ════════════════════════════════════════════════
    // 선택 로직
    // ════════════════════════════════════════════════
    async function selectL1(id, preferL2 = null) {
      state.selectedL1 = state.level1List.find(l => l.id === id) ?? null
      state.selectedL2 = null
      sessionStorage.setItem('garden_l1', id)
      renderL1Tabs()
      try { state.level2List = await locationsApi.getLevel2(id) }
      catch { state.level2List = [] }
      renderL2Tabs()
      const l2Target = preferL2 && state.level2List.find(l => l.id === preferL2)
        ? preferL2 : (state.level2List[0]?.id ?? null)
      if (l2Target) await selectL2(l2Target)
      else {
        state.selectedL2 = null
        renderLocationInfo(state.selectedL1)
        await loadLocationPlants(id)
      }
    }

    async function selectL2(id) {
      state.selectedL2 = state.level2List.find(l => l.id === id) ?? null
      sessionStorage.setItem('garden_l2', id)
      renderL2Tabs()
      if (state.selectedL2) {
        renderLocationInfo(state.selectedL2)
        await loadLocationPlants(id)
      }
    }

    async function loadLocationPlants(locationId) {
      const locId = state.selectedL2?.id ?? state.selectedL1?.id ?? ''
      document.getElementById('flowerbed-link').href = `flowerbed.html?loc=${locationId}`
      document.getElementById('summary-thumbs').innerHTML =
        '<p class="text-xs text-gray-400 self-center">불러오는 중...</p>'
      document.getElementById('content').classList.remove('hidden')
      try {
        const plants = await gardenApi.listByLocation(locationId)
        renderPlantSummary(plants)
      } catch (err) {
        document.getElementById('summary-count').textContent = '?'
        document.getElementById('summary-thumbs').innerHTML =
          `<p class="text-xs text-red-400 self-center">${err.message}</p>`
      }
    }

    // ════════════════════════════════════════════════
    // 정원추가 모달
    // ════════════════════════════════════════════════
    async function openGardenModal() {
      const sel = document.getElementById('g-parent-id')
      sel.innerHTML = '<option value="">-- 선택하세요 --</option>'
      try {
        const l1 = await locationsApi.getLevel1()
        l1.forEach(loc => {
          const opt = document.createElement('option')
          opt.value = loc.id; opt.textContent = loc.name
          sel.appendChild(opt)
        })
      } catch (_) {}
      document.getElementById('modal-garden').classList.remove('hidden')
    }

    function closeGardenModal() {
      document.getElementById('modal-garden').classList.add('hidden')
      document.getElementById('form-garden').reset()
      document.getElementById('garden-error').classList.add('hidden')
      document.getElementById('parent-select-wrap').classList.add('hidden')
    }

    function toggleParentSelect(level) {
      document.getElementById('parent-select-wrap').classList.toggle('hidden', level !== '2')
    }

    async function handleAddGarden(e) {
      e.preventDefault()
      const errEl = document.getElementById('garden-error')
      errEl.classList.add('hidden')
      const level    = parseInt(document.querySelector('input[name="garden-level"]:checked').value)
      const parentId = document.getElementById('g-parent-id').value
      const name     = document.getElementById('g-name').value.trim()
      const sunlight = document.getElementById('g-sunlight').value
      const note     = document.getElementById('g-note').value.trim()
      const lat      = parseFloat(document.getElementById('g-lat').value) || null
      const lng      = parseFloat(document.getElementById('g-lng').value) || null
      if (level === 2 && !parentId) {
        errEl.textContent = '상위 위치를 선택해 주세요.'
        errEl.classList.remove('hidden'); return
      }
      try {
        await locationsApi.insert({ name, level, parent_id: level === 2 ? parentId : null,
          sunlight_type: sunlight || null, note: note || null, lat, lng })
        closeGardenModal()
        await init()
      } catch (err) {
        errEl.textContent = err.message; errEl.classList.remove('hidden')
      }
    }

    // ════════════════════════════════════════════════
    // 위치 수정 모달
    // ════════════════════════════════════════════════
    function openEditLocationModal() {
      const loc = state.selectedL2 ?? state.selectedL1
      if (!loc) return
      document.getElementById('el-name').value     = loc.name ?? ''
      document.getElementById('el-sunlight').value = loc.sunlight_type ?? ''
      document.getElementById('el-note').value     = loc.note ?? ''
      document.getElementById('el-error').classList.add('hidden')
      document.getElementById('modal-edit-location').classList.remove('hidden')
    }

    function closeEditLocationModal() {
      document.getElementById('modal-edit-location').classList.add('hidden')
    }

    async function handleEditLocation(e) {
      e.preventDefault()
      const errEl = document.getElementById('el-error')
      errEl.classList.add('hidden')
      const loc  = state.selectedL2 ?? state.selectedL1
      if (!loc) return
      const name     = document.getElementById('el-name').value.trim()
      const sunlight = document.getElementById('el-sunlight').value
      const note     = document.getElementById('el-note').value.trim()
      if (!name) { errEl.textContent = '이름을 입력해 주세요.'; errEl.classList.remove('hidden'); return }
      try {
        const updated = await locationsApi.update(loc.id, { name, sunlight_type: sunlight || null, note: note || null })
        if (state.selectedL2?.id === loc.id) {
          state.selectedL2 = { ...state.selectedL2, ...updated }
          state.level2List = state.level2List.map(l => l.id === loc.id ? state.selectedL2 : l)
          renderL2Tabs(); renderLocationInfo(state.selectedL2)
        } else if (state.selectedL1?.id === loc.id) {
          state.selectedL1 = { ...state.selectedL1, ...updated }
          state.level1List = state.level1List.map(l => l.id === loc.id ? state.selectedL1 : l)
          renderL1Tabs(); renderLocationInfo(state.selectedL1)
        }
        closeEditLocationModal()
      } catch (err) { errEl.textContent = err.message; errEl.classList.remove('hidden') }
    }

    async function handleDeleteLocation() {
      const loc = state.selectedL2 ?? state.selectedL1
      if (!loc) return
      const msg = `"${loc.name}"을(를) 삭제하시겠습니까?\n(연결된 식물 기록도 영향을 받을 수 있습니다)`
      if (!confirm(msg)) return
      try {
        await locationsApi.remove(loc.id)
        closeEditLocationModal()
        if (state.selectedL2?.id === loc.id) {
          state.level2List = state.level2List.filter(l => l.id !== loc.id)
          sessionStorage.removeItem('garden_l2')
          if (state.level2List.length > 0) await selectL2(state.level2List[0].id)
          else { state.selectedL2 = null; renderL2Tabs(); renderLocationInfo(state.selectedL1); await loadLocationPlants(state.selectedL1.id) }
        } else { sessionStorage.removeItem('garden_l1'); sessionStorage.removeItem('garden_l2'); await init() }
      } catch (err) { alert('삭제 실패: ' + err.message) }
    }

    // ════════════════════════════════════════════════
    // 초기화
    // ════════════════════════════════════════════════
    async function init() {
      document.getElementById('loading').classList.remove('hidden')
      document.getElementById('content').classList.add('hidden')
      document.getElementById('no-location').classList.add('hidden')
      try {
        state.level1List = await locationsApi.getLevel1()
        document.getElementById('loading').classList.add('hidden')
        if (state.level1List.length === 0) {
          document.getElementById('no-location').classList.remove('hidden'); return
        }
        renderL1Tabs()
        const savedL1 = sessionStorage.getItem('garden_l1')
        const savedL2 = sessionStorage.getItem('garden_l2')
        const l1Id = (savedL1 && state.level1List.find(l => l.id === savedL1)) ? savedL1 : state.level1List[0].id
        await selectL1(l1Id, savedL2)
      } catch (err) {
        document.getElementById('loading').innerHTML =
          `<p class="text-red-400 text-sm py-4 text-center">${err.message}</p>`
      }
    }

    fixStickyTops()
    init()
  </script>
</body>
</html>
