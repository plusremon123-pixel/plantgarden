<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 정원 — 식물 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .garden-card { transition: box-shadow 0.2s, transform 0.15s; }
    .garden-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.09); }
    .bubble { transition: transform 0.15s; }
    .bubble:hover { transform: scale(1.06); }
  </style>
</head>
<body class="min-h-screen bg-gray-100">

  <!-- ── 네비게이션 ── -->
  <nav class="bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between sticky top-0 z-20 shadow-sm">
    <a href="index.html" class="text-lg font-bold text-green-800">🌿 식물 관리</a>
    <div class="flex gap-3 text-sm">
      <a href="plants.html"    class="text-gray-400 hover:text-green-700">도감</a>
      <a href="garden.html"    class="font-semibold text-green-700 border-b-2 border-green-600 pb-0.5">내 정원</a>
      <a href="flowerbed.html" class="text-gray-400 hover:text-green-700">내 꽃밭</a>
      <a href="admin.html"     class="text-gray-400 hover:text-green-700">관리자</a>
    </div>
  </nav>

  <!-- ── 헤더 ── -->
  <div class="bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between">
    <div>
      <h1 class="text-base font-bold text-gray-800">내 정원</h1>
      <p id="header-summary" class="hidden text-xs text-gray-400 mt-0.5"></p>
    </div>
    <button onclick="openGardenModal()"
      class="text-xs font-semibold px-3 py-1.5 rounded-lg border border-green-600 text-green-700 hover:bg-green-50 transition-colors">
      + 정원추가
    </button>
  </div>

  <main class="max-w-5xl mx-auto px-4 py-5 pb-12">

    <!-- 로딩 -->
    <div id="loading" class="text-center py-20 text-green-400">
      <div class="text-4xl mb-2">🌱</div>
      <p class="text-sm">불러오는 중...</p>
    </div>

    <!-- 정원 없음 -->
    <div id="no-location" class="hidden text-center py-20 text-gray-400">
      <div class="text-4xl mb-2">🗺️</div>
      <p class="text-sm">등록된 정원이 없습니다.</p>
      <p class="text-xs mt-1">+ 정원추가 버튼으로 위치를 만들어 보세요.</p>
    </div>

    <!-- 대시보드 그리드 -->
    <div id="dashboard" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-5"></div>

  </main>

  <!-- ══════════════════════════════════════
       정원추가 모달
  ══════════════════════════════════════ -->
  <div id="modal-garden" class="modal-backdrop hidden">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="font-bold text-gray-800">정원 추가</h3>
        <button onclick="closeGardenModal()" class="modal-close">✕</button>
      </div>
      <form id="form-garden" onsubmit="handleAddGarden(event)" class="space-y-3">
        <div>
          <label class="label">위치 레벨</label>
          <div class="flex gap-2">
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="radio" name="garden-level" value="1" checked onchange="toggleParentSelect(this.value)" class="accent-green-600" />
              <span class="text-sm text-gray-700">상위 위치 (예: 시골)</span>
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="radio" name="garden-level" value="2" onchange="toggleParentSelect(this.value)" class="accent-green-600" />
              <span class="text-sm text-gray-700">하위 위치 (예: 화단)</span>
            </label>
          </div>
        </div>
        <div id="parent-select-wrap" class="hidden">
          <label class="label">상위 위치 선택</label>
          <select id="g-parent-id" class="input"><option value="">-- 선택하세요 --</option></select>
        </div>
        <div>
          <label class="label">이름 *</label>
          <input id="g-name" type="text" required placeholder="예: 우측화단" class="input" />
        </div>
        <div>
          <label class="label">일조량</label>
          <select id="g-sunlight" class="input">
            <option value="">선택 안 함</option>
            <option value="직사광선">직사광선 (6시간 이상)</option>
            <option value="반음지">반음지 (3~6시간)</option>
            <option value="음지">음지 (3시간 미만)</option>
            <option value="실내 밝은 곳">실내 밝은 곳</option>
          </select>
        </div>
        <div>
          <label class="label">메모</label>
          <textarea id="g-note" rows="2" placeholder="특이사항, 환경 설명 등..." class="input resize-none"></textarea>
        </div>
        <details class="text-xs text-gray-400 cursor-pointer">
          <summary class="select-none">좌표 입력 (선택)</summary>
          <div class="grid grid-cols-2 gap-2 mt-2">
            <div><label class="label">위도 (lat)</label><input id="g-lat" type="number" step="any" placeholder="37.5665" class="input" /></div>
            <div><label class="label">경도 (lng)</label><input id="g-lng" type="number" step="any" placeholder="126.9780" class="input" /></div>
          </div>
        </details>
        <p id="garden-error" class="text-red-500 text-xs hidden"></p>
        <button type="submit" class="w-full btn-primary py-2.5 rounded-xl text-sm">저장</button>
      </form>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       위치 수정 모달
  ══════════════════════════════════════ -->
  <div id="modal-edit-location" class="modal-backdrop hidden">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="font-bold text-gray-800">위치 수정</h3>
        <button onclick="closeEditLocationModal()" class="modal-close">✕</button>
      </div>
      <form id="form-edit-location" onsubmit="handleEditLocation(event)" class="space-y-3">
        <div>
          <label class="label">이름 *</label>
          <input id="el-name" type="text" required class="input" />
        </div>
        <div>
          <label class="label">일조량</label>
          <select id="el-sunlight" class="input">
            <option value="">선택 안 함</option>
            <option value="직사광선">직사광선 (6시간 이상)</option>
            <option value="반음지">반음지 (3~6시간)</option>
            <option value="음지">음지 (3시간 미만)</option>
            <option value="실내 밝은 곳">실내 밝은 곳</option>
          </select>
        </div>
        <div>
          <label class="label">메모</label>
          <textarea id="el-note" rows="2" class="input resize-none" placeholder="특이사항, 환경 설명 등..."></textarea>
        </div>
        <p id="el-error" class="text-red-500 text-xs hidden"></p>
        <div class="flex gap-3 pt-1">
          <button type="button" onclick="handleDeleteLocation()"
            class="px-4 py-2.5 rounded-xl border border-red-200 text-red-400 text-sm font-semibold hover:bg-red-50 transition-colors">삭제</button>
          <button type="submit" class="flex-1 btn-primary py-2.5 rounded-xl text-sm">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/plants.js"></script>
  <script src="js/locations.js"></script>
  <script src="js/garden.js"></script>
  <script>

    // ════════════════════════════════════════════════
    // 데이터 상태
    // ════════════════════════════════════════════════
    let allInstances = []
    let allLocations = []
    let l1List       = []
    let l2Map        = {}          // l1.id → [l2, ...]
    let editingLocationId = null

    // ════════════════════════════════════════════════
    // 일조량 컬러 시스템
    // ════════════════════════════════════════════════
    const SUN_STYLE = {
      '직사광선':   { bar: 'from-amber-400 to-orange-400',    badge: 'text-orange-700 bg-orange-50',  icon: '☀️' },
      '반음지':     { bar: 'from-sky-400 to-blue-400',        badge: 'text-sky-700 bg-sky-50',        icon: '⛅' },
      '음지':       { bar: 'from-slate-400 to-slate-500',     badge: 'text-slate-700 bg-slate-100',   icon: '🌥️' },
      '실내 밝은 곳':{ bar: 'from-yellow-300 to-amber-400',   badge: 'text-amber-700 bg-amber-50',    icon: '💡' },
    }
    const DEFAULT_STYLE = { bar: 'from-green-400 to-emerald-500', badge: 'text-green-700 bg-green-50', icon: '' }

    // ════════════════════════════════════════════════
    // 통계 집계
    // ════════════════════════════════════════════════
    function countStats(instances) {
      const r = { growing: 0, sowing: 0, cutting: 0, seedling: 0, sick: 0, total: 0 }
      instances.forEach(inst => {
        r.total++
        const s = inst.status ?? ''
        if      (s.includes('아픔'))         r.sick++
        else if (s === '파종')               r.sowing++
        else if (s === '삽목')               r.cutting++
        else if (s === '모종')               r.seedling++
        else                                 r.growing++   // 생육중·건강·관찰중·묘목·구근·분주·휴면
      })
      return r
    }

    // ════════════════════════════════════════════════
    // 식물 분포 집계
    // ════════════════════════════════════════════════
    function plantDistrib(instances) {
      const map = {}
      instances.forEach(inst => {
        const name = inst.plants?.name ?? '알 수 없음'
        const qty  = inst.quantity ?? 1
        map[name]  = (map[name] ?? 0) + qty
      })
      return Object.entries(map).sort((a, b) => b[1] - a[1])
    }

    // ════════════════════════════════════════════════
    // 버블 렌더
    // ════════════════════════════════════════════════
    function renderBubbles(distrib) {
      if (distrib.length === 0)
        return '<span class="text-xs text-gray-300 italic">등록된 식물 없음</span>'
      const max = distrib[0][1]
      return distrib.slice(0, 16).map(([name, qty]) => {
        const ratio = max > 1 ? qty / max : 1
        const cls = ratio > 0.65
          ? 'text-sm px-3 py-1 font-bold bg-green-100 text-green-800'
          : ratio > 0.35
          ? 'text-xs px-2.5 py-0.5 font-semibold bg-green-50 text-green-700'
          : 'text-xs px-2 py-0.5 font-medium bg-gray-50 text-gray-500'
        return `<span class="bubble ${cls} rounded-full whitespace-nowrap cursor-default" title="${name} ${qty}개">
          ${name} <span class="opacity-50 font-normal">${qty}</span>
        </span>`
      }).join('')
    }

    // ════════════════════════════════════════════════
    // 정원 카드 HTML 생성
    // ════════════════════════════════════════════════
    function renderGardenCard(l1, instances) {
      const l2s    = l2Map[l1.id] ?? []
      const stats  = countStats(instances)
      const distrib = plantDistrib(instances)
      const style  = SUN_STYLE[l1.sunlight_type] ?? DEFAULT_STYLE

      const sickCls = stats.sick > 0
        ? 'text-red-500'
        : 'text-gray-200'
      const sickLabelCls = stats.sick > 0
        ? 'text-red-400 font-semibold'
        : 'text-gray-300'

      return `
        <div class="garden-card bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">

          <!-- 컬러 상단 바 -->
          <div class="h-1.5 bg-gradient-to-r ${style.bar}"></div>

          <!-- 헤더 -->
          <div class="px-5 pt-4 pb-3 flex items-start justify-between">
            <div class="flex-1 min-w-0">
              <h2 class="text-xl font-black text-gray-800 leading-tight truncate">${l1.name}</h2>
              ${l1.sunlight_type
                ? `<span class="inline-block mt-1.5 text-xs font-semibold ${style.badge} px-2.5 py-0.5 rounded-full">
                     ${style.icon} ${l1.sunlight_type}
                   </span>`
                : ''}
            </div>
            <button onclick="openEditLocationById('${l1.id}')"
              class="flex-shrink-0 ml-2 w-8 h-8 rounded-xl border border-gray-200 bg-white hover:bg-gray-50
                     text-gray-400 flex items-center justify-center transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
          </div>

          <!-- 상태 요약 -->
          <div class="px-5 py-4 border-t border-b border-gray-50">
            <div class="flex items-end">

              <!-- 생육중 (크게) -->
              <div class="flex flex-col items-center pr-5 border-r border-gray-100">
                <span class="text-5xl font-black leading-none text-green-500">${stats.growing}</span>
                <span class="text-xs font-bold text-green-600 mt-1.5 tracking-wide">생육중</span>
              </div>

              <!-- 파종 / 삽목 / 모종 -->
              <div class="flex gap-4 px-5 flex-1">
                <div class="flex flex-col items-center">
                  <span class="text-2xl font-bold text-gray-500 leading-none">${stats.sowing}</span>
                  <span class="text-xs text-gray-400 mt-1">파종</span>
                </div>
                <div class="flex flex-col items-center">
                  <span class="text-2xl font-bold text-gray-500 leading-none">${stats.cutting}</span>
                  <span class="text-xs text-gray-400 mt-1">삽목</span>
                </div>
                <div class="flex flex-col items-center">
                  <span class="text-2xl font-bold text-gray-500 leading-none">${stats.seedling}</span>
                  <span class="text-xs text-gray-400 mt-1">모종</span>
                </div>
              </div>

              <!-- 아픔 (오른쪽 강조) -->
              <div class="flex flex-col items-center pl-5 border-l border-gray-100">
                <span class="text-2xl font-black leading-none ${sickCls}">${stats.sick}</span>
                <span class="text-xs mt-1 ${sickLabelCls}">아픔</span>
              </div>

            </div>
          </div>

          <!-- 식물 분포 -->
          <div class="px-5 py-3 flex-1 border-b border-gray-50">
            <p class="text-xs font-semibold text-gray-400 mb-2 flex items-center gap-1">
              식물 분포
              ${stats.total > 0 ? `<span class="font-normal">· 총 ${stats.total}종</span>` : ''}
            </p>
            <div class="flex flex-wrap gap-1.5 min-h-[2.25rem]">
              ${renderBubbles(distrib)}
            </div>
          </div>

          <!-- 하위 위치 (L2 chips) -->
          ${l2s.length > 0 ? `
          <div class="px-5 py-2.5 border-b border-gray-50 flex flex-wrap gap-1.5">
            <span class="text-xs text-gray-300 self-center mr-0.5">📍</span>
            ${l2s.map(l =>
              `<span class="text-xs text-gray-500 bg-gray-100 px-2.5 py-0.5 rounded-full">${l.name}</span>`
            ).join('')}
          </div>` : ''}

          <!-- 꽃밭 관리 버튼 -->
          <div class="px-5 py-3">
            <a href="flowerbed.html?loc=${l1.id}"
               class="flex items-center justify-center gap-2 w-full bg-green-600 hover:bg-green-700
                      text-white text-sm font-semibold py-2.5 rounded-xl transition-colors">
              🪴 꽃밭 관리
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="m9 18 6-6-6-6"/>
              </svg>
            </a>
          </div>

        </div>`
    }

    // ════════════════════════════════════════════════
    // 대시보드 렌더
    // ════════════════════════════════════════════════
    function renderDashboard() {
      const dashboard = document.getElementById('dashboard')

      // location_id → l1.id 매핑 (L2는 parent로 올림)
      const locToL1 = {}
      l1List.forEach(l => locToL1[l.id] = l.id)
      allLocations.filter(l => l.level === 2).forEach(l => {
        if (l.parent_id) locToL1[l.id] = l.parent_id
      })

      // L1별 인스턴스 분류
      const byL1 = {}
      l1List.forEach(l => byL1[l.id] = [])
      allInstances.forEach(inst => {
        const l1Id = locToL1[inst.location_id]
        if (l1Id && byL1[l1Id]) byL1[l1Id].push(inst)
      })

      dashboard.innerHTML = l1List.map(l1 => renderGardenCard(l1, byL1[l1.id] ?? [])).join('')
      dashboard.classList.remove('hidden')
    }

    // ════════════════════════════════════════════════
    // 초기화
    // ════════════════════════════════════════════════
    async function init() {
      document.getElementById('loading').classList.remove('hidden')
      document.getElementById('dashboard').classList.add('hidden')
      document.getElementById('no-location').classList.add('hidden')

      try {
        const [l1s, allLocs, instances] = await Promise.all([
          locationsApi.getLevel1(),
          locationsApi.getAll(),
          gardenApi.listAll(),
        ])
        l1List       = l1s
        allLocations = allLocs
        allInstances = instances

        // L2 맵 구성
        l2Map = {}
        l1s.forEach(l => l2Map[l.id] = [])
        allLocs.filter(l => l.level === 2).forEach(l => {
          if (l2Map[l.parent_id]) l2Map[l.parent_id].push(l)
        })

        document.getElementById('loading').classList.add('hidden')

        if (l1List.length === 0) {
          document.getElementById('no-location').classList.remove('hidden'); return
        }

        // 헤더 요약
        const el = document.getElementById('header-summary')
        el.textContent = `정원 ${l1List.length}개 · 식물 ${allInstances.length}종 관리 중`
        el.classList.remove('hidden')

        renderDashboard()

      } catch (err) {
        document.getElementById('loading').innerHTML =
          `<p class="text-red-400 text-sm py-4 text-center">${err.message}</p>`
      }
    }

    // ════════════════════════════════════════════════
    // 정원추가 모달
    // ════════════════════════════════════════════════
    async function openGardenModal() {
      const sel = document.getElementById('g-parent-id')
      sel.innerHTML = '<option value="">-- 선택하세요 --</option>'
      try {
        const l1 = await locationsApi.getLevel1()
        l1.forEach(loc => {
          const opt = document.createElement('option')
          opt.value = loc.id; opt.textContent = loc.name
          sel.appendChild(opt)
        })
      } catch (_) {}
      document.getElementById('modal-garden').classList.remove('hidden')
    }

    function closeGardenModal() {
      document.getElementById('modal-garden').classList.add('hidden')
      document.getElementById('form-garden').reset()
      document.getElementById('garden-error').classList.add('hidden')
      document.getElementById('parent-select-wrap').classList.add('hidden')
    }

    function toggleParentSelect(level) {
      document.getElementById('parent-select-wrap').classList.toggle('hidden', level !== '2')
    }

    async function handleAddGarden(e) {
      e.preventDefault()
      const errEl    = document.getElementById('garden-error')
      errEl.classList.add('hidden')
      const level    = parseInt(document.querySelector('input[name="garden-level"]:checked').value)
      const parentId = document.getElementById('g-parent-id').value
      const name     = document.getElementById('g-name').value.trim()
      const sunlight = document.getElementById('g-sunlight').value
      const note     = document.getElementById('g-note').value.trim()
      const lat      = parseFloat(document.getElementById('g-lat').value) || null
      const lng      = parseFloat(document.getElementById('g-lng').value) || null
      if (level === 2 && !parentId) {
        errEl.textContent = '상위 위치를 선택해 주세요.'
        errEl.classList.remove('hidden'); return
      }
      try {
        await locationsApi.insert({
          name, level, parent_id: level === 2 ? parentId : null,
          sunlight_type: sunlight || null, note: note || null, lat, lng,
        })
        closeGardenModal()
        await init()
      } catch (err) { errEl.textContent = err.message; errEl.classList.remove('hidden') }
    }

    // ════════════════════════════════════════════════
    // 위치 수정 모달
    // ════════════════════════════════════════════════
    function openEditLocationById(id) {
      const loc = allLocations.find(l => l.id === id)
      if (!loc) return
      editingLocationId = id
      document.getElementById('el-name').value     = loc.name ?? ''
      document.getElementById('el-sunlight').value = loc.sunlight_type ?? ''
      document.getElementById('el-note').value     = loc.note ?? ''
      document.getElementById('el-error').classList.add('hidden')
      document.getElementById('modal-edit-location').classList.remove('hidden')
    }

    function closeEditLocationModal() {
      document.getElementById('modal-edit-location').classList.add('hidden')
      editingLocationId = null
    }

    async function handleEditLocation(e) {
      e.preventDefault()
      const errEl = document.getElementById('el-error')
      errEl.classList.add('hidden')
      if (!editingLocationId) return
      const name     = document.getElementById('el-name').value.trim()
      const sunlight = document.getElementById('el-sunlight').value
      const note     = document.getElementById('el-note').value.trim()
      if (!name) { errEl.textContent = '이름을 입력해 주세요.'; errEl.classList.remove('hidden'); return }
      try {
        await locationsApi.update(editingLocationId, {
          name, sunlight_type: sunlight || null, note: note || null,
        })
        closeEditLocationModal()
        await init()
      } catch (err) { errEl.textContent = err.message; errEl.classList.remove('hidden') }
    }

    async function handleDeleteLocation() {
      if (!editingLocationId) return
      const loc = allLocations.find(l => l.id === editingLocationId)
      if (!confirm(`"${loc?.name}"을(를) 삭제하시겠습니까?\n(연결된 식물 기록도 영향을 받을 수 있습니다)`)) return
      try {
        await locationsApi.remove(editingLocationId)
        closeEditLocationModal()
        await init()
      } catch (err) { alert('삭제 실패: ' + err.message) }
    }

    // ── 시작 ──
    init()
  </script>
</body>
</html>
