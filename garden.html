<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 정원 — 식물 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .tab-scroll::-webkit-scrollbar { display: none; }
    .tab-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .bubble { transition: transform 0.12s; cursor: default; }
    .bubble:hover { transform: scale(1.05); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.2s ease both; }
    .distrib-tab { transition: background 0.15s, color 0.15s; }
  </style>
</head>
<body class="min-h-screen bg-gray-100">

  <!-- ── 네비게이션 ── -->
  <nav class="bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between sticky top-0 z-20 shadow-sm">
    <a href="index.html" class="text-lg font-bold text-green-800">🌿 식물 관리</a>
    <div class="flex gap-3 text-sm">
      <a href="plants.html"    class="text-gray-400 hover:text-green-700">도감</a>
      <a href="garden.html"    class="font-semibold text-green-700 border-b-2 border-green-600 pb-0.5">내 정원</a>
      <a href="flowerbed.html" class="text-gray-400 hover:text-green-700">내 꽃밭</a>
      <a href="admin.html"     class="text-gray-400 hover:text-green-700">관리자</a>
    </div>
  </nav>

  <!-- ── 헤더 (내 꽃밭과 동일 구조) ── -->
  <div class="bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between">
    <h1 class="text-base font-bold text-gray-800">내 정원</h1>
    <button onclick="openGardenModal()"
      class="flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-lg
             bg-green-600 hover:bg-green-700 text-white transition-colors shadow-sm">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      정원추가
    </button>
  </div>

  <!-- ── L1 정원 탭 (sticky) ── -->
  <div id="tab-l1-bar" class="bg-white border-b border-gray-200 sticky z-10">
    <div id="tab-l1" class="tab-scroll flex overflow-x-auto"></div>
  </div>

  <main class="max-w-lg mx-auto px-4 py-4 pb-8">

    <!-- 로딩 -->
    <div id="loading" class="text-center py-20 text-green-400">
      <div class="text-4xl mb-2">🌱</div>
      <p class="text-sm">불러오는 중...</p>
    </div>

    <!-- 정원 없음 -->
    <div id="no-location" class="hidden text-center py-20 text-gray-400">
      <div class="text-4xl mb-2">🗺️</div>
      <p class="text-sm">등록된 정원이 없습니다.</p>
      <p class="text-xs mt-1">상단 + 추가 버튼으로 정원을 만들어 보세요.</p>
    </div>

    <!-- 대시보드 패널 -->
    <div id="dashboard" class="hidden"></div>

  </main>

  <!-- ══════════════════════════════════════
       정원추가 모달
  ══════════════════════════════════════ -->
  <div id="modal-garden" class="modal-backdrop hidden">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="font-bold text-gray-800">정원 추가</h3>
        <button onclick="closeGardenModal()" class="modal-close">✕</button>
      </div>
      <form id="form-garden" onsubmit="handleAddGarden(event)" class="space-y-3">
        <div>
          <label class="label">위치 레벨</label>
          <div class="flex gap-2">
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="radio" name="garden-level" value="1" checked onchange="toggleParentSelect(this.value)" class="accent-green-600" />
              <span class="text-sm text-gray-700">상위 위치 (예: 시골)</span>
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="radio" name="garden-level" value="2" onchange="toggleParentSelect(this.value)" class="accent-green-600" />
              <span class="text-sm text-gray-700">하위 위치 (예: 화단)</span>
            </label>
          </div>
        </div>
        <div id="parent-select-wrap" class="hidden">
          <label class="label">상위 위치 선택</label>
          <select id="g-parent-id" class="input"><option value="">-- 선택하세요 --</option></select>
        </div>
        <div>
          <label class="label">이름 *</label>
          <input id="g-name" type="text" required placeholder="예: 우측화단" class="input" />
        </div>
        <div>
          <label class="label">일조량</label>
          <select id="g-sunlight" class="input">
            <option value="">선택 안 함</option>
            <option value="직사광선">직사광선 (6시간 이상)</option>
            <option value="반음지">반음지 (3~6시간)</option>
            <option value="음지">음지 (3시간 미만)</option>
            <option value="실내 밝은 곳">실내 밝은 곳</option>
          </select>
        </div>
        <div>
          <label class="label">메모</label>
          <textarea id="g-note" rows="2" placeholder="특이사항, 환경 설명 등..." class="input resize-none"></textarea>
        </div>
        <details class="text-xs text-gray-400 cursor-pointer">
          <summary class="select-none">좌표 입력 (선택)</summary>
          <div class="grid grid-cols-2 gap-2 mt-2">
            <div><label class="label">위도</label><input id="g-lat" type="number" step="any" class="input" /></div>
            <div><label class="label">경도</label><input id="g-lng" type="number" step="any" class="input" /></div>
          </div>
        </details>
        <p id="garden-error" class="text-red-500 text-xs hidden"></p>
        <button type="submit" class="w-full btn-primary py-2.5 rounded-xl text-sm">저장</button>
      </form>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       위치 수정 모달
  ══════════════════════════════════════ -->
  <div id="modal-edit-location" class="modal-backdrop hidden">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="font-bold text-gray-800">위치 수정</h3>
        <button onclick="closeEditLocationModal()" class="modal-close">✕</button>
      </div>
      <form id="form-edit-location" onsubmit="handleEditLocation(event)" class="space-y-3">
        <div><label class="label">이름 *</label><input id="el-name" type="text" required class="input" /></div>
        <div>
          <label class="label">일조량</label>
          <select id="el-sunlight" class="input">
            <option value="">선택 안 함</option>
            <option value="직사광선">직사광선 (6시간 이상)</option>
            <option value="반음지">반음지 (3~6시간)</option>
            <option value="음지">음지 (3시간 미만)</option>
            <option value="실내 밝은 곳">실내 밝은 곳</option>
          </select>
        </div>
        <div><label class="label">메모</label><textarea id="el-note" rows="2" class="input resize-none"></textarea></div>
        <p id="el-error" class="text-red-500 text-xs hidden"></p>
        <div class="flex gap-3 pt-1">
          <button type="button" onclick="handleDeleteLocation()"
            class="px-4 py-2.5 rounded-xl border border-red-200 text-red-400 text-sm font-semibold hover:bg-red-50 transition-colors">삭제</button>
          <button type="submit" class="flex-1 btn-primary py-2.5 rounded-xl text-sm">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/plants.js"></script>
  <script src="js/locations.js"></script>
  <script src="js/garden.js"></script>
  <script>

    // ════════════════════════════════════════════════
    // 데이터 상태
    // ════════════════════════════════════════════════
    let allInstances      = []
    let allLocations      = []
    let l1List            = []
    let l2Map             = {}    // l1.id → [l2, ...]
    let selectedL1        = null
    let selectedDistribId = null  // null = 전체
    let editingLocId      = null

    // ════════════════════════════════════════════════
    // 일조량 스타일
    // ════════════════════════════════════════════════
    const SUN_STYLE = {
      '직사광선':    { bar: 'from-amber-400 to-orange-400', badge: 'text-orange-700 bg-orange-50', icon: '☀️' },
      '반음지':      { bar: 'from-sky-400 to-blue-400',     badge: 'text-sky-700 bg-sky-50',       icon: '⛅' },
      '음지':        { bar: 'from-slate-400 to-slate-500',  badge: 'text-slate-700 bg-slate-100',  icon: '🌥️' },
      '실내 밝은 곳':{ bar: 'from-yellow-300 to-amber-400', badge: 'text-amber-700 bg-amber-50',   icon: '💡' },
    }
    const DEF_STYLE = { bar: 'from-green-400 to-emerald-500', badge: 'text-green-700 bg-green-50', icon: '' }

    // ════════════════════════════════════════════════
    // Sticky top
    // ════════════════════════════════════════════════
    function fixStickyTops() {
      const navH = document.querySelector('nav')?.getBoundingClientRect().height ?? 57
      const hdH  = document.querySelector('nav + div')?.getBoundingClientRect().height ?? 45
      const bar  = document.getElementById('tab-l1-bar')
      if (bar) bar.style.top = (navH + hdH) + 'px'
    }
    window.addEventListener('resize', fixStickyTops)

    // ════════════════════════════════════════════════
    // L1 탭 렌더
    // ════════════════════════════════════════════════
    function renderL1Tabs() {
      document.getElementById('tab-l1').innerHTML = l1List.map(loc => `
        <button data-id="${loc.id}" onclick="selectL1('${loc.id}')"
          class="flex-shrink-0 px-4 py-3 text-sm font-semibold border-b-2 transition-colors whitespace-nowrap
                 ${selectedL1?.id === loc.id
                   ? 'border-green-600 text-green-700'
                   : 'border-transparent text-gray-400 hover:text-gray-600'}">
          ${loc.name}
        </button>`).join('')
    }

    // ════════════════════════════════════════════════
    // 인스턴스 필터
    // ════════════════════════════════════════════════
    function getL1Instances(l1Id) {
      const l2Ids = new Set((l2Map[l1Id] ?? []).map(l => l.id))
      l2Ids.add(l1Id)
      return allInstances.filter(inst => l2Ids.has(inst.location_id))
    }

    function getDistribInstances() {
      if (!selectedL1) return []
      if (selectedDistribId === null) return getL1Instances(selectedL1.id)
      return allInstances.filter(inst => inst.location_id === selectedDistribId)
    }

    // ════════════════════════════════════════════════
    // 통계 집계
    // ════════════════════════════════════════════════
    function countStats(instances) {
      const r = { growing: 0, sowing: 0, cutting: 0, seedling: 0, sick: 0, total: 0 }
      instances.forEach(inst => {
        r.total++
        const s = inst.status ?? ''
        if      (s.includes('아픔')) r.sick++
        else if (s === '파종')       r.sowing++
        else if (s === '삽목')       r.cutting++
        else if (s === '모종')       r.seedling++
        else                         r.growing++
      })
      return r
    }

    // ════════════════════════════════════════════════
    // 식물 분포 버블
    // ════════════════════════════════════════════════
    function plantDistrib(instances) {
      const map = {}
      instances.forEach(inst => {
        const name = inst.plants?.name ?? '알 수 없음'
        map[name]  = (map[name] ?? 0) + (inst.quantity ?? 1)
      })
      return Object.entries(map).sort((a, b) => b[1] - a[1])
    }

    function renderBubbles(distrib) {
      if (distrib.length === 0)
        return '<span class="text-xs text-gray-300 italic py-2">등록된 식물 없음</span>'
      const max = distrib[0][1]
      return distrib.slice(0, 20).map(([name, qty]) => {
        const ratio = max > 1 ? qty / max : 1
        const cls = ratio > 0.65
          ? 'text-sm px-3 py-1 font-bold bg-green-100 text-green-800'
          : ratio > 0.35
          ? 'text-xs px-2.5 py-0.5 font-semibold bg-green-50 text-green-700'
          : 'text-xs px-2 py-0.5 font-medium bg-gray-50 text-gray-500'
        return `<span class="bubble ${cls} rounded-full whitespace-nowrap" title="${qty}개">
          ${name}<span class="opacity-40 font-normal text-xs ml-0.5">${qty}</span>
        </span>`
      }).join('')
    }

    // ════════════════════════════════════════════════
    // 분포 탭 전환
    // ════════════════════════════════════════════════
    function selectDistribTab(locId) {
      selectedDistribId = locId
      // 탭 스타일 업데이트
      document.querySelectorAll('.distrib-tab').forEach(btn => {
        const active = btn.dataset.loc === (locId ?? '')
        btn.className = btn.className
          .replace(/bg-green-600 text-white|bg-gray-100 text-gray-500 hover:bg-gray-200/g, '')
          .trim()
        btn.classList.add(...(active
          ? ['bg-green-600', 'text-white']
          : ['bg-gray-100', 'text-gray-500', 'hover:bg-gray-200']))
      })
      // 버블 업데이트
      const distrib = plantDistrib(getDistribInstances())
      const el = document.getElementById('distrib-content')
      if (el) el.innerHTML = renderBubbles(distrib)
    }

    // ════════════════════════════════════════════════
    // 대시보드 패널 렌더
    // ════════════════════════════════════════════════
    function renderDashboard(l1) {
      selectedDistribId = null
      const instances = getL1Instances(l1.id)
      const l2s       = l2Map[l1.id] ?? []
      const stats     = countStats(instances)
      const distrib   = plantDistrib(instances)
      const style     = SUN_STYLE[l1.sunlight_type] ?? DEF_STYLE

      // 상태 배지
      const statBadges = [
        { label: '생육중', val: stats.growing, cls: 'bg-green-100 text-green-700 font-bold' },
        { label: '파종',   val: stats.sowing,  cls: 'bg-gray-100 text-gray-600' },
        { label: '삽목',   val: stats.cutting, cls: 'bg-gray-100 text-gray-600' },
        { label: '모종',   val: stats.seedling,cls: 'bg-gray-100 text-gray-600' },
        { label: '아픔',   val: stats.sick,
          cls: stats.sick > 0 ? 'bg-red-50 text-red-500 font-bold' : 'bg-gray-50 text-gray-300' },
      ].map(b => `<span class="text-xs px-2 py-0.5 rounded-full ${b.cls}">${b.label} ${b.val}</span>`).join('')

      // 분포 탭 (전체 + L2들)
      const distribTabs = [
        `<button class="distrib-tab flex-shrink-0 text-xs font-semibold px-3 py-1 rounded-full
                        bg-green-600 text-white whitespace-nowrap"
                 data-loc="" onclick="selectDistribTab(null)">전체</button>`,
        ...l2s.map(l =>
          `<button class="distrib-tab flex-shrink-0 text-xs font-semibold px-3 py-1 rounded-full
                          bg-gray-100 text-gray-500 hover:bg-gray-200 whitespace-nowrap"
                   data-loc="${l.id}" onclick="selectDistribTab('${l.id}')">📍 ${l.name}</button>`)
      ].join('')

      document.getElementById('dashboard').innerHTML = `
        <div class="fade-up bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">

          <!-- 컬러 바 -->
          <div class="h-1 bg-gradient-to-r ${style.bar}"></div>

          <!-- ① 헤더 -->
          <div class="px-4 py-3 flex items-start justify-between border-b border-gray-50">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <h2 class="text-xl font-black text-gray-800">${l1.name}</h2>
                ${l1.sunlight_type
                  ? `<span class="text-xs font-semibold ${style.badge} px-2 py-0.5 rounded-full">${style.icon} ${l1.sunlight_type}</span>`
                  : ''}
              </div>
              <div class="flex flex-wrap gap-1.5 mt-2">
                ${statBadges}
              </div>
            </div>
            <button onclick="openEditLocationById('${l1.id}')"
              class="flex-shrink-0 ml-2 w-8 h-8 rounded-xl border border-gray-200 hover:bg-gray-50
                     text-gray-400 flex items-center justify-center transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
          </div>

          <!-- ② 식물 분포 -->
          <div class="border-b border-gray-50">
            <!-- 내부 탭 -->
            <div class="tab-scroll flex gap-1.5 overflow-x-auto px-4 pt-3 pb-2">
              ${distribTabs}
            </div>
            <!-- 버블 영역 -->
            <div id="distrib-content" class="px-4 pb-4 pt-1 flex flex-wrap gap-1.5 min-h-[4.5rem]">
              ${renderBubbles(distrib)}
            </div>
          </div>

          <!-- ③ 꽃밭 관리 -->
          <div class="px-4 py-3">
            <a href="flowerbed.html?loc=${l1.id}"
               class="flex items-center justify-center gap-2 w-full bg-green-600 hover:bg-green-700
                      text-white text-sm font-bold py-2.5 rounded-xl transition-colors">
              🪴 꽃밭 관리하기
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="m9 18 6-6-6-6"/>
              </svg>
            </a>
          </div>
        </div>`

      document.getElementById('dashboard').classList.remove('hidden')
    }

    // ════════════════════════════════════════════════
    // L1 선택
    // ════════════════════════════════════════════════
    function selectL1(id) {
      selectedL1 = l1List.find(l => l.id === id) ?? null
      sessionStorage.setItem('garden_l1', id)
      renderL1Tabs()
      if (selectedL1) renderDashboard(selectedL1)
    }

    // ════════════════════════════════════════════════
    // 초기화
    // ════════════════════════════════════════════════
    async function init() {
      document.getElementById('loading').classList.remove('hidden')
      document.getElementById('dashboard').classList.add('hidden')
      document.getElementById('no-location').classList.add('hidden')

      try {
        const [l1s, allLocs, instances] = await Promise.all([
          locationsApi.getLevel1(),
          locationsApi.getAll(),
          gardenApi.listAll(),
        ])
        l1List       = l1s
        allLocations = allLocs
        allInstances = instances

        l2Map = {}
        l1s.forEach(l => l2Map[l.id] = [])
        allLocs.filter(l => l.level === 2).forEach(l => {
          if (l2Map[l.parent_id]) l2Map[l.parent_id].push(l)
        })

        document.getElementById('loading').classList.add('hidden')

        if (l1List.length === 0) {
          document.getElementById('no-location').classList.remove('hidden'); return
        }

        renderL1Tabs()
        const savedL1 = sessionStorage.getItem('garden_l1')
        const l1Id    = (savedL1 && l1List.find(l => l.id === savedL1)) ? savedL1 : l1List[0].id
        selectL1(l1Id)

      } catch (err) {
        document.getElementById('loading').innerHTML =
          `<p class="text-red-400 text-sm py-4 text-center">${err.message}</p>`
      }
    }

    // ════════════════════════════════════════════════
    // 정원추가 모달
    // ════════════════════════════════════════════════
    async function openGardenModal() {
      const sel = document.getElementById('g-parent-id')
      sel.innerHTML = '<option value="">-- 선택하세요 --</option>'
      try {
        ;(await locationsApi.getLevel1()).forEach(loc => {
          const opt = document.createElement('option')
          opt.value = loc.id; opt.textContent = loc.name
          sel.appendChild(opt)
        })
      } catch (_) {}
      document.getElementById('modal-garden').classList.remove('hidden')
    }

    function closeGardenModal() {
      document.getElementById('modal-garden').classList.add('hidden')
      document.getElementById('form-garden').reset()
      document.getElementById('garden-error').classList.add('hidden')
      document.getElementById('parent-select-wrap').classList.add('hidden')
    }

    function toggleParentSelect(level) {
      document.getElementById('parent-select-wrap').classList.toggle('hidden', level !== '2')
    }

    async function handleAddGarden(e) {
      e.preventDefault()
      const errEl    = document.getElementById('garden-error')
      errEl.classList.add('hidden')
      const level    = parseInt(document.querySelector('input[name="garden-level"]:checked').value)
      const parentId = document.getElementById('g-parent-id').value
      const name     = document.getElementById('g-name').value.trim()
      const sunlight = document.getElementById('g-sunlight').value
      const note     = document.getElementById('g-note').value.trim()
      const lat      = parseFloat(document.getElementById('g-lat').value) || null
      const lng      = parseFloat(document.getElementById('g-lng').value) || null
      if (level === 2 && !parentId) {
        errEl.textContent = '상위 위치를 선택해 주세요.'; errEl.classList.remove('hidden'); return
      }
      try {
        await locationsApi.insert({
          name, level, parent_id: level === 2 ? parentId : null,
          sunlight_type: sunlight || null, note: note || null, lat, lng,
        })
        closeGardenModal(); await init()
      } catch (err) { errEl.textContent = err.message; errEl.classList.remove('hidden') }
    }

    // ════════════════════════════════════════════════
    // 위치 수정 모달
    // ════════════════════════════════════════════════
    function openEditLocationById(id) {
      const loc = allLocations.find(l => l.id === id)
      if (!loc) return
      editingLocId = id
      document.getElementById('el-name').value     = loc.name ?? ''
      document.getElementById('el-sunlight').value = loc.sunlight_type ?? ''
      document.getElementById('el-note').value     = loc.note ?? ''
      document.getElementById('el-error').classList.add('hidden')
      document.getElementById('modal-edit-location').classList.remove('hidden')
    }

    function closeEditLocationModal() {
      document.getElementById('modal-edit-location').classList.add('hidden')
      editingLocId = null
    }

    async function handleEditLocation(e) {
      e.preventDefault()
      const errEl = document.getElementById('el-error')
      errEl.classList.add('hidden')
      if (!editingLocId) return
      const name     = document.getElementById('el-name').value.trim()
      const sunlight = document.getElementById('el-sunlight').value
      const note     = document.getElementById('el-note').value.trim()
      if (!name) { errEl.textContent = '이름을 입력해 주세요.'; errEl.classList.remove('hidden'); return }
      try {
        await locationsApi.update(editingLocId, { name, sunlight_type: sunlight || null, note: note || null })
        closeEditLocationModal(); await init()
      } catch (err) { errEl.textContent = err.message; errEl.classList.remove('hidden') }
    }

    async function handleDeleteLocation() {
      if (!editingLocId) return
      const loc = allLocations.find(l => l.id === editingLocId)
      if (!confirm(`"${loc?.name}"을(를) 삭제하시겠습니까?\n(연결된 식물 기록도 영향을 받을 수 있습니다)`)) return
      try {
        await locationsApi.remove(editingLocId)
        closeEditLocationModal(); await init()
      } catch (err) { alert('삭제 실패: ' + err.message) }
    }

    // ── 시작 ──
    fixStickyTops()
    init()
  </script>
</body>
</html>
