<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>식물 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-green-50 flex items-center justify-center">
  <p class="text-green-700 text-sm">잠시만 기다려 주세요...</p>

  <script>
    const completed = localStorage.getItem('modooGardenOnboardingCompleted') === 'true'
    const guest = localStorage.getItem('modooGardenGuestSession') === 'true'
    const hasSupabaseSession = Object.keys(localStorage).some(key =>
      key.startsWith('sb-') && key.endsWith('-auth-token')
    )
    window.location.replace((completed || guest || hasSupabaseSession) ? 'garden.html' : 'welcome/')
  </script>
</body>
</html>
