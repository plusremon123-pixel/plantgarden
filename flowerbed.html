<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정원식물 — 식물 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .tab-scroll::-webkit-scrollbar { display: none; }
    .tab-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .stab-btn { color: #9ca3af; border-color: transparent; }
    .stab-btn.active { color: #15803d; border-color: #16a34a; background: #f0fdf4; }
    .stab-cnt {
      background: #e5e7eb; color: #6b7280;
      font-size: 0.65rem; font-weight: 700;
      padding: 0.1rem 0.35rem; border-radius: 9999px;
      min-width: 1.1rem; text-align: center; display: inline-block;
    }
    .stab-btn.active .stab-cnt { background: #bbf7d0; color: #15803d; }
    .water-toast { animation: waterToastIn 0.18s ease-out both; }
    .water-toast-dot { animation: waterDrop 0.72s ease-in-out both; }
    .water-toast-dot:nth-child(2) { animation-delay: 0.08s; }
    .water-toast-dot:nth-child(3) { animation-delay: 0.16s; }
    @keyframes waterToastIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes waterDrop {
      0% { opacity: 0; transform: translateY(-10px) scale(0.75); }
      35% { opacity: 1; }
      100% { opacity: 0; transform: translateY(14px) scale(1); }
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50">

  <!-- ── 네비게이션 ── -->
  <nav class="bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between sticky top-0 z-20 shadow-sm">
    <div class="flex gap-3 text-sm items-center">
      <a href="mybook.html"    class="nav-link text-gray-400 hover:text-green-700">도감</a>
      <a href="garden.html"    class="nav-link text-gray-400 hover:text-green-700">정원</a>
      <a href="flowerbed.html" class="nav-link text-green-700 border-green-600">정원식물</a>
      <a href="calendar.html"  class="nav-link text-gray-400 hover:text-green-700">달력</a>
      <a href="admin.html"     class="nav-link text-gray-400 hover:text-green-700">관리자</a>
    </div>
    <button type="button" data-plant-finder-open class="app-camera-btn" aria-label="식물 찾기" title="식물 찾기"><span aria-hidden="true">camera</span></button>
  </nav>

  <!-- ── 고정 하단 바 ── -->
  <div class="bottom-bar">
    <button onclick="openPlantModal()" class="bb-btn">식물추가</button>
    <button onclick="openWaterModal()" class="bb-btn bb-btn-ghost">물주기</button>
  </div>

  <!-- ── Level 1 탭 (primary 정원 선택) ── -->
  <div id="tab-l1-bar" class="bg-white border-b border-gray-100 sticky z-20">
    <div id="tab-l1" class="tab-scroll flex overflow-x-auto px-3 pt-2 pb-0 gap-1"></div>
  </div>

  <!-- ── Level 2 서브탭 ── -->
  <div id="tab-l2-bar" class="h-12 bg-white border-b border-gray-100 sticky z-20 flex items-center">
    <button id="tab-l2-prev" onclick="scrollL2Tab(-1)"
      class="hidden flex-shrink-0 w-7 h-full flex items-center justify-center text-gray-400 hover:text-gray-700 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div id="tab-l2" class="tab-scroll flex items-center overflow-x-auto px-3 gap-1 flex-1 h-full"></div>
    <button id="tab-l2-next" onclick="scrollL2Tab(1)"
      class="hidden flex-shrink-0 w-7 h-full flex items-center justify-center text-gray-400 hover:text-gray-700 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>


  <main class="max-w-7xl mx-auto px-4 py-4 pb-24">

    <div id="loading" class="text-center py-20 text-green-400">
      <div class="text-4xl mb-2">🌱</div>
      <p class="text-sm">불러오는 중...</p>
    </div>

    <div id="no-location" class="hidden text-center py-20 text-gray-400">
      <div class="text-4xl mb-2">🗺️</div>
      <p class="text-sm">등록된 정원이 없습니다.</p>
      <p class="text-xs mt-1"><a href="garden.html" class="text-green-600 underline">정원</a>에서 위치를 먼저 만들어 보세요.</p>
    </div>

    <div id="content" class="hidden">
      <div class="mb-3 flex items-center justify-between px-1">
        <p id="result-count" class="text-xs text-gray-400"></p>
        <button id="status-filter-button" type="button" onclick="openStatusFilterModal()"
          class="hidden rounded-full border border-gray-200 bg-white px-3 py-1.5 text-xs font-bold text-gray-600 shadow-sm">
          전체
        </button>
      </div>

      <div id="empty-plants" class="hidden text-center py-16 text-gray-400">
        <div class="text-3xl mb-2">🪴</div>
        <p class="text-sm">이 위치에 등록된 식물이 없습니다.</p>
      </div>

      <div id="plant-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3"></div>
    </div>

  </main>

  <!-- ── 단계 필터 ── -->
  <div id="status-filter-modal" class="modal-backdrop hidden" onclick="onStatusFilterBackdropClick(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 class="font-bold text-gray-800">단계 보기</h3>
        <button onclick="closeStatusFilterModal()" class="modal-close">✕</button>
      </div>
      <p class="mb-3 text-sm text-gray-500">보고 싶은 성장 단계만 골라볼 수 있어요.</p>
      <div id="status-filter-options" class="space-y-2"></div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       식물추가 모달
  ══════════════════════════════════════ -->
  <div id="modal-plant" class="modal-backdrop hidden">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="font-bold text-gray-800">식물 추가</h3>
        <button onclick="closePlantModal()" class="modal-close">✕</button>
      </div>
      <form id="form-plant" onsubmit="handleAddPlant(event)" class="space-y-3">

        <!-- 위치 선택 (한 줄) -->
        <div>
          <label class="label">위치 *</label>
          <div class="flex gap-2">
            <select id="p-loc-l1" class="flex-1 input text-sm" onchange="onPlantModalL1Change()">
              <option value="">정원 선택</option>
            </select>
            <select id="p-loc-l2" class="flex-1 input text-sm hidden" onchange="updatePlantModalSunlightHint()">
              <option value="">전체</option>
            </select>
          </div>
          <p id="p-sunlight-hint" class="hidden mt-1.5 text-xs font-semibold text-green-700"></p>
        </div>

        <!-- 식물 검색 -->
        <div>
          <label class="label">식물 검색 *</label>
          <div id="p-search-wrap" class="relative">
            <input id="p-search-input" type="text" placeholder="식물 이름으로 검색..."
              class="input pr-8" oninput="debouncePlantSearch()" autocomplete="off" />
            <div id="p-search-loading" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-gray-400">···</div>
            <div id="p-search-results"
              class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-gray-200 rounded-xl shadow-lg z-30 max-h-48 overflow-y-auto"></div>
          </div>
          <div id="p-selected-plant" class="hidden flex items-center gap-3 bg-green-50 rounded-xl px-3 py-2 mt-1">
            <div id="p-selected-thumb" class="w-10 h-10 rounded-lg bg-green-100 flex items-center justify-center text-xl flex-shrink-0 overflow-hidden">🌿</div>
            <div class="flex-1 min-w-0">
              <p id="p-selected-name" class="text-sm font-semibold text-gray-800 truncate"></p>
              <p id="p-selected-cat"  class="text-xs text-gray-400"></p>
            </div>
            <button type="button" onclick="clearPlantSelection()" class="text-gray-400 hover:text-gray-600 flex-shrink-0 p-1">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <input type="hidden" id="p-plant-id" />
        </div>

        <!-- 상태 -->
        <div>
          <label class="label">상태</label>
          <div id="p-status-disabled"><span class="text-xs text-gray-300 italic">식물을 먼저 선택하세요</span></div>
          <div id="p-status-options" class="hidden flex gap-2 flex-wrap"></div>
          <input type="hidden" id="p-status" />
        </div>

        <!-- 재배 형태 -->
        <div>
          <label class="label">재배 형태</label>
          <div class="grid grid-cols-4 gap-2">
            <button type="button" data-cultivation-val="노지" onclick="selectCultivationType(this,'노지')" class="cultivation-pill px-2 py-2 rounded-xl text-xs font-semibold border bg-green-600 text-white border-green-600">노지</button>
            <button type="button" data-cultivation-val="실외 화분" onclick="selectCultivationType(this,'실외 화분')" class="cultivation-pill px-2 py-2 rounded-xl text-xs font-semibold border bg-white text-gray-500 border-gray-200">실외 화분</button>
            <button type="button" data-cultivation-val="실내 화분" onclick="selectCultivationType(this,'실내 화분')" class="cultivation-pill px-2 py-2 rounded-xl text-xs font-semibold border bg-white text-gray-500 border-gray-200">실내 화분</button>
            <button type="button" data-cultivation-val="온실/하우스" onclick="selectCultivationType(this,'온실/하우스')" class="cultivation-pill px-2 py-2 rounded-xl text-xs font-semibold border bg-white text-gray-500 border-gray-200">온실</button>
          </div>
          <input type="hidden" id="p-cultivation-type" value="노지" />
        </div>

        <!-- 수량 + 날짜 -->
        <div class="grid grid-cols-2 gap-3">
          <div><label class="label">수량</label><input id="p-quantity" type="number" min="1" placeholder="1" class="input" /></div>
          <div><label class="label">심은 날짜</label><input id="p-planted-date" type="date" class="input" /></div>
        </div>

        <p id="plant-error" class="text-red-500 text-xs hidden"></p>
        <button type="submit" class="w-full btn-primary py-2.5 rounded-xl text-sm">추가</button>
      </form>
    </div>
  </div>

  <!-- ── 상태 빠른 변경 피커 ── -->
  <div id="status-picker" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4">
    <div class="absolute inset-0 bg-black/40" onclick="closeStatusPicker()"></div>
    <div class="relative w-full max-w-sm bg-white rounded-3xl px-5 pt-5 pb-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-gray-800">상태 변경</h3>
        <button onclick="closeStatusPicker()" class="text-gray-400 text-xl leading-none">✕</button>
      </div>
      <p class="text-sm text-gray-500 mb-4">식물의 성장 단계를 선택해주세요.</p>
      <div>
        <div class="space-y-2" id="picker-growth"></div>
      </div>
      <div class="hidden">
        <div class="flex flex-wrap gap-2" id="picker-health"></div>
      </div>
    </div>
  </div>

  <!-- ── 물주기 기록 모달 ── -->
  <div id="water-modal" class="modal-backdrop hidden" onclick="onWaterBackdropClick(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 class="font-bold text-gray-800">물주기</h3>
        <button onclick="closeWaterModal()" class="modal-close">✕</button>
      </div>
      <p id="water-target-label" class="text-xs text-gray-400 mb-3"></p>
      <button onclick="waterAllVisible()" class="w-full btn-primary py-2.5 rounded-xl text-sm mb-3">이 위치 전체 물주기</button>
      <div id="water-list" class="space-y-2 max-h-72 overflow-y-auto pr-1"></div>
      <button onclick="waterSelected()" class="w-full mt-3 border border-green-300 text-green-700 py-2.5 rounded-xl text-sm font-semibold hover:bg-green-50">선택한 식물 물주기</button>
      <p id="water-error" class="hidden text-xs text-red-500 mt-2"></p>
    </div>
  </div>

  <div id="water-toast" class="hidden fixed inset-0 z-[70] flex items-center justify-center bg-black/20 px-6 pointer-events-none">
    <div class="water-toast w-full max-w-[260px] rounded-3xl bg-white px-6 py-5 text-center shadow-2xl border border-sky-100">
      <div class="relative mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-full bg-sky-50 text-sky-600">
        <span class="water-toast-dot absolute left-5 top-2 h-2 w-2 rounded-full bg-sky-400"></span>
        <span class="water-toast-dot absolute left-7 top-1 h-2.5 w-2.5 rounded-full bg-sky-500"></span>
        <span class="water-toast-dot absolute right-5 top-3 h-2 w-2 rounded-full bg-sky-300"></span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 fill-current" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.25 6.5 9.1A8.1 8.1 0 0 0 4.5 14.25a7.5 7.5 0 0 0 15 0A8.1 8.1 0 0 0 17.5 9.1L12 2.25Zm0 18a5.5 5.5 0 0 1-5.5-5.5c0-1.3.48-2.58 1.35-3.6L12 5.96l4.15 5.19a5.58 5.58 0 0 1 1.35 3.6 5.5 5.5 0 0 1-5.5 5.5Z"/>
        </svg>
      </div>
      <p id="water-toast-title" class="text-sm font-bold text-gray-800">물주기를 완료했어요.</p>
      <p class="mt-1 text-xs text-gray-400">식물들이 촉촉해졌어요.</p>
    </div>
  </div>

  <div id="care-guide-modal" class="modal-backdrop hidden" onclick="onCareGuideBackdropClick(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="care-guide-title" class="font-bold text-gray-800">관리 안내</h3>
        <button onclick="closeCareGuideModal()" class="modal-close">✕</button>
      </div>
      <div id="care-guide-body" class="space-y-3"></div>
      <div class="flex gap-2 mt-4">
        <button type="button" onclick="closeCareGuideModal()" class="flex-1 border border-gray-200 text-gray-500 py-2.5 rounded-xl text-sm font-semibold">취소</button>
        <button type="button" onclick="confirmCareGuideAdd()" class="flex-1 btn-primary py-2.5 rounded-xl text-sm">이대로 추가</button>
      </div>
      <p id="care-guide-error" class="hidden mt-2 text-xs text-red-500"></p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/user.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/plants.js"></script>
  <script src="js/locations.js"></script>
  <script src="js/garden.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/watering.js"></script>
  <script src="js/health.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/plant-finder.js"></script>
  <script>
    // ════════════════════════════════════════════════
    // 상수
    // ════════════════════════════════════════════════
    const STATUS_TAB_GROUPS = {
      all:     null,
      growing: ['생육중'],
      seed:    ['파종','모종'],
      cutting: ['삽목','묘목'],
      storage: ['보관','구근'],
    }
    const STATUS_FILTER_TABS = [
      { key: 'all', label: '전체' },
      { key: 'growing', label: '생육중' },
      { key: 'seed', label: '파종·모종' },
      { key: 'cutting', label: '삽목·묘목' },
      { key: 'storage', label: '보관' },
    ]
    const STATUS_GROWTH = ['생육중','파종','삽목','분주','모종','묘목','보관']
    const STATUS_MAP = {
      '꽃':'파종,모종,생육중','그라스':'파종,모종,생육중','허브':'파종,모종,생육중',
      '채소':'파종,모종,생육중','나무':'삽목,묘목,생육중','구근':'분주,보관,생육중',
    }

    function statusClass(s) {
      const map = {
        '파종':'sb-파종','모종':'sb-모종','생육중':'sb-생육중','삽목':'sb-삽목',
        '묘목':'sb-묘목','분주':'sb-분주','구근':'sb-구근','보관':'sb-구근','건강':'sb-건강',
        '벌레':'sb-벌레','병':'sb-병','곰팡이':'sb-곰팡이','아픔':'sb-아픔',
        '관찰중':'sb-관찰중','관찰(벌레)':'sb-관찰벌레','관찰(병)':'sb-관찰병',
        '아픔(벌레)':'sb-아픔벌레','아픔(곰팡이)':'sb-아픔곰팡이','아픔(병)':'sb-아픔병',
        '휴면':'sb-휴면',
      }
      return map[s] ?? 'sb-건강'
    }

    function statusLabel(status) {
      return status === '구근' ? '보관' : status
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]))
    }

    function formatPlantName(name) {
      const safeName = escapeHtml(name).trim()
      const parenMatch = safeName.match(/^(.+?)[(（]\s*(.+?)\s*[)）]$/)
      if (parenMatch) return `${parenMatch[1].trim()}<br>${parenMatch[2].trim()}`
      return safeName
    }

    function waterBadgeClass(tone) {
      const map = {
        ok: 'border-sky-100 bg-sky-50 text-sky-700',
        check: 'border-amber-100 bg-amber-50 text-amber-700',
        danger: 'border-red-100 bg-red-50 text-red-600',
        muted: 'border-gray-100 bg-gray-50 text-gray-400',
      }
      return map[tone] ?? map.muted
    }

    function renderWaterBadge(inst) {
      const sunlight = locationUtil.getEffectiveSunlight(inst.location_id, state.allLocations).value
      const status = wateringUtil.getWaterStatus(inst, inst.plants, state.rainSummary, { sunlight })
      return `<div class="mt-2 inline-flex items-center gap-1 rounded-full border px-2 py-1 text-[11px] font-semibold ${waterBadgeClass(status.tone)}">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 fill-current" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.25 6.5 9.1A8.1 8.1 0 0 0 4.5 14.25a7.5 7.5 0 0 0 15 0A8.1 8.1 0 0 0 17.5 9.1L12 2.25Zm0 18a5.5 5.5 0 0 1-5.5-5.5c0-1.3.48-2.58 1.35-3.6L12 5.96l4.15 5.19a5.58 5.58 0 0 1 1.35 3.6 5.5 5.5 0 0 1-5.5 5.5Z"/>
        </svg>
        <span>${status.label}</span>
      </div>`
    }

    function renderHealthBadge(inst) {
      const log = state.healthByInstance[inst.id]
      if (!log) return ''
      const cls = {
        '벌레': 'border-orange-100 bg-orange-50 text-orange-700',
        '병': 'border-amber-100 bg-amber-50 text-amber-700',
        '곰팡이': 'border-rose-100 bg-rose-50 text-rose-700',
        '환경': 'border-gray-100 bg-gray-50 text-gray-600',
      }[log.issue_type] ?? 'border-red-100 bg-red-50 text-red-600'
      return `<div class="mt-1 inline-flex items-center gap-1 rounded-full border px-2 py-1 text-[11px] font-semibold ${cls}">
        <span>${escapeHtml(log.issue_type)}</span>
        <span class="max-w-[88px] truncate">${escapeHtml(log.issue_name ?? '')}</span>
      </div>`
    }

    function todayLocalDate() {
      const now = new Date()
      const y = now.getFullYear()
      const m = String(now.getMonth() + 1).padStart(2, '0')
      const d = String(now.getDate()).padStart(2, '0')
      return `${y}-${m}-${d}`
    }

    // ════════════════════════════════════════════════
    // 상태
    // ════════════════════════════════════════════════
    const state = {
      level1List: [],
      level2List: [],
      allLocations: [],
      selectedL1: null,
      selectedL2: null,
      plants:     [],
      healthByInstance: {},
      statusTab:  'all',
      currentTemp: null,   // 선택된 정원의 현재 기온 (°C)
      rainSummary: null,
    }
    let selectedPlantDetail = null
    let pendingPlantPayload = null

    function addDaysKey(dateKey, days) {
      const base = dateKey ? new Date(`${dateKey}T00:00:00`) : new Date()
      base.setDate(base.getDate() + days)
      return base.toISOString().slice(0, 10)
    }

    function parseDayRangeText(value) {
      const nums = String(value ?? '').match(/\d+/g)?.map(Number) ?? []
      if (nums.length >= 2) return { min: nums[0], max: nums[1] }
      if (nums.length === 1) return { min: nums[0], max: nums[0] }
      return null
    }

    function sowingRange(plant) {
      const min = Number(plant?.germination_days_min)
      const max = Number(plant?.germination_days_max)
      if (Number.isFinite(min) && Number.isFinite(max)) return { min, max }
      return parseDayRangeText(plant?.germination) || { min: 7, max: 14, fallback: true }
    }

    function cuttingRange(plant) {
      const min = Number(plant?.cutting_root_days_min)
      const max = Number(plant?.cutting_root_days_max)
      if (Number.isFinite(min) && Number.isFinite(max)) return { min, max }
      return { min: 14, max: 28, fallback: true }
    }

    function formatDepth(plant) {
      const min = plant?.sowing_cover_depth_mm_min
      const max = plant?.sowing_cover_depth_mm_max
      if (min == null && max == null) return '정보 없음'
      if (min === max || max == null) return `${min}mm`
      if (min == null) return `${max}mm 이하`
      return `${min}~${max}mm`
    }

    function guideRow(label, value) {
      if (value == null || value === '') return ''
      return `<div class="rounded-xl bg-green-50 px-3 py-2">
        <p class="text-[11px] text-green-700 font-semibold">${label}</p>
        <p class="mt-1 text-sm font-bold text-gray-800 leading-5">${escapeHtml(value)}</p>
      </div>`
    }

    // ════════════════════════════════════════════════
    // Sticky top 동적 계산
    // ════════════════════════════════════════════════
    function fixStickyTops() {
      const navH  = document.querySelector('nav')?.getBoundingClientRect().height ?? 57
      const l1Bar = document.getElementById('tab-l1-bar')
      const l2Bar = document.getElementById('tab-l2-bar')
      if (l1Bar) l1Bar.style.top = navH + 'px'
      if (l2Bar) {
        const l1H = l1Bar?.getBoundingClientRect().height ?? 44
        l2Bar.style.top = (navH + l1H) + 'px'
      }
    }
    window.addEventListener('resize', fixStickyTops)

    // ════════════════════════════════════════════════
    // L1 / L2 탭 렌더
    // ════════════════════════════════════════════════
    function renderL1Tabs() {
      document.getElementById('tab-l1').innerHTML = state.level1List.map(loc => `
        <button data-id="${loc.id}" onclick="selectL1('${loc.id}')"
          class="l1-tab flex-shrink-0 px-4 py-2 text-sm font-semibold border-b-2 transition-colors whitespace-nowrap
                 ${state.selectedL1?.id === loc.id ? 'border-green-600 text-green-700' : 'border-transparent text-gray-400 hover:text-gray-600'}">
          ${loc.name}
        </button>`).join('')
    }

    function renderL2Tabs() {
      const bar  = document.getElementById('tab-l2')
      const prev = document.getElementById('tab-l2-prev')
      const next = document.getElementById('tab-l2-next')
      if (state.level2List.length === 0) {
        bar.innerHTML = '<span class="inline-flex h-8 items-center text-xs text-gray-400 px-1">하위 위치 없음</span>'
        prev.classList.add('hidden'); next.classList.add('hidden')
        fixStickyTops()
        return
      }
      bar.innerHTML = state.level2List.map(loc => `
        <button data-id="${loc.id}" onclick="selectL2('${loc.id}')"
          class="l2-tab flex-shrink-0 h-8 px-3 text-xs font-semibold rounded-full transition-colors whitespace-nowrap
                 ${state.selectedL2?.id === loc.id ? 'bg-green-600 text-white' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}">
          ${loc.name}
        </button>`).join('')
      updateL2Arrows()
      bar.addEventListener('scroll', updateL2Arrows, { passive: true })
      fixStickyTops()
    }

    function updateL2Arrows() {
      const bar  = document.getElementById('tab-l2')
      const prev = document.getElementById('tab-l2-prev')
      const next = document.getElementById('tab-l2-next')
      const has  = bar.scrollWidth > bar.clientWidth
      prev.classList.toggle('hidden', !has || bar.scrollLeft <= 0)
      next.classList.toggle('hidden', !has || bar.scrollLeft + bar.clientWidth >= bar.scrollWidth - 1)
    }

    function scrollL2Tab(dir) {
      const bar = document.getElementById('tab-l2')
      bar.scrollBy({ left: dir * 120, behavior: 'smooth' })
      setTimeout(updateL2Arrows, 300)
    }

    // ════════════════════════════════════════════════
    // 상태 필터
    // ════════════════════════════════════════════════
    function countByStatusTab(tabKey, plants = state.plants) {
      const statuses = STATUS_TAB_GROUPS[tabKey]
      if (!statuses) return plants.length
      return plants.filter(p => statuses.includes(p.status)).length
    }

    function currentStatusTab() {
      return STATUS_FILTER_TABS.find(tab => tab.key === state.statusTab) ?? STATUS_FILTER_TABS[0]
    }

    function renderStatusFilterControl() {
      const btn = document.getElementById('status-filter-button')
      if (!btn) return
      const tab = currentStatusTab()
      btn.classList.remove('hidden')
      btn.innerHTML = `${tab.label} <span class="ml-1 text-gray-400">${countByStatusTab(tab.key)}</span>`
      renderStatusFilterOptions()
    }

    function renderStatusFilterOptions() {
      const wrap = document.getElementById('status-filter-options')
      if (!wrap) return
      wrap.innerHTML = STATUS_FILTER_TABS.map(tab => {
        const active = tab.key === state.statusTab
        const count = countByStatusTab(tab.key)
        return `<button type="button" onclick="selectStatusTab('${tab.key}')"
          class="w-full rounded-2xl border px-4 py-3 text-left transition-colors
            ${active ? 'border-green-500 bg-green-50' : 'border-gray-100 bg-gray-50 hover:bg-gray-100'}">
          <span class="flex items-center justify-between gap-3">
            <span class="text-sm font-extrabold ${active ? 'text-green-700' : 'text-gray-800'}">${tab.label}</span>
            <span class="rounded-full px-2 py-1 text-xs font-bold ${active ? 'bg-green-600 text-white' : 'bg-white text-gray-400'}">${count}</span>
          </span>
        </button>`
      }).join('')
    }

    function selectStatusTab(tabKey) {
      state.statusTab = tabKey
      renderPlants(state.plants)
      closeStatusFilterModal()
    }

    function openStatusFilterModal() {
      renderStatusFilterOptions()
      document.getElementById('status-filter-modal').classList.remove('hidden')
    }

    function closeStatusFilterModal() {
      document.getElementById('status-filter-modal').classList.add('hidden')
    }

    function onStatusFilterBackdropClick(event) {
      if (event.target === event.currentTarget) closeStatusFilterModal()
    }

    function getFilteredByStatus(plants) {
      const statuses = STATUS_TAB_GROUPS[state.statusTab]
      if (!statuses) return plants
      return plants.filter(p => statuses.includes(p.status))
    }

    function plantLocationContext(inst) {
      const loc = state.allLocations.find(l => l.id === inst.location_id)
      if (!loc) return null
      const parent = loc.level === 2 ? state.allLocations.find(l => l.id === loc.parent_id) : null
      const label = parent ? `${parent.name}/${loc.name}` : loc.name
      const sun = locationUtil.getEffectiveSunlight(inst.location_id, state.allLocations)
      return {
        label,
        sunlight: sun.value ? locationUtil.formatSunlightContext(sun) : '',
      }
    }

    // ════════════════════════════════════════════════
    // 식물 렌더 (이미지 + 이름 + 상태 배지)
    // ════════════════════════════════════════════════
    function renderPlants(plants) {
      const filtered = getFilteredByStatus(plants)
      renderStatusFilterControl()

      const gridEl  = document.getElementById('plant-grid')
      const emptyEl = document.getElementById('empty-plants')
      const countEl = document.getElementById('result-count')

      if (filtered.length === 0) {
        gridEl.innerHTML = ''
        emptyEl.classList.remove('hidden')
        countEl.textContent = plants.length > 0 ? `0 / ${plants.length}종` : ''
        return
      }
      emptyEl.classList.add('hidden')
      countEl.textContent = filtered.length === plants.length
        ? `${plants.length}종`
        : `${filtered.length} / ${plants.length}종`

      gridEl.innerHTML = filtered.map(inst => {
        const p      = inst.plants
        const imgUrl = p ? plantImageUrl(p, 400, 400) : null
        const name = p?.name ?? '알 수 없음'
        const detailHref = `instance-detail.html#${inst.id}`
        const photoContent = imgUrl
          ? `<a href="${detailHref}" class="plant-photo-link block w-full h-full no-underline">
               <div class="plant-img-skeleton absolute inset-0 flex items-center justify-center animate-pulse">
                 <span class="text-2xl opacity-20">🌿</span>
               </div>
               <img src="${imgUrl}" alt="${escapeHtml(name)}"
                 class="w-full h-full object-cover opacity-0 transition-opacity duration-300"
                 onload="this.classList.remove('opacity-0'); this.previousElementSibling.remove()"
                 onerror="this.closest('.plant-photo-link').innerHTML='<div class=\\'w-full h-full flex items-center justify-center text-4xl\\'>🌿</div>'" />
             </a>`
          : `<a href="${detailHref}" class="block w-full h-full no-underline">
               <div class="w-full h-full flex items-center justify-center text-4xl">🌿</div>
             </a>`
        const statusBtn = inst.status
          ? `<button id="gs-${inst.id}"
               onclick="openStatusPicker(event,'${inst.id}','${inst.status}',s=>updateGridStatus('${inst.id}',s))"
               title="${escapeHtml(statusLabel(inst.status))}"
               aria-label="상태 변경: ${escapeHtml(statusLabel(inst.status))}"
               class="status-badge ${statusClass(inst.status)} absolute top-2 right-2 max-w-[72%] text-[11px] px-2 py-1 rounded-full leading-tight truncate shadow-sm z-10">
               ${escapeHtml(statusLabel(inst.status))}
             </button>`
          : ''
        const imgEl = `
          <div class="plant-img-wrap w-full aspect-square overflow-hidden rounded-xl bg-green-50 relative mb-2">
            ${photoContent}
            ${statusBtn}
          </div>`
        const risk = weatherUtil.plantTempRisk(state.currentTemp, p)
        const riskBadge = risk
          ? `<span class="inline-flex items-center px-1.5 py-0.5 rounded-full text-[10px] font-bold leading-tight
                 ${risk.type === 'cold' ? 'bg-blue-100 text-blue-700' : 'bg-orange-100 text-orange-700'}">
               ${risk.type === 'cold' ? '저온' : '고온'}
             </span>`
          : ''
        const riskEl = riskBadge ? `<div class="flex gap-1 mt-1 items-center">${riskBadge}</div>` : ''
        const waterEl = renderWaterBadge(inst)
        const healthEl = renderHealthBadge(inst)
        const locCtx = plantLocationContext(inst)
        const locEl = locCtx ? `<p class="mt-1 text-[11px] text-gray-400 truncate">${escapeHtml(locCtx.label)}${locCtx.sunlight ? ` · ${escapeHtml(locCtx.sunlight)} 기준` : ''}</p>` : ''
        return `
          <div class="block bg-white rounded-2xl p-3 shadow-sm border border-gray-100 hover:shadow-md transition-shadow active:scale-95">
            ${imgEl}
            <a href="${detailHref}" class="block no-underline">
              <p class="text-sm font-semibold text-gray-800 line-clamp-2 min-h-[2.15rem] leading-tight" style="word-break: keep-all !important; overflow-wrap: normal !important; word-wrap: normal !important; white-space: normal;">${formatPlantName(name)}</p>
            </a>
            ${locEl}
            ${waterEl}
            ${healthEl}
            ${riskEl}
          </div>`
      }).join('')
    }

    function updateGridStatus(instId, newStatus) {
      const btn = document.getElementById(`gs-${instId}`)
      if (!btn) return
      btn.className = `status-badge ${statusClass(newStatus)} absolute top-2 right-2 max-w-[72%] text-[11px] px-2 py-1 rounded-full leading-tight truncate shadow-sm z-10`
      btn.title = statusLabel(newStatus)
      btn.setAttribute('aria-label', `상태 변경: ${statusLabel(newStatus)}`)
      btn.textContent = statusLabel(newStatus)
      btn.setAttribute('onclick', `openStatusPicker(event,'${instId}','${newStatus}',s=>updateGridStatus('${instId}',s))`)
      const inst = state.plants.find(p => p.id === instId)
      if (inst) inst.status = newStatus
    }

    // ════════════════════════════════════════════════
    // 위치 선택
    // ════════════════════════════════════════════════
    async function selectL1(id, preferL2 = null) {
      state.selectedL1 = state.level1List.find(l => l.id === id) ?? null
      state.selectedL2 = null
      state.currentTemp = null
      state.rainSummary = null
      sessionStorage.setItem('flowerbed_l1', id)
      renderL1Tabs()
      try { state.level2List = await locationsApi.getLevel2(id) }
      catch { state.level2List = [] }
      renderL2Tabs()
      // 좌표가 있으면 비동기로 날씨 로드 → 완료 시 카드 재렌더 (배지 갱신)
      if (state.selectedL1?.lat && state.selectedL1?.lng) {
        weatherUtil.loadWeather(state.selectedL1.lat, state.selectedL1.lng).then(cur => {
          if (cur) { state.currentTemp = cur.temperature_2m; renderPlants(state.plants) }
        })
        weatherUtil.loadRainSummary(state.selectedL1.lat, state.selectedL1.lng).then(rain => {
          state.rainSummary = rain
          renderPlants(state.plants)
        })
      }
      const l2Target = preferL2 && state.level2List.find(l => l.id === preferL2)
        ? preferL2 : (state.level2List[0]?.id ?? null)
      if (l2Target) await selectL2(l2Target)
      else { state.selectedL2 = null; await loadPlants(id) }
    }

    async function selectL2(id) {
      state.selectedL2 = state.level2List.find(l => l.id === id) ?? null
      sessionStorage.setItem('flowerbed_l2', id)
      renderL2Tabs()
      if (state.selectedL2) await loadPlants(id)
    }

    async function loadPlants(locationId) {
      document.getElementById('content').classList.remove('hidden')
      document.getElementById('result-count').textContent = '...'
      document.getElementById('plant-grid').innerHTML = ''
      document.getElementById('empty-plants').classList.add('hidden')
      try {
        state.plants = await gardenApi.listByLocation(locationId)
        try {
          const logs = await healthApi.listActiveForInstances(state.plants.map(p => p.id))
          state.healthByInstance = Object.fromEntries(logs.map(log => [log.garden_plant_id, log]))
        } catch (_) {
          state.healthByInstance = {}
        }
        renderPlants(state.plants)
      } catch (err) {
        document.getElementById('result-count').textContent = '오류: ' + err.message
      }
    }

    // ════════════════════════════════════════════════
    // 상태 피커
    // ════════════════════════════════════════════════
    let _pickerInstId = null, _pickerCallback = null

    function openStatusPicker(e, instId, currentStatus, callback) {
      e.preventDefault(); e.stopPropagation()
      _pickerInstId = instId; _pickerCallback = callback
      const icons = {
        '생육중': '✓', '파종': '·', '삽목': '↧', '분주': '◇',
        '모종': '⌁', '묘목': '♧', '보관': '○',
      }
      const isActive = (s) => s === currentStatus || (s === '보관' && currentStatus === '구근')
      document.getElementById('picker-growth').innerHTML = `
        <button onclick="pickStatus('생육중')" class="status-choice status-choice-wide ${isActive('생육중') ? 'active' : ''}">
          <span class="status-choice-icon">${icons['생육중']}</span><span>생육중</span>
        </button>
        <div class="status-choice-row status-choice-row-3">
          ${['파종','삽목','분주'].map(s => `<button onclick="pickStatus('${s}')" class="status-choice ${isActive(s) ? 'active' : ''}"><span class="status-choice-icon">${icons[s]}</span><span>${s}</span></button>`).join('')}
        </div>
        <div class="status-choice-row status-choice-row-2">
          ${['모종','묘목'].map(s => `<button onclick="pickStatus('${s}')" class="status-choice ${isActive(s) ? 'active' : ''}"><span class="status-choice-icon">${icons[s]}</span><span>${s}</span></button>`).join('')}
        </div>
        <button onclick="pickStatus('보관')" class="status-choice status-choice-storage ${isActive('보관') ? 'active' : ''}">
          <span class="status-choice-icon">${icons['보관']}</span><span>보관</span>
        </button>`
      document.getElementById('picker-health').innerHTML = ''
      document.getElementById('status-picker').classList.remove('hidden')
    }

    function closeStatusPicker() {
      document.getElementById('status-picker').classList.add('hidden')
      _pickerInstId = null; _pickerCallback = null
    }

    async function pickStatus(status) {
      if (!_pickerInstId) return
      try {
        const { error } = await window._supabase.from('plant_instances').update({ status }).eq('id', _pickerInstId)
        if (error) throw error
        if (_pickerCallback) _pickerCallback(status)
      } catch (err) { alert('저장 실패: ' + err.message) }
      closeStatusPicker()
    }

    function visiblePlantsForWater() {
      return getFilteredByStatus(state.plants)
    }

    function openWaterModal() {
      const list = visiblePlantsForWater()
      const label = state.selectedL2?.name || state.selectedL1?.name || '현재 위치'
      document.getElementById('water-target-label').textContent = `${label} · ${list.length}종`
      document.getElementById('water-error').classList.add('hidden')
      document.getElementById('water-list').innerHTML = list.length
        ? list.map(inst => `<label class="flex items-center gap-3 rounded-xl border border-gray-100 bg-gray-50 p-3">
            <input type="checkbox" class="water-check accent-green-600" value="${inst.id}" />
            <div class="min-w-0 flex-1">
              <p class="text-sm font-semibold text-gray-800 truncate">${inst.plants?.name ?? '알 수 없음'}</p>
              <p class="text-xs text-gray-400">${inst.quantity ?? 1}개 · ${wateringUtil.getWaterStatus(inst, inst.plants, state.rainSummary, { sunlight: locationUtil.getEffectiveSunlight(inst.location_id, state.allLocations).value }).label}</p>
            </div>
          </label>`).join('')
        : '<p class="text-sm text-gray-400 text-center py-6">현재 위치에 식물이 없습니다.</p>'
      document.getElementById('water-modal').classList.remove('hidden')
    }

    function closeWaterModal() { document.getElementById('water-modal').classList.add('hidden') }
    function onWaterBackdropClick(e) { if (e.target === e.currentTarget) closeWaterModal() }

    function showWaterToast(count) {
      const toast = document.getElementById('water-toast')
      const title = document.getElementById('water-toast-title')
      if (!toast || !title) return
      title.textContent = `${count}개의 물주기를 완료했어요.`
      toast.classList.remove('hidden')
      const card = toast.querySelector('.water-toast')
      const dots = toast.querySelectorAll('.water-toast-dot')
      if (card) {
        card.style.animation = 'none'
        void card.offsetWidth
        card.style.animation = ''
      }
      dots.forEach(dot => {
        dot.style.animation = 'none'
        void dot.offsetWidth
        dot.style.animation = ''
      })
      window.clearTimeout(showWaterToast._timer)
      showWaterToast._timer = window.setTimeout(() => toast.classList.add('hidden'), 2400)
    }

    async function markWatered(ids) {
      if (!ids.length) return
      const uniqueIds = [...new Set(ids)]
      const today = todayLocalDate()
      const { error } = await window._supabase
        .from('plant_instances')
        .update({ last_watered_at: today })
        .in('id', uniqueIds)
        .eq('user_id', window.MY_USER_ID)
      if (error) throw error
      state.plants.forEach(inst => {
        if (uniqueIds.includes(inst.id)) inst.last_watered_at = today
      })
      renderPlants(state.plants)
      closeWaterModal()
      showWaterToast(uniqueIds.length)
    }

    async function waterAllVisible() {
      try { await markWatered(visiblePlantsForWater().map(inst => inst.id)) }
      catch (err) {
        document.getElementById('water-error').textContent = err.message
        document.getElementById('water-error').classList.remove('hidden')
      }
    }

    async function waterSelected() {
      try {
        const ids = [...document.querySelectorAll('.water-check:checked')].map(input => input.value)
        if (!ids.length) throw new Error('물줄 식물을 선택해주세요.')
        await markWatered(ids)
      } catch (err) {
        document.getElementById('water-error').textContent = err.message
        document.getElementById('water-error').classList.remove('hidden')
      }
    }

    // ════════════════════════════════════════════════
    // 식물추가 모달 — 위치 선택
    // ════════════════════════════════════════════════
    let plantSearchTimer = null, searchResults = []

    function fillModalL1() {
      const sel = document.getElementById('p-loc-l1')
      sel.innerHTML = '<option value="">정원 선택</option>'
      state.level1List.forEach(l => {
        const opt = document.createElement('option')
        opt.value = l.id; opt.textContent = l.name
        sel.appendChild(opt)
      })
    }

    async function onPlantModalL1Change() {
      const l1Id  = document.getElementById('p-loc-l1').value
      const l2Sel = document.getElementById('p-loc-l2')
      l2Sel.classList.add('hidden')
      l2Sel.innerHTML = ''
      updatePlantModalSunlightHint()
      if (!l1Id) return
      try {
        const children = await locationsApi.getLevel2(l1Id)
        if (children.length === 0) { updatePlantModalSunlightHint(); return }
        children.forEach(l => {
          const opt = document.createElement('option')
          opt.value = l.id; opt.textContent = l.sunlight_type ? `${l.name} · ${l.sunlight_type}` : l.name
          l2Sel.appendChild(opt)
        })
        l2Sel.classList.remove('hidden')
        updatePlantModalSunlightHint()
      } catch (_) {}
    }

    function updatePlantModalSunlightHint() {
      const l2Id = document.getElementById('p-loc-l2')?.value
      const l1Id = document.getElementById('p-loc-l1')?.value
      const locId = l2Id || l1Id
      const hint = document.getElementById('p-sunlight-hint')
      if (!hint) return
      const ctx = locationUtil.getEffectiveSunlight(locId, state.allLocations)
      hint.textContent = `적용 일조량: ${locationUtil.formatSunlightContext(ctx)}`
      hint.classList.toggle('hidden', !locId)
    }

    async function openPlantModal() {
      fillModalL1()
      // 현재 선택된 위치로 pre-fill
      const l1Sel = document.getElementById('p-loc-l1')
      const l2Sel = document.getElementById('p-loc-l2')
      if (state.selectedL1) {
        l1Sel.value = state.selectedL1.id
        await onPlantModalL1Change()
        if (state.selectedL2) l2Sel.value = state.selectedL2.id
        updatePlantModalSunlightHint()
      }
      const locName = state.selectedL2?.name || state.selectedL1?.name || ''
      const defaultCultivation = locName.includes('하우스') || locName.includes('온실')
        ? '온실/하우스'
        : (locName.includes('화분') ? '실외 화분' : '노지')
      const cultBtn = document.querySelector(`.cultivation-pill[data-cultivation-val="${defaultCultivation}"]`)
      if (cultBtn) selectCultivationType(cultBtn, defaultCultivation)
      document.getElementById('modal-plant').classList.remove('hidden')
      document.getElementById('p-search-input').focus()
    }

    function closePlantModal() {
      document.getElementById('modal-plant').classList.add('hidden')
      document.getElementById('form-plant').reset()
      document.getElementById('plant-error').classList.add('hidden')
      document.getElementById('p-loc-l2').classList.add('hidden')
      document.getElementById('p-sunlight-hint').classList.add('hidden')
      pendingPlantPayload = null
      clearPlantSelection()
    }

    function debouncePlantSearch() {
      clearTimeout(plantSearchTimer)
      plantSearchTimer = setTimeout(runPlantSearch, 250)
    }

    document.getElementById('p-search-results').addEventListener('mousedown', async function(e) {
      const btn = e.target.closest('[data-idx]')
      if (!btn) return
      e.preventDefault()
      const p = searchResults[parseInt(btn.dataset.idx)]
      if (p) await selectPlant(p.id, p.name, p.category ?? '', plantImageUrl(p, 80, 80) ?? '')
    })

    async function runPlantSearch() {
      const query   = document.getElementById('p-search-input').value.trim()
      const results = document.getElementById('p-search-results')
      const spinner = document.getElementById('p-search-loading')
      if (!query) { results.classList.add('hidden'); return }
      spinner.classList.remove('hidden'); results.classList.add('hidden')
      try {
        const plants = await plantsApi.list(query, '')
        searchResults = plants
        spinner.classList.add('hidden')
        results.innerHTML = plants.length === 0
          ? '<p class="text-xs text-gray-400 px-3 py-3 text-center">검색 결과 없음</p>'
          : plants.map((p, i) => `
              <button type="button" data-idx="${i}"
                class="w-full flex items-center gap-2.5 px-3 py-2.5 hover:bg-green-50 transition-colors text-left border-b border-gray-50 last:border-0">
                <div class="w-8 h-8 rounded-lg overflow-hidden bg-green-100 flex items-center justify-center text-base flex-shrink-0 pointer-events-none">
                  ${plantImageUrl(p,80,80) ? `<img src="${plantImageUrl(p,80,80)}" class="w-full h-full object-cover" onerror="this.parentElement.textContent='🌿'" />` : '🌿'}
                </div>
                <div class="flex-1 min-w-0 pointer-events-none">
                  <p class="text-sm font-semibold text-gray-800 truncate">${p.name}</p>
                  <p class="text-xs text-gray-400">${p.category ?? ''}</p>
                </div>
              </button>`).join('')
        results.classList.remove('hidden')
      } catch { spinner.classList.add('hidden') }
    }

    async function selectPlant(id, name, category, imgUrl) {
      document.getElementById('p-search-wrap').classList.add('hidden')
      document.getElementById('p-search-results').classList.add('hidden')
      document.getElementById('p-selected-plant').classList.remove('hidden')
      document.getElementById('p-plant-id').value = id
      document.getElementById('p-selected-name').textContent = name
      document.getElementById('p-selected-cat').textContent  = category
      const thumb = document.getElementById('p-selected-thumb')
      thumb.innerHTML = imgUrl ? `<img src="${imgUrl}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='🌿'" />` : '🌿'
      renderStatusOptions(category)
      try { selectedPlantDetail = await plantsApi.getById(id) }
      catch (_) { selectedPlantDetail = { id, name, category } }
    }

    function clearPlantSelection() {
      document.getElementById('p-plant-id').value = ''
      document.getElementById('p-status').value   = ''
      document.getElementById('p-selected-plant').classList.add('hidden')
      document.getElementById('p-search-wrap').classList.remove('hidden')
      document.getElementById('p-search-input').value = ''
      document.getElementById('p-search-results').classList.add('hidden')
      document.getElementById('p-status-options').classList.add('hidden')
      document.getElementById('p-status-disabled').classList.remove('hidden')
      selectedPlantDetail = null
      document.getElementById('p-search-input').focus()
    }

    function renderStatusOptions(category) {
      const baseOptions = (STATUS_MAP[category] ?? '생육중,파종,모종').split(',')
      const options = ['생육중', ...baseOptions.filter(s => s !== '생육중')]
      const optEl    = document.getElementById('p-status-options')
      const disEl    = document.getElementById('p-status-disabled')
      const hiddenEl = document.getElementById('p-status')
      disEl.classList.add('hidden'); optEl.classList.remove('hidden')
      hiddenEl.value = options[0]
      optEl.innerHTML = options.map((s, i) => `
        <button type="button"
          class="status-pill flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold border transition-colors
                 ${i === 0 ? 'bg-green-600 text-white border-green-600' : 'bg-white text-gray-500 border-gray-200 hover:border-green-400'}"
          onclick="selectStatusOption(this,'${s}')">${s}</button>`).join('')
    }

    function selectCultivationType(btn, value) {
      document.getElementById('p-cultivation-type').value = value
      document.querySelectorAll('.cultivation-pill').forEach(b => {
        b.className = 'cultivation-pill px-2 py-2 rounded-xl text-xs font-semibold border bg-white text-gray-500 border-gray-200'
      })
      btn.className = 'cultivation-pill px-2 py-2 rounded-xl text-xs font-semibold border bg-green-600 text-white border-green-600'
    }

    function selectStatusOption(btn, value) {
      document.getElementById('p-status').value = value
      document.querySelectorAll('.status-pill').forEach(b => {
        b.className = b.className.replace('bg-green-600 text-white border-green-600','bg-white text-gray-500 border-gray-200 hover:border-green-400')
      })
      btn.className = btn.className.replace('bg-white text-gray-500 border-gray-200 hover:border-green-400','bg-green-600 text-white border-green-600')
    }

    function openCareGuideModal(status, plant) {
      const title = document.getElementById('care-guide-title')
      const body = document.getElementById('care-guide-body')
      document.getElementById('care-guide-error').classList.add('hidden')
      if (status === '파종') {
        const range = sowingRange(plant)
        const temp = plant?.germination_temp_min && plant?.germination_temp_max
          ? `${plant.germination_temp_min}~${plant.germination_temp_max}°C`
          : null
        title.textContent = `${plant?.name ?? '식물'} 파종 안내`
        body.innerHTML = `
          <div class="grid grid-cols-2 gap-2">
            ${guideRow('발아 유형', plant?.germination_type || '일반 기준')}
            ${guideRow('흙덮기', formatDepth(plant))}
            ${guideRow('발아 확인', `${range.min}~${range.max}일${range.fallback ? ' · 일반 기준' : ''}`)}
            ${guideRow('발아 온도', temp)}
          </div>
          ${guideRow('물관리', plant?.sowing_water_note || '흙이 마르지 않게 분무로 가볍게 촉촉하게 유지하세요.')}
          ${guideRow('파종 팁', plant?.sowing_note || '씨앗이 너무 깊이 묻히지 않게 하고, 발아 전에는 흙마름을 자주 확인하세요.')}`
      } else {
        const range = cuttingRange(plant)
        title.textContent = `${plant?.name ?? '식물'} 삽목 안내`
        body.innerHTML = `
          <div class="grid grid-cols-2 gap-2">
            ${guideRow('상태 확인', '7일 뒤')}
            ${guideRow('뿌리 확인', `${range.min}~${range.max}일${range.fallback ? ' · 일반 기준' : ''}`)}
          </div>
          ${guideRow('삽목 관리', plant?.cutting_note || '밝은 그늘에서 잎이 마르지 않게 관리하고, 과습과 곰팡이를 조심하세요.')}`
      }
      document.getElementById('care-guide-modal').classList.remove('hidden')
    }

    function closeCareGuideModal() {
      document.getElementById('care-guide-modal').classList.add('hidden')
      pendingPlantPayload = null
    }

    function onCareGuideBackdropClick(event) {
      if (event.target === event.currentTarget) closeCareGuideModal()
    }

    async function confirmCareGuideAdd() {
      if (!pendingPlantPayload) return
      const payload = pendingPlantPayload
      pendingPlantPayload = null
      document.getElementById('care-guide-modal').classList.add('hidden')
      await addPlantWithTasks(payload, selectedPlantDetail)
    }

    async function handleAddPlant(e) {
      e.preventDefault()
      const errEl   = document.getElementById('plant-error')
      errEl.classList.add('hidden')
      const l1Id    = document.getElementById('p-loc-l1').value
      const l2Id    = document.getElementById('p-loc-l2').value
      const locId   = l2Id || l1Id
      const plantId = document.getElementById('p-plant-id').value
      if (!locId)   { errEl.textContent = '위치를 선택해 주세요.'; errEl.classList.remove('hidden'); return }
      if (!plantId) { errEl.textContent = '식물을 검색하여 선택해 주세요.'; errEl.classList.remove('hidden'); return }
      const l1 = state.allLocations.find(l => l.id === l1Id)
      const l2 = state.allLocations.find(l => l.id === l2Id)
      const locationText = l2Id
        ? `${l1?.name ?? ''}/${l2?.name ?? ''}`
        : (l1?.name ?? '')
      const status = document.getElementById('p-status').value || null
      const payload = {
        plant_id:     plantId,
        location_id:  locId,
        location:     locationText,
        status,
        quantity:     parseInt(document.getElementById('p-quantity').value) || 1,
        planted_date: document.getElementById('p-planted-date').value || null,
        cultivation_type: document.getElementById('p-cultivation-type').value || '노지',
      }
      if (['파종', '삽목'].includes(status)) {
        pendingPlantPayload = payload
        openCareGuideModal(status, selectedPlantDetail)
        return
      }
      await addPlantWithTasks(payload, selectedPlantDetail)
    }

    async function addPlantWithTasks(payload, plant) {
      const errEl = document.getElementById('plant-error')
      try {
        const inst = await gardenApi.insert(payload)
        await createCareTasks(inst.id, payload.status, payload.planted_date, plant)
        closePlantModal()
        // 추가된 위치가 현재 보고 있는 위치면 즉시 새로고침
        const activeLocId = state.selectedL2?.id ?? state.selectedL1?.id
        if (activeLocId === payload.location_id) await loadPlants(payload.location_id)
      } catch (err) { errEl.textContent = err.message; errEl.classList.remove('hidden') }
    }

    async function createCareTasks(instanceId, status, baseDate, plant) {
      const start = baseDate || todayLocalDate()
      if (status === '파종') {
        const range = sowingRange(plant)
        await tasksApi.add({
          plant_instance_id: instanceId,
          title: '발아 확인',
          task_type: '발아 확인',
          due_date: addDaysKey(start, range.min),
          memo: range.fallback ? '일반 기준으로 발아 상태를 확인하세요.' : `${range.min}~${range.max}일 기준으로 발아 상태를 확인하세요.`,
        })
      } else if (status === '삽목') {
        const range = cuttingRange(plant)
        await tasksApi.add({
          plant_instance_id: instanceId,
          title: '삽목 상태 확인',
          task_type: '삽목 확인',
          due_date: addDaysKey(start, 7),
          memo: '잎 마름, 곰팡이, 과습 여부를 확인하세요.',
        })
        await tasksApi.add({
          plant_instance_id: instanceId,
          title: '뿌리 확인',
          task_type: '뿌리 확인',
          due_date: addDaysKey(start, range.min),
          memo: range.fallback ? '일반 기준으로 발근 여부를 확인하세요.' : `${range.min}~${range.max}일 기준으로 발근 여부를 확인하세요.`,
        })
      }
    }

    // ════════════════════════════════════════════════
    // 초기화
    // ════════════════════════════════════════════════
    async function init() {
      fixStickyTops()
      document.getElementById('loading').classList.remove('hidden')
      document.getElementById('content').classList.add('hidden')
      document.getElementById('no-location').classList.add('hidden')
      try {
        state.allLocations = await locationsApi.getAll()
        state.level1List = state.allLocations.filter(l => l.level === 1)
        document.getElementById('loading').classList.add('hidden')
        if (state.level1List.length === 0) {
          document.getElementById('no-location').classList.remove('hidden'); return
        }
        renderL1Tabs()

        // garden.html에서 넘어온 위치 파라미터 처리
        const params   = new URLSearchParams(location.search)
        const locParam = params.get('loc')

        const savedL1  = sessionStorage.getItem('flowerbed_l1')
        const savedL2  = sessionStorage.getItem('flowerbed_l2')
        const l1Id     = (savedL1 && state.level1List.find(l => l.id === savedL1))
          ? savedL1 : state.level1List[0].id

        // loc 파라미터가 있으면 해당 위치로 먼저 이동
        if (locParam) {
          // locParam이 L2인지 L1인지 확인하려면 전체 로드 필요
          const targetLoc = state.allLocations.find(l => l.id === locParam)
          if (targetLoc?.level === 2) {
            await selectL1(targetLoc.parent_id, locParam)
          } else if (targetLoc?.level === 1) {
            await selectL1(locParam)
          } else {
            await selectL1(l1Id, savedL2)
          }
          history.replaceState(null, '', 'flowerbed.html')
        } else {
          await selectL1(l1Id, savedL2)
        }

        fixStickyTops()

        // 도감에서 "정원식물에 추가"로 넘어온 경우
        const preselectId = sessionStorage.getItem('preselect_plant_id')
        if (params.get('add') === '1' && preselectId) {
          sessionStorage.removeItem('preselect_plant_id')
          sessionStorage.removeItem('preselect_plant_name')
          try {
            const plant = await window.plantsApi.getById(preselectId)
            openPlantModal()
            selectPlant(plant.id, plant.name, plant.category ?? '', window.plantImageUrl(plant))
          } catch (_) { openPlantModal() }
          history.replaceState(null, '', 'flowerbed.html')
        }

      } catch (err) {
        document.getElementById('loading').innerHTML =
          `<p class="text-red-400 text-sm py-4 text-center">${err.message}</p>`
      }
    }

    init()
  </script>
</body>
