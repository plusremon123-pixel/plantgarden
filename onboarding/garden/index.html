<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정원 등록 온보딩</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/style.css" />
  <style>
    body {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .02)),
        url('../../assets/onboarding/garden-onboarding-figma-bg.png');
      background-size: cover;
      background-position: center top;
    }
    :root {
      --garden-title: #41500D;
      --garden-muted: #898F72;
      --garden-olive: #80962F;
      --garden-coral: #CB4736;
      --garden-border: #DDE3C9;
    }
    .garden-card {
      box-shadow: 0 22px 46px rgba(87, 66, 21, .12);
    }
    .choice-pill {
      min-height: 39px;
      border: 1px solid var(--garden-border);
      background: rgba(255, 255, 255, .78);
      color: #3D4A0E;
      font-weight: 700;
      line-height: 1.25;
      word-break: keep-all;
      overflow-wrap: normal;
      backdrop-filter: blur(4px);
      transition: transform .12s ease, background .12s ease, color .12s ease, border-color .12s ease;
    }
    .choice-pill.active {
      background: var(--garden-olive);
      border-color: var(--garden-olive);
      color: white;
      box-shadow: 0 10px 20px rgba(128, 150, 47, .18);
    }
    .choice-pill:active { transform: scale(.99); }
    .onboarding-card-shell {
      margin-top: min(30vh, 220px);
    }
    .onboarding-footer {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%);
      z-index: 2;
    }
  </style>
</head>
<body class="min-h-screen text-gray-900">
  <main class="relative mx-auto min-h-screen w-full max-w-md px-0 py-0">
    <section id="card" class="garden-card onboarding-card-shell mx-auto w-[calc(100%-52px)] max-w-[309px] overflow-hidden rounded-[20px] bg-white/60 px-[30px] py-[30px] backdrop-blur-[2px]"></section>

    <footer id="footer" class="onboarding-footer grid w-[calc(100%-52px)] max-w-[309px] grid-cols-2 gap-3"></footer>
  </main>

  <script src="../../js/onboarding-profile.js"></script>
  <script>
    const totalSteps = 10
    let step = 1
    const draft = {
      type: '',
      region: '',
      lat: null,
      lng: null,
      addressText: '',
      name: '',
      spaces: [],
      sunlight: '',
      cultivationType: '',
      soil: '',
      weatherEnabled: true,
    }

    const cards = {
      1: {
        title: '나의 정원을 만들어볼게요',
        desc: '화분 하나, 베란다 한쪽도 정원이 될 수 있어요. 정원집사가 몇 가지만 물어볼게요.',
        start: true,
      },
      2: {
        title: '정원은 어디에 있나요?',
        desc: '정원을 어디에서 관리하는지 알려주세요.',
        key: 'type',
        options: ['시골집', '우리집', '베란다', '테라스', '텃밭', '하우스', '직접 입력'],
      },
      3: {
        title: '어느 지역에 있는 정원인가요?',
        desc: '비 예보, 기온, 강수량을 참고해서 물주기와 작업 시간을 알려드릴게요. 정확한 주소가 아니어도 괜찮아요.',
        key: 'regionMode',
        options: ['현재 위치 사용', '동네만 입력', '나중에 설정'],
      },
      4: {
        title: '이 정원의 이름을 정해볼까요?',
        desc: '나중에 언제든 바꿀 수 있어요.',
        key: 'name',
        options: ['시골집 정원', '서울집 베란다', '우리집 텃밭', '엄마의 화단', '직접 입력'],
      },
      5: {
        title: '정원 안을 나눠서 관리할까요?',
        desc: '앞마당, 화단, 화분처럼 나눠두면 식물을 더 쉽게 찾고 관리할 수 있어요.',
        key: 'spaces',
        multi: true,
        options: ['앞마당', '뒷마당', '왼쪽 화단', '오른쪽 화단', '화분', '텃밭', '하우스', '나중에 할게요'],
      },
      6: {
        title: '이 공간에는 해가 얼마나 들어오나요?',
        desc: '정확히 몰라도 괜찮아요. 대략만 선택해 주세요. 이 정보는 식물을 어디에 심을지 추천할 때 사용됩니다.',
        key: 'sunlight',
        options: ['종일 잘 들어와요', '오전만 들어와요', '오후만 들어와요', '반나절 정도', '그늘이 많아요', '잘 모르겠어요'],
      },
      7: {
        title: '어디서 키우세요?',
        desc: '땅인지 화분인지에 따라 비 오는 날과 물마름 계산이 달라져요.',
        key: 'cultivationType',
        options: ['땅에 심어요', '밖 화분이에요', '집 안 화분이에요', '하우스에서 키워요', '잘 모르겠어요'],
      },
      8: {
        title: '흙은 어떤 편인가요?',
        desc: '정확하지 않아도 괜찮아요. 물 빠짐을 대략만 알려주세요.',
        key: 'soil',
        options: () => soilOptionsForCultivation(draft.cultivationType),
      },
      9: {
        title: '날씨에 맞춰 정원 알림을 받을까요?',
        desc: '비가 오면 물주기를 미루고, 더운 날에는 작업 시간을 안내해 드릴게요.',
        key: 'weather',
        options: ['받을게요', '나중에 설정할게요'],
      },
      10: {
        title: '정원이 만들어졌어요',
        desc: '이제 정원집사가 날씨와 정원 상태를 보고 오늘 해야 할 일을 함께 챙겨드릴게요.',
        done: true,
      },
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[ch]))
    }

    function currentValue(key) {
      if (key === 'weather') return draft.weatherEnabled ? '받을게요' : '나중에 설정할게요'
      return draft[key]
    }

    function soilOptionsForCultivation(type) {
      if (type === '집 안 화분이에요' || type === '밖 화분이에요') {
        return ['일반 분갈이흙', '배수 좋은 배합토', '마사토 섞은 흙', '수분 오래가는 배합토', '잘 모르겠어요']
      }
      if (type === '하우스에서 키워요') {
        return ['배수 좋은 배합토', '일반 양토', '상토', '수분 오래가는 배합토', '잘 모르겠어요']
      }
      return ['물이 잘 빠지는 땅', '일반 양토', '모래기 있는 흙', '물이 오래 머무는 자리', '잘 모르겠어요']
    }

    function selectOption(key, value, multi = false) {
      if (key === 'weather') {
        draft.weatherEnabled = value === '받을게요'
      } else if (multi) {
        if (value === '나중에 할게요') draft.spaces = ['나중에 할게요']
        else {
          draft.spaces = draft.spaces.filter(v => v !== '나중에 할게요')
          draft.spaces = draft.spaces.includes(value)
            ? draft.spaces.filter(v => v !== value)
            : [...draft.spaces, value]
        }
      } else if (value === '직접 입력') {
        draft[key] = ''
        draft[`${key}Custom`] = true
      } else {
        draft[key] = value
        draft[`${key}Custom`] = false
        if (key === 'cultivationType') draft.soil = ''
      }
      render()
    }

    function textInputHtml(key, placeholder) {
      const value = escapeHtml(draft[key] || '')
      return `<input id="customInput" value="${value}" placeholder="${placeholder}"
        oninput="draft['${key}']=this.value"
        class="mt-4 w-full rounded-[10px] border border-[#DDE3C9] bg-white/86 px-4 py-3 text-base font-bold text-[#3D4A0E] outline-none placeholder:text-[#B4B7A9] focus:border-[#80962F] focus:ring-4 focus:ring-[#80962F]/10" />`
    }

    async function useCurrentLocation() {
      const status = document.getElementById('locationStatus')
      if (status) status.textContent = '위치를 확인하고 있어요.'
      if (!navigator.geolocation) {
        if (status) status.textContent = '이 기기에서는 현재 위치를 사용할 수 없어요. 동네만 입력해도 괜찮아요.'
        return
      }
      navigator.geolocation.getCurrentPosition(async pos => {
        draft.lat = pos.coords.latitude
        draft.lng = pos.coords.longitude
        draft.region = '현재 위치'
        draft.addressText = '현재 위치'
        try {
          const url = `https://nominatim.openstreetmap.org/reverse?lat=${draft.lat}&lon=${draft.lng}&format=json&accept-language=ko`
          const resp = await fetch(url, { headers: { 'Accept-Language': 'ko' } })
          const data = await resp.json()
          const addr = data?.address || {}
          draft.region = addr.suburb || addr.city_district || addr.county || addr.city || addr.state || '현재 위치'
          draft.addressText = [addr.state, addr.city || addr.county, addr.suburb || addr.city_district].filter(Boolean).join(' > ') || draft.region
        } catch (_) {}
        if (status) status.textContent = `${draft.addressText || draft.region}로 저장할게요.`
        render()
      }, () => {
        draft.region = ''
        if (status) status.textContent = '위치 권한이 없어도 괜찮아요. 동네만 입력하거나 나중에 설정할 수 있어요.'
      }, { enableHighAccuracy: false, timeout: 4000, maximumAge: 600000 })
    }

    function canGoNext() {
      if (step === 1 || step === 9) return true
      if (step === 2) return Boolean(draft.type.trim())
      if (step === 3) return Boolean(draft.region.trim()) || ['현재 위치 사용', '나중에 설정'].includes(draft.regionMode)
      if (step === 4) return Boolean(draft.name.trim())
      if (step === 5) return draft.spaces.length > 0
      if (step === 6) return Boolean(draft.sunlight)
      if (step === 7) return Boolean(draft.cultivationType)
      if (step === 8) return Boolean(draft.soil)
      return true
    }

    function next() {
      if (!canGoNext()) return
      if (step === 3 && draft.regionMode === '나중에 설정') draft.region = ''
      if (step < totalSteps) step += 1
      render()
    }

    function prev() {
      if (step > 1) step -= 1
      render()
    }

    function finish(target) {
      const cleanSpaces = draft.spaces.filter(v => v !== '나중에 할게요')
      const profile = window.modooGardenProfile.buildProfile({ ...draft, spaces: cleanSpaces })
      window.modooGardenProfile.writeProfile(profile)

      if (target === 'plant') location.href = '../../mybook.html?add=1'
      else if (target === 'more') location.href = '../../garden.html?openGarden=1'
      else location.href = '../../calendar.html'
    }

    function renderOptions(card) {
      const key = card.key
      const selected = currentValue(key)
      const options = typeof card.options === 'function' ? card.options() : card.options
      return `<div class="mt-5 grid grid-cols-2 gap-x-[22px] gap-y-[11px]">
        ${options.map(option => {
          const active = card.multi ? draft.spaces.includes(option) : selected === option
          const action = option === '현재 위치 사용'
            ? `selectOption('${key}', '${option}', ${Boolean(card.multi)}); useCurrentLocation()`
            : `selectOption('${key}', '${option}', ${Boolean(card.multi)})`
          return `<button type="button" onclick="${action}"
            class="choice-pill ${active ? 'active' : ''} rounded-[10px] px-3 py-2 text-center text-[15px]">
            ${escapeHtml(option)}
          </button>`
        }).join('')}
      </div>`
    }

    function renderCard() {
      const card = cards[step]
      if (card.done) {
        return `
          <div>
            <h1 class="text-[23px] font-bold leading-[1.28] text-[var(--garden-title)]">${card.title}</h1>
            <p class="mt-3 text-[15px] font-semibold leading-[1.45] text-[var(--garden-muted)]">${card.desc}</p>
            <div class="mt-7 space-y-3">
              <button onclick="finish('plant')" class="w-full rounded-[15px] bg-[var(--garden-coral)] px-5 py-4 text-lg font-bold text-white shadow-lg shadow-[#CB4736]/20">식물 추가하기</button>
              <button onclick="finish('today')" class="w-full rounded-[15px] border border-[#DDE3C9] bg-white/78 px-5 py-4 text-lg font-bold text-[#3D4A0E] backdrop-blur">오늘 할 일 보기</button>
              <button onclick="finish('more')" class="w-full rounded-[15px] border border-[#DDE3C9] bg-white/78 px-5 py-4 text-lg font-bold text-[#3D4A0E] backdrop-blur">정원 위치 더 추가하기</button>
            </div>
          </div>`
      }

      let extra = ''
      if (step === 2 && draft.typeCustom) extra = textInputHtml('type', '예: 옥상 정원')
      if (step === 3) {
        if (draft.regionMode === '동네만 입력') extra = textInputHtml('region', '중랑구, 양평, 남양주')
        extra += `<p id="locationStatus" class="mt-3 min-h-5 text-sm font-semibold text-green-700">${escapeHtml(draft.addressText || '')}</p>`
      }
      if (step === 4 && draft.nameCustom) extra = textInputHtml('name', '예: 엄마의 장미밭')

      return `
        <div>
          <div>
            <h1 class="text-[23px] font-bold leading-[1.28] text-[var(--garden-title)]">${card.title}</h1>
            <p class="mt-3 text-[15px] font-semibold leading-[1.45] text-[var(--garden-muted)]">${card.desc}</p>
            ${card.start ? '' : renderOptions(card)}
            ${extra}
          </div>
          ${card.start ? '<button onclick="next()" class="mt-8 w-full rounded-[15px] bg-[var(--garden-coral)] px-5 py-4 text-[24px] font-bold text-white shadow-lg shadow-[#CB4736]/20">시작하기</button>' : ''}
        </div>`
    }

    function renderFooter() {
      const footer = document.getElementById('footer')
      if (step === 1 || step === 9) {
        footer.innerHTML = ''
        return
      }
      footer.innerHTML = `
        <button type="button" onclick="prev()" class="h-[45px] rounded-[15px] border border-white/70 bg-white/72 px-5 text-[16px] font-bold text-[#3D4A0E] shadow-lg shadow-white/15 backdrop-blur">이전</button>
        <button type="button" onclick="next()" class="h-[45px] rounded-[15px] px-5 text-[16px] font-bold shadow-lg ${canGoNext() ? 'bg-[#DEA51A] text-white shadow-[#DEA51A]/20' : 'bg-white/60 text-[#9F9A87] shadow-white/20'}">다음</button>`
    }

    function render() {
      document.getElementById('card').innerHTML = renderCard()
      renderFooter()
      setTimeout(() => document.getElementById('customInput')?.focus(), 0)
    }

    render()
  </script>
</body>
</html>
