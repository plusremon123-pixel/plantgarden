    }

    function startDrag(event) {
      if (!requireEditUnlock('원 위치 수정')) return;
      const nodeGroup = event.target.closest?.('[data-node-key]');
      if (!nodeGroup || !els.svg.contains(nodeGroup)) return;
      event.preventDefault();
      const point = svgPoint(event);
      const panelX = Number(nodeGroup.dataset.panelX);
      const panelY = Number(nodeGroup.dataset.panelY);
      dragState = {
        nodeGroup,
        panel: nodeGroup.closest('[data-panel]'),
        panelKey: nodeGroup.dataset.panelKey,
        nodeKey: nodeGroup.dataset.nodeKey,
        panelX,
        panelY,
        offsetX: point.x - panelX - Number(nodeGroup.dataset.x),
        offsetY: point.y - panelY - Number(nodeGroup.dataset.y)
      };
      nodeGroup.setPointerCapture?.(event.pointerId);
    }

    function moveDrag(event) {
      if (!dragState) return;
      event.preventDefault();
      const point = svgPoint(event);
      const options = getOptions();
      const radius = Number(dragState.nodeGroup.dataset.r);
      const nextX = Math.min(Math.max(point.x - dragState.panelX - dragState.offsetX, radius + 12), options.panelWidth - radius - 12);
      const nextY = Math.min(Math.max(point.y - dragState.panelY - dragState.offsetY, radius + 12), options.panelHeight - radius - 12);
      dragState.nodeGroup.dataset.x = nextX;
      dragState.nodeGroup.dataset.y = nextY;
      dragState.nodeGroup.setAttribute('transform', `translate(${nextX} ${nextY})`);
      updatePanelLines(dragState.panel);
      setSavedPosition(dragState.panelKey, dragState.nodeKey, nextX, nextY);
    }

    async function endDrag() {
      if (!dragState) return;
      els.status.textContent = '원 위치를 저장했습니다. SVG 저장/복사에도 현재 위치가 반영됩니다.';
      dragState = null;
      await syncCurrentSubjectToCloud();
    }

    function syncSemesterSelect(groups) {
      const current = selectedGroupKey();
      els.semesterSelect.replaceChildren();
      groups.forEach(([key]) => {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = panelTitle(key);
        els.semesterSelect.appendChild(option);
      });

      if (groups.some(([key]) => key === current)) {
        els.semesterSelect.value = current;
      } else if (groups.length) {
        els.semesterSelect.value = groups[0][0];
      }

      if (!currentEditKey && groups.length) {
        loadEditorFor(els.semesterSelect.value);
      } else if (!groups.length) {
        loadEditorFor('');
      }
    }

    function render() {
      if (!changingSemester) saveCurrentEditor();
      const rows = appRows;
      const options = getOptions();
      const groups = groupRows(rows);
      syncSemesterSelect(groups);
      const activeKey = selectedGroupKey();
      const visibleGroups = groups.filter(([key]) => key === activeKey);
      const boardColumns = 1;
      const boardRows = 1;
      const width = options.panelWidth + options.gap * 2;
      const height = options.panelHeight + options.gap * 2;

      els.svg.replaceChildren();
      els.svg.setAttribute('width', width);
      els.svg.setAttribute('height', height);
      els.svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      els.svg.appendChild(createSvgElement('rect', { x: 0, y: 0, width, height, fill: '#ffffff' }));

      visibleGroups.forEach(([key, groupRows], index) => {
        const col = index % boardColumns;
        const row = Math.floor(index / boardColumns);
        renderPanel(
          els.svg,
          key,
          groupRows,
          options.gap + col * (options.panelWidth + options.gap),
          options.gap + row * (options.panelHeight + options.gap),
          options.panelWidth,
          options.panelHeight,
          options
        );
      });

      els.status.textContent = rows.length
        ? `${subjectConfig().label} ${panelTitle(activeKey)} 자료맵을 SVG로 생성했습니다. 트리에는 현재 학기 데이터만 표시됩니다.`
        : `${subjectConfig().label} 데이터가 없습니다. 엑셀 업로드로 데이터를 넣어 주세요.`;
      renderDataTable(activeKey);
      updateEditLockUi();
    }

    function svgText() {
      const clone = els.svg.cloneNode(true);
      clone.setAttribute('xmlns', NS);
      clone.setAttribute('version', '1.1');
      const header = '<?xml version="1.0" encoding="UTF-8"?>\n';
      return header + new XMLSerializer().serializeToString(clone);
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function saveBlobToDirectory(directoryHandle, blob, filename) {
      const fileHandle = await directoryHandle.getFileHandle(filename, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(blob);
      await writable.close();
    }

    async function chooseDirectory() {
      if (!window.showDirectoryPicker) return null;
      try {
        return await window.showDirectoryPicker();
      } catch (error) {
        if (error.name === 'AbortError') return 'cancelled';
        throw error;
      }
    }

    function fileBase(groupKey) {
      const [grade, semester] = groupKey.split('-');
      return `${subjectConfig().label}_${grade}학년${semester}학기`;
    }

    function svgTextForGroup(groupKey, groupRows) {
      const options = getOptions();
      const svg = createSvgElement('svg', {
        xmlns: NS,
        version: '1.1',
        width: options.panelWidth + options.gap * 2,
        height: options.panelHeight + options.gap * 2,
        viewBox: `0 0 ${options.panelWidth + options.gap * 2} ${options.panelHeight + options.gap * 2}`
      });
      svg.appendChild(createSvgElement('rect', {
        x: 0,
        y: 0,
        width: options.panelWidth + options.gap * 2,
        height: options.panelHeight + options.gap * 2,
        fill: '#ffffff'
      }));
      renderPanel(svg, groupKey, groupRows, options.gap, options.gap, options.panelWidth, options.panelHeight, options);
      return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(svg);
    }

    function svgBlob(text) {
      return new Blob([text], { type: 'image/svg+xml;charset=utf-8' });
    }

    function downloadSvg() {
      downloadBlob(svgBlob(svgText()), `${fileBase(selectedGroupKey())}.svg`);
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function svgToPngBlob(text, width, height) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        const url = URL.createObjectURL(svgBlob(text));
        image.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const context = canvas.getContext('2d');
          context.fillStyle = '#ffffff';
          context.fillRect(0, 0, width, height);
          context.drawImage(image, 0, 0);
          URL.revokeObjectURL(url);
          canvas.toBlob(blob => {
            if (blob) resolve(blob);
            else reject(new Error('PNG 변환에 실패했습니다.'));
          }, 'image/png');
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('SVG 이미지를 PNG로 변환하지 못했습니다.'));
        };
        image.src = url;
      });
    }

    async function downloadAllSvg() {
      saveCurrentEditor();
      const groups = groupRows(appRows);
      if (!groups.length) return;
      const directoryHandle = await chooseDirectory();
      if (directoryHandle === 'cancelled') {
        els.status.textContent = '전체 SVG 저장을 취소했습니다.';
        return;
      }
      for (const [key, rows] of groups) {
        const blob = svgBlob(svgTextForGroup(key, rows));
        const filename = `${fileBase(key)}.svg`;
        if (directoryHandle) {
          await saveBlobToDirectory(directoryHandle, blob, filename);
        } else {
          downloadBlob(blob, filename);
          await wait(120);
        }
      }
      els.status.textContent = directoryHandle
        ? `${groups.length}개 학기 SVG 파일을 선택한 폴더에 저장했습니다.`
        : `${groups.length}개 학기 SVG 파일 저장을 시작했습니다.`;
    }

    async function downloadAllPng() {
      saveCurrentEditor();
      const groups = groupRows(appRows);
      if (!groups.length) return;
      const options = getOptions();
      const width = options.panelWidth + options.gap * 2;
      const height = options.panelHeight + options.gap * 2;
      const directoryHandle = await chooseDirectory();
      if (directoryHandle === 'cancelled') {
        els.status.textContent = '전체 PNG 저장을 취소했습니다.';
        return;
      }
      els.status.textContent = '전체 PNG 파일을 만드는 중입니다...';
      for (const [key, rows] of groups) {
        const blob = await svgToPngBlob(svgTextForGroup(key, rows), width, height);
        const filename = `${fileBase(key)}.png`;
        if (directoryHandle) {
          await saveBlobToDirectory(directoryHandle, blob, filename);
        } else {
          downloadBlob(blob, filename);
          await wait(120);
        }
      }
      els.status.textContent = directoryHandle
        ? `${groups.length}개 학기 PNG 파일을 선택한 폴더에 저장했습니다.`
        : `${groups.length}개 학기 PNG 파일 저장을 시작했습니다.`;
    }

    async function copySvg() {
      try {
        await navigator.clipboard.writeText(svgText());
        els.status.textContent = 'SVG 코드를 클립보드에 복사했습니다.';
      } catch (error) {
        els.status.textContent = '브라우저 권한 때문에 복사하지 못했습니다. SVG 저장을 사용해 주세요.';
      }
    }

    async function copyTextValue(text, label = '텍스트') {
      const value = String(text || '').trim();
      if (!value) {
        showAlert(`복사할 ${label} 데이터가 없습니다.`);
        return;
      }
      try {
        await navigator.clipboard.writeText(value);
        els.status.textContent = `${label}을 클립보드에 복사했습니다.`;
      } catch (error) {
        els.status.textContent = `브라우저 권한 때문에 ${label}을 복사하지 못했습니다.`;
        showAlert(`복사하지 못했습니다. 아래 내용을 직접 복사해 주세요.\n${value}`);
      }
    }

    function subjectShareLink(subjectKey = currentSubject) {
      const url = new URL(window.location.href);
      url.searchParams.delete('subject');
      url.hash = `subject=${subjectKey}`;
      return url.toString();
    }

    async function copyShareLink() {
      const link = subjectShareLink();
      try {
        await navigator.clipboard.writeText(link);
        els.status.textContent = `${subjectConfig().label} 공유 링크를 클립보드에 복사했습니다.`;
        showAlert(`${subjectConfig().label} 공유 링크를 복사했습니다.\n${link}`);
      } catch (error) {
        els.status.textContent = '브라우저 권한 때문에 공유 링크를 복사하지 못했습니다.';
        showAlert(`공유 링크를 복사하지 못했습니다.\n아래 링크를 직접 복사해 주세요.\n${link}`);
      }
    }

    function updateSubjectTabs() {
      [els.subjectMathBtn, els.subjectKoreanBtn].forEach(button => {
        const active = button.dataset.subject === currentSubject;
        button.classList.toggle('active', active);
        button.setAttribute('aria-selected', active ? 'true' : 'false');
        button.disabled = subjectSwitching;
      });
    }

    async function loadSubjectData() {
      currentEditKey = '';
      cloudLoaded = false;
      appRows = [];
      commonDepths = [];
      manualPositions = {};
      dataSource = 'shared';

      const loaded = await loadCloudSubjectState();
      if (loaded) {
        cloudLoaded = true;
        if (!appRows.length && dataSource === 'shared') {
          await createDefaultCloudState();
        }
      } else if (cloudAvailable) {
        await createDefaultCloudState();
      }

      if (!appRows.length) {
        appRows = defaultRowsForSubject();
        syncCommonDepthsFromRows(appRows);
      }

      syncSemesterSelect(groupRows(appRows));
      loadEditorFor(els.semesterSelect.value);
      updateSubjectTabs();
      render();

      if (!cloudLoaded || !cloudAvailable) {
        els.status.textContent = '공통 저장 테이블이 필요합니다. Supabase SQL Editor에서 depth_map_states 테이블을 만든 뒤 다시 열어 주세요.';
      }
    }

    async function switchSubject(nextSubject) {
      if (!subjects[nextSubject] || nextSubject === currentSubject || subjectSwitching) return;
      subjectSwitching = true;
      updateSubjectTabs();
      try {
        saveCurrentEditor();
        saveManualPositions();
        await syncCurrentSubjectToCloud();
        currentSubject = nextSubject;
        els.editPasswordInput.value = '';
        await loadSubjectData();
        updateEditLockUi();
      } finally {
        subjectSwitching = false;
        updateSubjectTabs();
      }
    }

    els.applyTreeBtn.addEventListener('click', () => {
      if (!requireEditUnlock('데이터 수정')) return;
      render();
    });
    els.addDepthBtn.addEventListener('click', () => {
      if (!requireEditUnlock('영역 수정')) return;
      saveCurrentEditor();
      addCommonDepth();
      renderDepthList();
      loadEditorFor(selectedGroupKey());
      render();
    });
    els.downloadBtn.addEventListener('click', downloadSvg);
    els.copySvgBtn.addEventListener('click', copySvg);
    els.copyShareLinkBtn.addEventListener('click', copyShareLink);
    els.downloadAllSvgBtn.addEventListener('click', downloadAllSvg);
    els.downloadAllPngBtn.addEventListener('click', downloadAllPng);
    els.sampleExcelBtn.addEventListener('click', downloadExcelSample);
    els.unlockEditBtn.addEventListener('click', unlockCurrentSubject);
    els.lockEditBtn.addEventListener('click', lockCurrentSubject);
    els.editPasswordInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        unlockCurrentSubject();
      }
    });
    els.subjectMathBtn.addEventListener('click', () => switchSubject('math'));
    els.subjectKoreanBtn.addEventListener('click', () => switchSubject('korean'));
    els.svg.addEventListener('pointerdown', startDrag);
    els.svg.addEventListener('pointermove', moveDrag);
    els.svg.addEventListener('pointerup', endDrag);
    els.svg.addEventListener('pointercancel', endDrag);
    els.svg.addEventListener('pointerleave', event => {
      if (dragState && event.buttons === 0) endDrag();
    });
    els.excelInput.addEventListener('change', async () => {
      if (!requireEditUnlock('엑셀 업로드')) {
        els.excelInput.value = '';
        return;
      }
      const file = els.excelInput.files?.[0];
      if (!file) return;
      try {
        saveCurrentEditor();
        await importExcelFile(file);
      } catch (error) {
        hideLoading();
        els.status.textContent = `파일을 읽지 못했습니다: ${error.message || error}`;
        showAlert(`파일을 읽지 못했습니다.\n${error.message || error}`);
      } finally {
        els.excelInput.value = '';
      }
    });
    els.svgInput.addEventListener('change', async () => {
      if (!requireEditUnlock('SVG 업로드')) {
        els.svgInput.value = '';
        return;
      }
      const files = [...(els.svgInput.files || [])];
      if (!files.length) return;
      try {
        await importSvgFiles(files);
      } catch (error) {
        els.status.textContent = `SVG 파일을 읽지 못했습니다: ${error.message || error}`;
      } finally {
        els.svgInput.value = '';
      }
    });
    els.semesterSelect.addEventListener('change', () => {
      const nextKey = els.semesterSelect.value;
      saveCurrentEditor();
      changingSemester = true;
      loadEditorFor(nextKey);
      changingSemester = false;
      render();
    });
    [els.panelWidth, els.panelHeight, els.columns, els.gap, els.compactMode]
      .forEach(control => control.addEventListener('change', render));
    els.alertOkBtn.addEventListener('click', hideAlert);
    els.alertOverlay.addEventListener('click', event => {
      if (event.target === els.alertOverlay) hideAlert();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && els.alertOverlay.classList.contains('show')) {
        hideAlert();
      }
    });

    loadSubjectData();
  </script>
</body>
</html>
