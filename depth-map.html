<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지식/개념맵 SVG 생성기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root {
      --ink: #111827;
      --muted: #6b7280;
      --line: #a3a3a3;
      --soft: #f3f4f6;
      --paper: #ffffff;
      --accent: #16a34a;
    }

    body {
      background: #f3f6f8;
      color: var(--ink);
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, .28);
      backdrop-filter: blur(2px);
    }

    .loading-overlay.show {
      display: flex;
    }

    .loading-dialog {
      width: min(21rem, calc(100vw - 2rem));
      padding: 1.2rem;
      border: 1px solid #dbeafe;
      border-radius: 1rem;
      background: #ffffff;
      box-shadow: 0 24px 60px rgba(15, 23, 42, .18);
      text-align: center;
    }

    .loading-spinner {
      width: 2.1rem;
      height: 2.1rem;
      margin: 0 auto .8rem;
      border: 4px solid #dbeafe;
      border-top-color: #16a34a;
      border-radius: 999px;
      animation: spin .8s linear infinite;
    }

    .loading-title {
      color: #0f172a;
      font-weight: 900;
    }

    .loading-desc {
      margin-top: .25rem;
      color: #64748b;
      font-size: .82rem;
    }

    .alert-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(15, 23, 42, .28);
      backdrop-filter: blur(2px);
    }

    .alert-overlay.show {
      display: flex;
    }

    .alert-dialog {
      width: min(30rem, calc(100vw - 2rem));
      border: 1px solid #dbe3ea;
      border-radius: 1rem;
      background: #ffffff;
      box-shadow: 0 24px 70px rgba(15, 23, 42, .22);
      overflow: hidden;
    }

    .alert-title {
      border-bottom: 1px solid #eef2f7;
      padding: 1rem 1.15rem;
      color: #0f172a;
      font-size: 1rem;
      font-weight: 900;
    }

    .alert-message {
      padding: 1.1rem 1.15rem;
      color: #334155;
      font-size: .92rem;
      line-height: 1.65;
      white-space: pre-line;
    }

    .alert-actions {
      display: flex;
      justify-content: flex-end;
      padding: 0 1.15rem 1.15rem;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .tool-shell {
      display: grid;
      grid-template-columns: minmax(30rem, 34rem) minmax(0, 1fr);
      height: calc(100vh - 2.625rem);
      min-height: 0;
      overflow: hidden;
    }

    .side-panel {
      border-right: 1px solid #e5e7eb;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      padding: 1.5rem !important;
      overflow-y: auto;
      height: calc(100vh - 2.625rem);
      min-height: 0;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      padding: .15rem .15rem 1rem;
      border-bottom: 1px solid #e5e7eb;
    }

    .panel-kicker {
      margin-bottom: .3rem;
      color: #16a34a;
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .panel-title {
      color: #0f172a;
      font-size: 1.45rem;
      font-weight: 900;
      line-height: 1.15;
    }

    .share-link-btn {
      flex: 0 0 auto;
    }

    .control-stack {
      margin-top: 1rem;
      display: grid;
      gap: .85rem;
    }

    .control-label {
      display: block;
      margin-bottom: .45rem;
      color: #374151;
      font-size: .78rem;
      font-weight: 800;
    }

    .field {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: .55rem;
      background: #fff;
      padding: .62rem .7rem;
      font-size: .82rem;
      line-height: 1.45;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .field:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, .14);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .38rem;
      height: 2.25rem;
      border-radius: .55rem;
      border: 1px solid #d1d5db;
      background: #fff;
      padding: 0 .8rem;
      color: #374151;
      font-size: .78rem;
      font-weight: 800;
      line-height: 1;
      transition: background-color .15s, border-color .15s, color .15s, box-shadow .15s;
      white-space: nowrap;
    }

    .btn:hover {
      background: #f9fafb;
      border-color: #9ca3af;
    }

    .btn-primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      box-shadow: 0 8px 18px rgba(22, 163, 74, .16);
    }

    .btn-primary:hover {
      border-color: #15803d;
      background: #15803d;
    }

    .btn-soft {
      border-color: #bbf7d0;
      background: #f0fdf4;
      color: #166534;
    }

    .btn-soft:hover {
      border-color: #86efac;
      background: #dcfce7;
    }

    .preview-wrap {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      height: calc(100vh - 2.625rem);
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      background:
        linear-gradient(#eef0f2 1px, transparent 1px),
        linear-gradient(90deg, #eef0f2 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .preview-top {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      background: rgba(255, 255, 255, .94);
      padding: .95rem 1.15rem;
      backdrop-filter: blur(8px);
    }

    .preview-top p {
      color: #16a34a;
      font-size: .72rem;
      font-weight: 900;
    }

    .preview-top h2 {
      margin-top: .15rem;
      color: #0f172a;
      font-size: 1rem;
      font-weight: 900;
    }

    .preview-chip {
      border: 1px solid #bbf7d0;
      border-radius: 999px;
      background: #f0fdf4;
      padding: .45rem .7rem;
      color: #166534;
      font-size: .72rem;
      font-weight: 900;
    }

    .preview-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(48rem, 56rem);
      align-items: stretch;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .board-frame {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-width: 0;
      overflow: auto;
      padding: 2rem;
    }

    #svgPreview {
      display: block;
      background: #fff;
      border: 1px solid #d1d5db;
      box-shadow: 0 16px 45px rgba(15, 23, 42, .08);
    }

    .data-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100%;
      overflow: hidden;
      min-width: 0;
      border-left: 1px solid #dbe3ea;
      background: #ffffff;
    }

    .data-panel-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid #e5e7eb;
      padding: 1rem 1.1rem;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    }

    .data-panel-head p {
      color: #16a34a;
      font-size: .88rem;
      font-weight: 900;
      letter-spacing: .02em;
    }

    .data-panel-head h3 {
      margin-top: .18rem;
      color: #0f172a;
      font-size: 1.28rem;
      font-weight: 900;
    }

    .data-count {
      flex: 0 0 auto;
      border-radius: 999px;
      background: #f0fdf4;
      padding: .48rem .78rem;
      color: #166534;
      font-size: .95rem;
      font-weight: 900;
    }

    .data-table-wrap {
      overflow: auto;
      min-height: 0;
    }

    .data-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 0;
      color: #0f172a;
      font-size: 1.08rem;
    }

    .data-table th,
    .data-table td {
      border-bottom: 1px solid #edf2f7;
      padding: 1rem 1.05rem;
      text-align: left;
      vertical-align: top;
    }

    .data-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #16a34a;
      color: #ffffff;
      font-size: .92rem;
      font-weight: 900;
    }

    .concept-cell {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      min-width: 0;
    }

    .table-copy-btn {
      flex: 0 0 auto;
      border: 1px solid #bbf7d0;
      border-radius: 999px;
      background: #f0fdf4;
      padding: .28rem .58rem;
      color: #166534;
      font-size: .76rem;
      font-weight: 900;
      line-height: 1;
    }

    .table-copy-btn:hover {
      background: #dcfce7;
    }

    .data-table tr.area-tone-a td {
      background: #f8fafc;
    }

    .data-table tr.area-tone-b td {
      background: #ffffff;
    }

    .data-table td:first-child,
    .data-table th:first-child {
      width: 12rem;
    }

    .data-table td:nth-child(2),
    .data-table th:nth-child(2) {
      white-space: nowrap;
    }

    .data-table td:nth-child(2) {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .data-empty {
      padding: 2rem;
      color: #64748b;
      font-size: .82rem;
      text-align: center;
    }

    .hint {
      color: #6b7280;
      font-size: .73rem;
      line-height: 1.55;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      height: 1.6rem;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      padding: 0 .6rem;
      background: #f9fafb;
      color: #4b5563;
      font-size: .72rem;
      font-weight: 700;
    }

    .tree-editor {
      max-height: 30rem;
      overflow: auto;
      border: 1px solid #dbe3ea;
      border-radius: .85rem;
      background: #fff;
      padding: .85rem;
    }

    .tree-depth {
      border: 1px solid #e5e7eb;
      border-radius: .6rem;
      background: #fbfbfc;
      padding: .65rem;
    }

    .tree-depth + .tree-depth {
      margin-top: .65rem;
    }

    .tree-depth-head,
    .tree-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: .45rem;
      align-items: center;
    }

    .tree-row {
      grid-template-columns: 1rem minmax(0, 1fr) auto;
      margin-top: .45rem;
    }

    .tree-branch {
      color: #9ca3af;
      font-size: .9rem;
      text-align: center;
      user-select: none;
    }

    .tree-input {
      min-width: 0;
      height: 2rem;
      border: 1px solid #d1d5db;
      border-radius: .45rem;
      background: #fff;
      padding: 0 .55rem;
      font-size: .76rem;
      font-weight: 700;
      outline: none;
    }

    .tree-input:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, .12);
    }

    .tree-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border: 1px solid #d1d5db;
      border-radius: .45rem;
      background: #fff;
      color: #4b5563;
      font-size: .9rem;
      font-weight: 900;
    }

    .tree-action:hover {
      background: #f3f4f6;
      color: #111827;
    }

    .tree-action.danger {
      color: #dc2626;
    }

    .tree-toolbar {
      display: flex;
      gap: .45rem;
      margin-top: .55rem;
    }

    .depth-list {
      display: grid;
      gap: .45rem;
      border: 1px solid #dbe3ea;
      border-radius: .85rem;
      background: #fff;
      padding: .85rem;
    }

    .depth-list-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: .45rem;
      align-items: center;
    }

    .tree-depth-title {
      display: flex;
      align-items: center;
      min-height: 2rem;
      border: 1px solid #d1d5db;
      border-radius: .45rem;
      background: #fff;
      padding: 0 .55rem;
      color: #111827;
      font-size: .76rem;
      font-weight: 900;
    }

    .settings-box {
      border: 1px solid #dbe3ea;
      border-radius: 1rem;
      background: #fff;
      padding: .9rem;
      box-shadow: 0 8px 22px rgba(15, 23, 42, .035);
    }

    .settings-box.action-save {
      border-color: #bbf7d0;
      background: linear-gradient(180deg, #f7fef9 0%, #ffffff 100%);
    }

    .settings-box.action-upload {
      border-color: #bfdbfe;
      background: linear-gradient(180deg, #f7fbff 0%, #ffffff 100%);
    }

    .settings-box.subject-card {
      border-color: #dcfce7;
      background: linear-gradient(180deg, #f8fff9 0%, #ffffff 100%);
    }

    .settings-box.work-card {
      background: #ffffff;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .65rem;
      color: #0f172a;
      font-size: .8rem;
      font-weight: 900;
    }

    .section-title::after {
      content: '';
      width: .45rem;
      height: .45rem;
      border-radius: 999px;
      background: #16a34a;
      opacity: .65;
    }

    .action-upload .section-title::after {
      background: #2563eb;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .55rem;
    }

    .upload-btn {
      min-height: 2.45rem;
    }

    .upload-helper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .65rem;
      margin-top: .5rem;
      padding: .55rem .65rem;
      border: 1px solid #e2e8f0;
      border-radius: .7rem;
      background: #f8fafc;
      color: #64748b;
      font-size: .74rem;
      line-height: 1.45;
    }

    .text-link {
      flex: 0 0 auto;
      padding: .2rem .45rem;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
    }

    .text-link:hover {
      border-color: #93c5fd;
      background: #dbeafe;
    }

    @media (max-width: 460px) {
      .upload-helper {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    .hidden-file {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .compact-grid {
      display: grid;
      gap: .8rem;
    }

    .settings-box summary {
      cursor: pointer;
      color: #374151;
      font-size: .8rem;
      font-weight: 900;
      user-select: none;
    }

    .settings-box summary.section-title {
      margin-bottom: 0;
      list-style: none;
    }

    .settings-box summary.section-title::-webkit-details-marker {
      display: none;
    }

    .settings-box[open] > summary.section-title {
      margin-bottom: .65rem;
    }

    .subject-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .5rem;
    }

    .subject-tab {
      border: 1px solid #d1d5db;
      border-radius: .75rem;
      background: #fff;
      padding: .82rem .8rem;
      color: #374151;
      font-size: .86rem;
      font-weight: 900;
      text-align: center;
      box-shadow: 0 4px 12px rgba(15, 23, 42, .035);
    }

    .subject-tab.active {
      border-color: #16a34a;
      background: #16a34a;
      color: #fff;
      box-shadow: 0 10px 22px rgba(22, 163, 74, .2);
    }

    .lock-card {
      border-color: #fde68a;
      background: linear-gradient(180deg, #fffbeb 0%, #ffffff 100%);
    }

    .lock-row {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: .55rem;
    }

    .lock-status {
      color: #92400e;
      font-size: .78rem;
      font-weight: 800;
      line-height: 1.45;
    }

    .lock-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: .45rem;
    }

    .lock-password {
      width: 100%;
      min-width: 0;
      height: 2rem;
      border: 1px solid #d1d5db;
      border-radius: .55rem;
      padding: 0 .6rem;
      background: #ffffff;
      color: #111827;
      font-size: .8rem;
      font-weight: 800;
    }

    .lock-password:focus {
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, .12);
      outline: none;
    }

    .btn-compact {
      min-height: 2rem;
      padding: .35rem .65rem;
      font-size: .76rem;
    }

    .edit-locked .tree-input,
    .edit-locked .tree-action,
    .edit-locked #addDepthBtn,
    .edit-locked #applyTreeBtn {
      opacity: .55;
      pointer-events: none;
    }

    .edit-locked .upload-btn {
      opacity: .55;
      cursor: not-allowed;
    }

    @media (max-width: 430px) {
      .lock-actions {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 980px) {
      .tool-shell {
        grid-template-columns: 1fr;
      }

      .side-panel {
        border-right: 0;
        border-bottom: 1px solid #e5e7eb;
      }

      .preview-body {
        grid-template-columns: 1fr;
        overflow: auto;
      }

      .data-panel {
        min-height: 24rem;
        border-top: 1px solid #dbe3ea;
        border-left: 0;
      }
    }
  </style>
</head>
<body>
  <header class="app-brand-bar">
    <div class="app-brand-lockup"><span class="app-brand-mark" aria-hidden="true"></span><span>지식/개념맵 SVG 생성기</span></div>
  </header>

  <main class="tool-shell">
    <aside class="side-panel p-4 lg:p-5">
      <div class="panel-header">
        <h1 class="panel-title">지식/개념맵 설정</h1>
        <button id="copyShareLinkBtn" type="button" class="btn btn-soft btn-compact share-link-btn">링크 공유</button>
      </div>

      <section class="control-stack">
        <div class="settings-box subject-card">
          <span class="section-title">과목 선택</span>
          <div class="subject-tabs" role="tablist" aria-label="과목 선택">
            <button id="subjectMathBtn" type="button" class="subject-tab active" data-subject="math" role="tab" aria-selected="true">수학</button>
            <button id="subjectKoreanBtn" type="button" class="subject-tab" data-subject="korean" role="tab" aria-selected="false">국어</button>
          </div>
        </div>

        <div class="settings-box work-card">
          <label for="semesterSelect" class="control-label">학년/학기 선택</label>
          <select id="semesterSelect" class="field"></select>
        </div>

        <div class="settings-box action-upload">
          <span class="section-title">데이터 파일 업로드</span>
          <div class="action-grid">
            <label class="btn btn-soft upload-btn cursor-pointer">
              엑셀 업로드
              <input id="excelInput" type="file" class="hidden-file" accept=".xlsx" />
            </label>
            <label class="btn upload-btn cursor-pointer">
              SVG 업로드
              <input id="svgInput" type="file" class="hidden-file" accept=".svg,image/svg+xml" multiple />
            </label>
          </div>
          <p class="upload-helper">
            <span>엑셀 형식이 필요할 때 사용하세요.</span>
            <button id="sampleExcelBtn" type="button" class="text-link">샘플 다운로드</button>
          </p>
        </div>

        <details class="settings-box work-card">
          <summary class="section-title">영역 관리</summary>
          <div id="depthList" class="depth-list" aria-label="공통 1Depth 목록"></div>
          <div class="tree-toolbar">
            <button id="addDepthBtn" type="button" class="btn">1Depth 추가</button>
          </div>
        </details>

        <details class="settings-box work-card">
          <summary id="dataInputLabel" class="section-title">학년/학기 데이터 관리</summary>
          <div id="treeEditor" class="tree-editor" aria-label="Depth 트리 편집기"></div>
          <div class="tree-toolbar">
            <button id="applyTreeBtn" type="button" class="btn btn-primary">미리보기 갱신</button>
          </div>
        </details>

        <div class="settings-box action-save">
          <span class="section-title">파일 저장</span>
          <div class="action-grid">
            <button id="downloadBtn" type="button" class="btn">SVG 저장</button>
            <button id="copySvgBtn" type="button" class="btn">SVG 복사</button>

      math: '610503',
      korean: '12345'
    };
    const subjects = {
      math: {
        label: '수학',
        sample: sampleData
      },
      korean: {
        label: '국어',
        sample: 'grad_cd\tsmst_cd\t영역명\tconcept_nm'
      }
    };

    function subjectFromUrl() {
      const decodedHref = decodeURIComponent(window.location.href);
      const hashText = decodeURIComponent(window.location.hash.replace(/^#\/?/, ''));
      const hashValue = new URLSearchParams(hashText.startsWith('?') ? hashText.slice(1) : hashText).get('subject');
      if (subjects[hashValue]) return hashValue;
      const searchValue = new URLSearchParams(window.location.search).get('subject');
      if (subjects[searchValue]) return searchValue;
      const embeddedMatch = decodedHref.match(/[?&#]subject=(math|korean)\b/);
      return embeddedMatch && subjects[embeddedMatch[1]] ? embeddedMatch[1] : 'math';
    }

    let currentSubject = subjectFromUrl();
    let appRows = [];
    let commonDepths = [];
    let currentEditKey = '';
    let changingSemester = false;
    let manualPositions = {};
    let dragState = null;
    let dataSource = 'sample';
    let cloudSaveTimer = null;
    let cloudLoaded = false;
    let suppressCloudSave = false;
    let cloudAvailable = true;
    let subjectSwitching = false;
    const unlockedSubjects = new Set();
    function subjectConfig(subjectKey = currentSubject) {
      return subjects[subjectKey];
    }

    function isEditUnlocked(subjectKey = currentSubject) {
      return unlockedSubjects.has(subjectKey);
    }

    function requireEditUnlock(actionName = '수정') {
      if (isEditUnlocked()) return true;
      showAlert(`${subjectConfig().label} ${actionName}은 잠금 해제 후 가능합니다.`);
      return false;
    }

    function normalizePassword(value) {
      return String(value || '')
        .replace(/[０-９]/g, digit => String.fromCharCode(digit.charCodeAt(0) - 0xFEE0))
        .replace(/\D/g, '');
    }

    function showAlert(message, title = '알림') {
      els.alertTitle.textContent = title;
      els.alertMessage.textContent = message;
      els.alertOverlay.classList.add('show');
      els.alertOverlay.setAttribute('aria-hidden', 'false');
      els.alertOkBtn.focus();
    }

    function hideAlert() {
      els.alertOverlay.classList.remove('show');
      els.alertOverlay.setAttribute('aria-hidden', 'true');
    }

    function updateEditLockUi() {
      const unlocked = isEditUnlocked();
      document.body.classList.toggle('edit-locked', !unlocked);
      els.editLockStatus.textContent = unlocked
        ? `${subjectConfig().label} 편집이 열려 있습니다.`
        : `${subjectConfig().label} 편집이 잠겨 있습니다.`;
      els.unlockEditBtn.disabled = unlocked;
      els.lockEditBtn.disabled = !unlocked;
      els.editPasswordInput.disabled = unlocked;
      els.editPasswordInput.placeholder = `${subjectConfig().label} 비밀번호`;
      [els.excelInput, els.svgInput, els.addDepthBtn, els.applyTreeBtn].forEach(control => {
        control.disabled = !unlocked;
      });
      els.treeEditor.querySelectorAll('input, button').forEach(control => {
        control.disabled = !unlocked;
      });
      els.depthList.querySelectorAll('input, button').forEach(control => {
        control.disabled = !unlocked;
      });
    }

    function unlockCurrentSubject() {
      const password = normalizePassword(els.editPasswordInput.value);
      if (password !== editPasswords[currentSubject]) {
        showAlert(`${subjectConfig().label} 비밀번호가 맞지 않습니다.\n입력값: ${password || '(비어 있음)'}`);
        els.editPasswordInput.select();
        els.editPasswordInput.focus();
        return;
      }
      unlockedSubjects.add(currentSubject);
      els.editPasswordInput.value = '';
      updateEditLockUi();
      showAlert(`${subjectConfig().label} 편집 잠금을 해제했습니다.`);
    }

    function lockCurrentSubject() {
      unlockedSubjects.delete(currentSubject);
      els.editPasswordInput.value = '';
      updateEditLockUi();
    }

    function showLoading(title, desc = '잠시만 기다려 주세요.') {
      els.loadingTitle.textContent = title;
      els.loadingDesc.textContent = desc;
      els.loadingOverlay.classList.add('show');
      els.loadingOverlay.setAttribute('aria-hidden', 'false');
    }

    function hideLoading() {
      els.loadingOverlay.classList.remove('show');
      els.loadingOverlay.setAttribute('aria-hidden', 'true');
    }

    function withTimeout(promise, timeoutMs, message) {
      let timeoutId;
      const timeout = new Promise((_, reject) => {
        timeoutId = setTimeout(() => reject(new Error(message)), timeoutMs);
      });
      return Promise.race([promise, timeout]).finally(() => clearTimeout(timeoutId));
    }

    function cloudHeaders(extra = {}) {
      return {
        apikey: DEPTH_SUPABASE_KEY,
        Authorization: `Bearer ${DEPTH_SUPABASE_KEY}`,
        ...extra
      };
    }

    function loadManualPositions() {
      return loadManualPositionsFor(currentSubject);
    }

    function loadManualPositionsFor(subjectKey) {
      return subjectKey === currentSubject ? manualPositions : {};
    }

    function saveManualPositions() {
      saveManualPositionsFor(currentSubject, manualPositions);
    }

    function saveManualPositionsFor(subjectKey, positions) {
      if (subjectKey === currentSubject) {
        manualPositions = positions;
        scheduleCloudSave();
      } else {
        syncSubjectPositionsToCloud(subjectKey, positions);
      }
    }

    function positionKey(groupKey, kind, topic, label = '') {
      return `${groupKey}::${kind}::${topic}${label ? `::${label}` : ''}`;
    }

    function savedPosition(groupKey, nodeKey) {
      return manualPositions[groupKey]?.[nodeKey] || null;
    }

    function setSavedPosition(groupKey, nodeKey, x, y) {
      if (!manualPositions[groupKey]) manualPositions[groupKey] = {};
      manualPositions[groupKey][nodeKey] = { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 };
      saveManualPositions();
    }

    function rememberRenderedPosition(groupKey, nodeKey, x, y) {
      if (!groupKey || !nodeKey) return false;
      const point = { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 };
      if (!manualPositions[groupKey]) manualPositions[groupKey] = {};
      const previous = manualPositions[groupKey][nodeKey];
      if (previous && previous.x === point.x && previous.y === point.y) return false;
      manualPositions[groupKey][nodeKey] = point;
      return true;
    }

    function validPositionKeysForRows(rows) {
      const keysByGroup = new Map();
      rows.forEach(row => {
        const groupKey = `${row.grade}-${row.semester}`;
        if (!keysByGroup.has(groupKey)) keysByGroup.set(groupKey, new Set());
        const keys = keysByGroup.get(groupKey);
        keys.add(positionKey(groupKey, 'topic', row.depth1));
        if (row.depth2) keys.add(positionKey(groupKey, 'child', row.depth1, row.depth2));
      });
      return keysByGroup;
    }

    function pruneStalePositionsForRows(rows) {
      const validKeys = validPositionKeysForRows(rows);
      const nextPositions = {};
      let removedCount = 0;
      Object.entries(manualPositions || {}).forEach(([groupKey, groupPositions]) => {
        const allowed = validKeys.get(groupKey);
        if (!allowed) {
          removedCount += Object.keys(groupPositions || {}).length;
          return;
        }
        Object.entries(groupPositions || {}).forEach(([nodeKey, point]) => {
          if (allowed.has(nodeKey)) {
            if (!nextPositions[groupKey]) nextPositions[groupKey] = {};
            nextPositions[groupKey][nodeKey] = point;
          } else {
            removedCount += 1;
          }
        });
      });
      manualPositions = nextPositions;
      return removedCount;
    }

    function normalizeGradeTerm(value) {
      const text = String(value ?? '').trim();
      const match = text.match(/\d+/);
      return match ? match[0] : text;
    }

    function persistAppData(source = dataSource) {
      dataSource = source;
      scheduleCloudSave();
    }

    function defaultRowsForSubject(subjectKey = currentSubject) {
      return parseRows(subjectConfig(subjectKey).sample || '');
    }

    function defaultStateForSubject(subjectKey = currentSubject) {
      const rows = defaultRowsForSubject(subjectKey);
      const preferredOrder = ['수와 연산', '측정', '도형', '자료와 가능성', '규칙성'];
      const seen = new Set(rows.map(row => row.depth1).filter(Boolean));
      const common = preferredOrder.filter(depth => seen.has(depth))
        .concat([...seen].filter(depth => !preferredOrder.includes(depth)));
      return {
        rows,
        common_depths: common,
        positions: {},
        source: 'sample'
      };
    }

    function cloudStatePayload(subjectKey = currentSubject, state = {}) {
      return {
        subject_key: subjectKey,
        rows: state.rows || appRows,
        common_depths: state.common_depths || state.commonDepths || commonDepths,
        positions: state.positions || manualPositions,
        source: state.source || dataSource,
        updated_at: new Date().toISOString()
      };
    }

    function applyCloudState(data) {
      if (!data) return false;
      suppressCloudSave = true;
      try {
        appRows = Array.isArray(data.rows)
          ? data.rows.map(row => ({
              grade: normalizeGradeTerm(row.grade),
              semester: normalizeGradeTerm(row.semester),
              depth1: String(row.depth1 || ''),
              depth2: String(row.depth2 || ''),
              depth3: String(row.depth3 || '')
            })).filter(row => row.grade && row.semester && row.depth1)
          : [];
        commonDepths = Array.isArray(data.common_depths)
          ? data.common_depths.map(String).filter(Boolean)
          : [];
        if (!commonDepths.length) syncCommonDepthsFromRows(appRows);
        manualPositions = data.positions && typeof data.positions === 'object' ? data.positions : {};
        dataSource = data.source || 'shared';
      } finally {
        suppressCloudSave = false;
      }
      return true;
    }

    async function loadCloudSubjectStateViaRest(subjectKey = currentSubject) {
      const url = `${CLOUD_REST_URL}?select=rows,common_depths,positions,source,updated_at&subject_key=eq.${encodeURIComponent(subjectKey)}&limit=1`;
      const response = await withTimeout(
        fetch(url, { headers: cloudHeaders() }),
        20000,
        '공통 저장소 조회 응답 시간이 초과되었습니다.'
      );
      if (!response.ok) throw new Error(await response.text());
      const rows = await response.json();
      return rows[0] || null;
    }

    async function loadCloudSubjectState() {
      if (!cloudAvailable) return false;
      try {
        let data = null;
        if (depthSupabase) {
          const result = await depthSupabase
            .from(CLOUD_TABLE)
            .select('rows, common_depths, positions, source, updated_at')
            .eq('subject_key', currentSubject)
            .maybeSingle();
          if (result.error) throw result.error;
          data = result.data;
        } else {
          data = await loadCloudSubjectStateViaRest();
        }
        return applyCloudState(data);
      } catch (firstError) {
        try {
          const data = await loadCloudSubjectStateViaRest();
          return applyCloudState(data);
        } catch (error) {
          cloudAvailable = false;
          console.warn('Depth map cloud load failed:', firstError, error);
          els.status.textContent = '공통 저장 테이블을 불러오지 못했습니다. Supabase SQL Editor에서 depth_map_states 테이블을 먼저 만들어 주세요.';
          return false;
        }
      }
    }

    async function createDefaultCloudState() {
      if (!cloudAvailable) return false;
      const fallback = defaultStateForSubject(currentSubject);
      appRows = fallback.rows;
      commonDepths = fallback.common_depths;
      manualPositions = fallback.positions;
      dataSource = fallback.source;
      cloudLoaded = true;
      await syncCurrentSubjectToCloud();
      return true;
    }

    function scheduleCloudSave() {
      if (suppressCloudSave || !cloudLoaded || !cloudAvailable) return;
      clearTimeout(cloudSaveTimer);
      cloudSaveTimer = setTimeout(syncCurrentSubjectToCloud, 500);
    }

    async function syncCurrentSubjectToCloudViaRest(payload = cloudStatePayload()) {
      const response = await withTimeout(
        fetch(`${CLOUD_REST_URL}?on_conflict=subject_key`, {
          method: 'POST',
          headers: cloudHeaders({
            'Content-Type': 'application/json',
            Prefer: 'resolution=merge-duplicates,return=minimal'
          }),
          body: JSON.stringify([payload])
        }),
        30000,
        '공통 저장소 저장 응답 시간이 초과되었습니다.'
      );
      if (!response.ok) throw new Error(await response.text());
      return true;
    }

    async function syncCurrentSubjectToCloud() {
      clearTimeout(cloudSaveTimer);
      cloudSaveTimer = null;
      try {
        const payload = cloudStatePayload();
        if (depthSupabase) {
          const { error } = await withTimeout(
            depthSupabase
              .from(CLOUD_TABLE)
              .upsert(payload, { onConflict: 'subject_key' }),
            30000,
            '공통 저장소 응답 시간이 초과되었습니다.'
          );
          if (error) throw error;
        } else {
          await syncCurrentSubjectToCloudViaRest(payload);
        }
        cloudAvailable = true;
        els.status.textContent = '공통 저장소에 저장했습니다.';
        return true;
      } catch (firstError) {
        try {
          await syncCurrentSubjectToCloudViaRest();
          cloudAvailable = true;
          els.status.textContent = '공통 저장소에 저장했습니다.';
          return true;
        } catch (error) {
          cloudAvailable = false;
          console.warn('Depth map cloud save failed:', firstError, error);
          els.status.textContent = `공통 저장소에 저장하지 못했습니다. ${error.message || firstError.message || 'Supabase 연결을 확인해 주세요.'}`;
          return false;
        }
      }
    }

    async function loadCloudStateForSubject(subjectKey) {
      if (!cloudAvailable) return null;
      if (!depthSupabase) return loadCloudSubjectStateViaRest(subjectKey);
      try {
        const { data, error } = await depthSupabase
          .from(CLOUD_TABLE)
          .select('rows, common_depths, positions, source, updated_at')
          .eq('subject_key', subjectKey)
          .maybeSingle();
        if (error) throw error;
        return data;
      } catch (error) {
        return loadCloudSubjectStateViaRest(subjectKey);
      }
    }

    async function syncSubjectPositionsToCloud(subjectKey, positions) {
      if (suppressCloudSave || !cloudLoaded || !cloudAvailable) return;
      try {
        const existing = await loadCloudStateForSubject(subjectKey);
        const base = existing || defaultStateForSubject(subjectKey);
        const mergedPositions = { ...(base.positions || {}), ...(positions || {}) };
        const payload = cloudStatePayload(subjectKey, {
          rows: Array.isArray(base.rows) ? base.rows : defaultStateForSubject(subjectKey).rows,
          common_depths: Array.isArray(base.common_depths) ? base.common_depths : defaultStateForSubject(subjectKey).common_depths,
          positions: mergedPositions,
          source: base.source || 'shared'
        });
        if (depthSupabase) {
          const { error } = await depthSupabase
            .from(CLOUD_TABLE)
            .upsert(payload, { onConflict: 'subject_key' });
          if (error) throw error;
        } else {
          await syncCurrentSubjectToCloudViaRest(payload);
        }
      } catch (error) {
        cloudAvailable = false;
        console.warn('Depth map position cloud save failed:', error);
      }
    }

    function createSvgElement(tag, attrs = {}, text = '') {
      const node = document.createElementNS(NS, tag);
      Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, String(value)));
      if (text) node.textContent = text;
      return node;
    }

    function splitLine(line) {
      const delimiter = line.includes('\t') ? '\t' : line.includes(';') ? ';' : ',';
      const cells = [];
      let current = '';
      let quoted = false;
      for (let index = 0; index < line.length; index += 1) {
        const char = line[index];
        if (char === '"') {
          quoted = !quoted;
        } else if (char === delimiter && !quoted) {
          cells.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      cells.push(current.trim());
      return cells;
    }

    function normalizeHeader(value) {
      return String(value ?? '').toLowerCase().replace(/\s/g, '').replace(/_/g, '');
    }

    function rowsFromCellRows(cellRows) {
      const rows = cellRows
        .map(row => row.map(cell => String(cell ?? '').trim()))
        .filter(row => row.some(Boolean));
      if (!rows.length) return [];

      const first = rows[0];
      const headerKeys = first.map(normalizeHeader);
      const hasHeader = headerKeys.some(key => ['학년', 'grade', 'gradcd'].includes(key))
        || headerKeys.some(key => ['학기', 'semester', 'term', 'smstcd'].includes(key))
        || headerKeys.some(key => ['영역명', 'conceptnm'].includes(key) || key.includes('depth'));

      const indexOf = (...names) => headerKeys.findIndex(key => names.includes(key));
      const indexes = hasHeader ? {
        grade: indexOf('학년', 'grade', 'gradcd'),
        semester: indexOf('학기', 'semester', 'term', 'smstcd'),
        depth1: indexOf('영역명', '1depth', 'depth1', '1뎁스', '대분류'),
        depth2: indexOf('conceptnm', '2depth', 'depth2', '2뎁스', '중분류'),
        depth3: indexOf('3depth', 'depth3', '3뎁스', '소분류')
      } : { grade: 0, semester: 1, depth1: 2, depth2: 3, depth3: 4 };

      if ([indexes.grade, indexes.semester, indexes.depth1, indexes.depth2].some(index => index < 0)) {
        return [];
      }

      return rows.slice(hasHeader ? 1 : 0)
        .map(cells => ({
          grade: normalizeGradeTerm(cells[indexes.grade]),
          semester: normalizeGradeTerm(cells[indexes.semester]),
          depth1: cells[indexes.depth1] || '',
          depth2: cells[indexes.depth2] || '',
          depth3: cells[indexes.depth3] || ''
        }))
        .filter(row => row.grade && row.semester && row.depth1);
    }

    function parseRows(raw) {
      const lines = raw.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
      return rowsFromCellRows(lines.map(splitLine));
    }

    function normalizeCell(value) {
      return String(value ?? '').trim();
    }

    function rowsFromSheetObjects(records) {
      if (!records.length) return [];
      const keys = Object.keys(records[0]);
      const keyMap = new Map(keys.map(key => [normalizeHeader(key), key]));
      const findKey = (...names) => {
        for (const name of names) {
          if (keyMap.has(name)) return keyMap.get(name);
        }
        return '';
      };
      const gradeKey = findKey('학년', 'grade', 'gradcd');
      const semesterKey = findKey('학기', 'semester', 'term', 'smstcd');
      const depth1Key = findKey('영역명', '1depth', 'depth1', '1뎁스', '대분류');
      const depth2Key = findKey('conceptnm', '2depth', 'depth2', '2뎁스', '중분류');

      return records.map(record => ({
        grade: normalizeGradeTerm(record[gradeKey]),
        semester: normalizeGradeTerm(record[semesterKey]),
        depth1: normalizeCell(record[depth1Key]),
        depth2: normalizeCell(record[depth2Key]),
        depth3: ''
      })).filter(row => row.grade && row.semester && row.depth1 && row.depth2);
    }

    function excelSampleRows() {
      const rows = defaultRowsForSubject(currentSubject);
      if (rows.length) return rows;
      return [
        { grade: '1', semester: '1', depth1: '', depth2: '', depth3: '' },
        { grade: '1', semester: '2', depth1: '', depth2: '', depth3: '' },
        { grade: '2', semester: '1', depth1: '', depth2: '', depth3: '' },
        { grade: '2', semester: '2', depth1: '', depth2: '', depth3: '' }
      ];
    }

    function downloadExcelSample() {
      const headers = ['grad_cd', 'smst_cd', '영역명', 'concept_nm'];
      const body = excelSampleRows().map(row => [row.grade, row.semester, row.depth1, row.depth2]);
      const filename = `${subjectConfig().label}_Depth맵_엑셀샘플.xlsx`;

      if (!window.XLSX) {
        els.status.textContent = '엑셀 파일 생성 라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.';
        return;
      }

      const worksheet = XLSX.utils.aoa_to_sheet([headers, ...body]);
      worksheet['!cols'] = [{ wch: 8 }, { wch: 8 }, { wch: 18 }, { wch: 34 }];
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Depth Map');
      XLSX.writeFile(workbook, filename);
      els.status.textContent = `${subjectConfig().label} 엑셀 샘플 파일을 다운로드했습니다.`;
    }

    async function applyImportedRows(rows) {
      if (!rows.length) {
        hideLoading();
        els.status.textContent = '가져올 데이터가 없습니다. 열 이름은 grad_cd, smst_cd, 영역명, concept_nm으로 맞춰 주세요.';
        showAlert('가져올 데이터가 없습니다.\n열 이름은 grad_cd, smst_cd, 영역명, concept_nm으로 맞춰 주세요.');
        return;
      }

      showLoading('엑셀 데이터를 저장하는 중입니다', `${rows.length}개 2Depth 항목을 공통 저장소에 반영하고 있습니다.`);
      appRows = rows;
      const removedPositionCount = pruneStalePositionsForRows(appRows);
      syncCommonDepthsFromRows(appRows);
      persistAppData('imported');
      currentEditKey = '';
      syncSemesterSelect(groupRows(appRows));
      loadEditorFor(els.semesterSelect.value);
      render();
      els.status.textContent = `${rows.length}개 2Depth 항목을 가져왔습니다. 공통 저장소에 저장하는 중입니다.`;
      const saved = await syncCurrentSubjectToCloud();
      hideLoading();
      if (saved) {
        els.status.textContent = `${rows.length}개 2Depth 항목을 가져왔습니다. 새로고침 후에도 이 데이터가 유지됩니다.`;
        const cleanupMessage = removedPositionCount
          ? `\n현재 데이터에 없는 위치값 ${removedPositionCount}개를 삭제했습니다.`
          : '';
        showAlert(`${rows.length}개 2Depth 항목을 저장했습니다.${cleanupMessage}`);
      } else {
        els.status.textContent = `${rows.length}개 2Depth 항목을 가져왔지만 공통 저장소 저장에 실패했습니다. Supabase 연결을 확인해 주세요.`;
        showAlert('공통 저장소 저장에 실패했습니다. Supabase 연결을 확인해 주세요.');
      }
    }

    async function importExcelFile(file) {
      showLoading('엑셀 파일을 읽는 중입니다', `${file.name} 파일을 분석하고 있습니다.`);
      els.status.textContent = `${file.name} 파일을 읽는 중입니다.`;
      const extension = file.name.split('.').pop().toLowerCase();
      if (extension !== 'xlsx') {
        hideLoading();
        els.status.textContent = '엑셀 파일(.xlsx)만 업로드할 수 있습니다.';
        showAlert('엑셀 파일(.xlsx)만 업로드할 수 있습니다.');
        return;
      }

      if (!window.XLSX) {
        hideLoading();
        els.status.textContent = '엑셀 읽기 라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.';
        showAlert('엑셀 읽기 라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.');
        return;
      }

      const buffer = await file.arrayBuffer();
      const workbook = XLSX.read(buffer, { type: 'array' });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      const cellRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
      await applyImportedRows(rowsFromCellRows(cellRows));
    }

    function subjectKeyFromLabel(label) {
      return Object.entries(subjects).find(([, config]) => config.label === label)?.[0] || '';
    }

    function parseSvgUploadName(filename) {
      const base = filename.replace(/\.[^.]+$/, '');
      const match = base.match(/^(수학|국어)_(\d+)\s*학년\s*(\d+)\s*학기$/i);
      if (!match) return null;
      const subjectKey = subjectKeyFromLabel(match[1]);
      if (!subjectKey) return null;
      return {
        subjectKey,
        groupKey: `${Number(match[2])}-${Number(match[3])}`
      };
    }

    function translateFromTransform(transform) {
      const match = String(transform || '').match(/translate\(\s*([-.\d]+)[,\s]+([-.\d]+)\s*\)/);
      if (!match) return null;
      return { x: Number(match[1]), y: Number(match[2]) };
    }

    async function positionsForSvgImport(subjectKey) {
      if (subjectKey === currentSubject) return structuredClone(manualPositions || {});
      try {
        const existing = await loadCloudStateForSubject(subjectKey);
        return existing?.positions && typeof existing.positions === 'object' ? existing.positions : {};
      } catch (error) {
        cloudAvailable = false;
        throw new Error('공통 저장 테이블에서 기존 SVG 위치를 불러오지 못했습니다.');
      }
    }

    async function importSvgPositions(svgTextContent, filename) {
      const nameInfo = parseSvgUploadName(filename);
      if (!nameInfo) {
        throw new Error(`${filename} 파일명은 "수학_1학년1학기.svg" 형식이어야 합니다.`);
      }

      const documentSvg = new DOMParser().parseFromString(svgTextContent, 'image/svg+xml');
      if (documentSvg.querySelector('parsererror')) {
        throw new Error(`${filename} SVG 파일을 읽지 못했습니다.`);
      }

      const positions = await positionsForSvgImport(nameInfo.subjectKey);
      let changed = 0;
      documentSvg.querySelectorAll('[data-node-key]').forEach(node => {
        const rawNodeKey = node.getAttribute('data-node-key');
        const nodeKey = rawNodeKey ? rawNodeKey.replace(/^\d+-\d+::/, `${nameInfo.groupKey}::`) : '';
        const panelKey = nameInfo.groupKey;
        const point = translateFromTransform(node.getAttribute('transform'));
        if (!nodeKey || !panelKey || !point) return;
        if (!positions[panelKey]) positions[panelKey] = {};
        positions[panelKey][nodeKey] = {
          x: Math.round(point.x * 10) / 10,
          y: Math.round(point.y * 10) / 10
        };
        changed += 1;
      });

      if (!changed) {
        throw new Error(`${filename}에서 저장할 원 위치를 찾지 못했습니다.`);
      }
      saveManualPositionsFor(nameInfo.subjectKey, positions);
      return { ...nameInfo, changed };
    }

    async function importSvgFiles(files) {
      const results = [];
      for (const file of files) {
        results.push(await importSvgPositions(await file.text(), file.name));
      }
      if (results.some(result => result.subjectKey === currentSubject)) {
        manualPositions = loadManualPositions();
        render();
      }
      const subjectNames = [...new Set(results.map(result => subjectConfig(result.subjectKey).label))].join(', ');
      els.status.textContent = `${results.length}개 SVG 파일의 원 위치를 ${subjectNames} 데이터에 반영했습니다.`;
    }

    function syncCommonDepthsFromRows(rows) {
      const preferredOrder = ['수와 연산', '측정', '도형', '자료와 가능성', '규칙성'];
      const seen = new Set(rows.map(row => row.depth1).filter(Boolean));
      commonDepths = preferredOrder.filter(depth => seen.has(depth))
        .concat([...seen].filter(depth => !preferredOrder.includes(depth)));
    }

    function groupKeyForRow(row) {
      return `${row.grade}-${row.semester}`;
    }

    function fillMissingDefaultSemesters() {
      const defaults = defaultRowsForSubject();
      const existingKeys = new Set(appRows.map(groupKeyForRow));
      const missingKeys = new Set();
      const missingRows = defaults.filter(row => {
        const key = groupKeyForRow(row);
        if (existingKeys.has(key)) return false;
        missingKeys.add(key);
        return true;
      });
      if (!missingRows.length) return [];

      appRows = appRows.concat(missingRows);
      syncCommonDepthsFromRows(appRows);
      persistAppData('sample');
      return [...missingKeys].sort((a, b) => {
        const [ag, as] = a.split('-').map(Number);
        const [bg, bs] = b.split('-').map(Number);
        return ag - bg || as - bs;
      });
    }

    function renameDepthEverywhere(oldName, newName) {
      if (!isEditUnlocked()) return;
      const trimmed = newName.trim();
      if (!oldName || !trimmed || oldName === trimmed) return;
      appRows.forEach(row => {
        if (row.depth1 === oldName) row.depth1 = trimmed;
      });
      commonDepths = commonDepths.map(depth => depth === oldName ? trimmed : depth);
      persistAppData();
    }

    function deleteDepthEverywhere(depthName) {
      if (!isEditUnlocked()) return;
      appRows = appRows.filter(row => row.depth1 !== depthName);
      commonDepths = commonDepths.filter(depth => depth !== depthName);
      persistAppData();
    }

    function addCommonDepth(depthName = '새 1Depth') {
      if (!isEditUnlocked()) return;
      let candidate = depthName;
      let suffix = 2;
      while (commonDepths.includes(candidate)) {
        candidate = `${depthName} ${suffix}`;
        suffix += 1;
      }
      commonDepths.push(candidate);
      persistAppData();
    }

        input.dataset.depthName = depthName;

          renameDepthEverywhere(input.dataset.depthName, input.value);
          input.dataset.depthName = input.value.trim();
          loadEditorFor(selectedGroupKey());
          render();
        };
        input.addEventListener('change', applyRename);
        input.addEventListener('blur', applyRename);

            applyRename();

        grouped.get(row.depth1).push(row.depth2);

    function textLines(text, maxChars) {
      const source = String(text || '').trim();
      if (!source) return [''];
      const parts = source.split(/\s+/);
      const lines = [];
      let line = '';
      parts.forEach(part => {
        if (!line) {
          line = part;
        } else if ((line + ' ' + part).length <= maxChars) {
          line += ' ' + part;
        } else {
          lines.push(line);
          line = part;
        }
      });
      if (line) lines.push(line);

      const broken = [];
      lines.forEach(item => {
        if (item.length <= maxChars + 3) {
          broken.push(item);
          return;
        }
        for (let index = 0; index < item.length; index += maxChars) {
          broken.push(item.slice(index, index + maxChars));
        }
      });
      return broken.slice(0, 4);
    }

    function addCenteredText(group, text, x, y, maxChars, size, weight = 700, color = '#111827', boxWidth = 92, boxHeight = 62) {
      const lines = textLines(text, maxChars);
      const lineHeight = size * 1.15;
      const opticalOffset = lines.length > 1 ? size * .16 : size * .06;
      const startY = y - ((lines.length - 1) * lineHeight / 2) + opticalOffset;
      const textNode = createSvgElement('text', {
        x,
        y: startY,
        'text-anchor': 'middle',
        'dominant-baseline': 'central',
        'alignment-baseline': 'central',
        'font-family': 'Pretendard Variable, Pretendard, Arial, sans-serif',
        'font-size': size,
        'font-weight': weight,
        fill: color
      });

      lines.forEach((line, index) => {
        textNode.appendChild(createSvgElement('tspan', {
          x,
          dy: index === 0 ? 0 : lineHeight
        }, line));
      });
      group.appendChild(textNode);
    }

    function commonChildAngle(topic, presentTopics) {
      const has = name => presentTopics.includes(name);

      if (!has('수와 연산')) {
        if (topic === '측정') return Math.PI;
        if (topic === '자료와 가능성') return Math.PI / 2;
        if (topic === '도형') return 0;
        if (topic === '규칙성') return Math.PI / 2;
      }

      if (topic === '수와 연산') return Math.PI;
      if (topic === '측정') return has('도형') ? -Math.PI / 2 : 0;
      if (topic === '도형') return 0;
      if (topic === '자료와 가능성') return Math.PI / 2;
      if (topic === '규칙성') return Math.PI / 2;
      return null;
    }

    function topicSector(topic, presentTopics) {
      const has = name => presentTopics.includes(name);
      if (!has('수와 연산')) {
        if (topic === '측정') return { base: Math.PI, spread: Math.PI * .9 };
        if (topic === '자료와 가능성') return { base: Math.PI / 2, spread: Math.PI * .7 };

      if (topic === '규칙성') return { base: Math.PI / 2, spread: Math.PI * .65 };

    function commonTopicPosition(topic, presentTopics) {

        if (topic === '자료와 가능성') return [.50, .68];
        if (topic === '도형') return [.70, .45];
        if (topic === '규칙성') return [.32, .70];

      if (topic === '측정') {

      }
      if (topic === '자료와 가능성') {

        return [.74, .45];
      }
      if (topic === '규칙성') {

    function fallbackTopicPosition(index, total) {

        1: [[.5, .5]],
        2: [[.34, .5], [.66, .5]],
        3: [[.27, .48], [.55, .35], [.70, .62]],
        4: [[.26, .46], [.52, .34], [.74, .46], [.44, .70]],
        5: [[.25, .44], [.50, .32], [.74, .42], [.40, .70], [.66, .70]],
        6: [[.23, .43], [.43, .30], [.62, .32], [.78, .48], [.40, .70], [.64, .70]]

      if (positions[total]) return positions[total][index];
      const angle = -Math.PI / 2 + (Math.PI * 2 * index) / total;
      return [.5 + Math.cos(angle) * .26, .5 + Math.sin(angle) * .22];

    function topicAnchor(index, total, width, height, groupKey, topic, presentTopics) {

        x: Math.min(Math.max(width * rx, 150), width - 150),
        y: Math.min(Math.max(height * ry, 130), height - 130)
      });
      return clampTopic(commonTopicPosition(topic, presentTopics) || fallbackTopicPosition(index, total));
    }

    function childAnchor(parent, index, total, panelWidth, panelHeight, compact, clusterCenter, groupKey, topic, presentTopics) {
      const radius = compact ? 132 : 162;
      const outward = Math.atan2(parent.y - clusterCenter.y, parent.x - clusterCenter.x);
      const fallback = -Math.PI / 2 + (Math.PI * 2 * index) / Math.max(total, 1);
      const presetAngle = commonChildAngle(topic, presentTopics) ?? childAnglePresets[groupKey]?.[topic];
      const hasPresetAngle = Number.isFinite(presetAngle);
      const maxSpread = hasPresetAngle
        ? total > 7 ? Math.PI * 1.05 : Math.PI * .82
        : Math.PI * 1.35;
      const step = total <= 1 ? 0 : maxSpread / Math.max(total - 1, 1);
      const base = Number.isFinite(presetAngle)
        ? presetAngle
        : Number.isFinite(outward) && Math.hypot(parent.x - clusterCenter.x, parent.y - clusterCenter.y) > 8
        ? outward
        : fallback;
      const angle = base + (index - (total - 1) / 2) * step;
      const stagger = total > 7 && index % 2 ? compact ? 12 : 18 : 0;
      let x = parent.x + Math.cos(angle) * (radius + stagger);
      let y = parent.y + Math.sin(angle) * (radius + stagger);

        x = parent.x + Math.cos(angle) * (innerRadius + stagger);
        y = parent.y + Math.sin(angle) * (innerRadius + stagger);

    function nodeDistance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function overlapsOccupied(candidate, occupied, padding = 18) {
      return occupied.some(node => nodeDistance(candidate, node) < candidate.r + node.r + padding);
    }

    function placementScore(candidate, occupied, preferredAngle, parent) {
      const nearestGap = occupied.reduce((best, node) => {
        const gap = nodeDistance(candidate, node) - candidate.r - node.r;
        return Math.min(best, gap);
      }, Infinity);
      const actualAngle = Math.atan2(candidate.y - parent.y, candidate.x - parent.x);
      const anglePenalty = Math.abs(Math.atan2(Math.sin(actualAngle - preferredAngle), Math.cos(actualAngle - preferredAngle))) * 24;
      return nearestGap - anglePenalty;
    }

    function placeChildAroundOccupied(parent, childIndex, total, panelWidth, panelHeight, compact, clusterCenter, groupKey, topic, childR, occupied, presentTopics) {
      const sector = topicSector(topic, presentTopics);
      const first = childAnchor(parent, childIndex, total, panelWidth, panelHeight, compact, clusterCenter, groupKey, topic, presentTopics);
      const base = sector?.base ?? Math.atan2(first.y - parent.y, first.x - parent.x);
      const spread = sector?.spread ?? Math.PI;
      const baseRadius = compact ? 132 : 162;
      const layers = [0, 30, 60, 90, 122, 156, 192, 230];
      const slots = Math.max(total, 1);
      const normalizedIndex = total === 1 ? 0 : (childIndex - (total - 1) / 2) / ((total - 1) / 2);
      const primaryAngle = base + normalizedIndex * spread / 2;
      const angleOffsets = [0, -.08, .08, -.16, .16, -.25, .25, -.36, .36, -.48, .48, -.62, .62];
      let best = null;
      let bestScore = -Infinity;

      for (const layer of layers) {
        for (const offset of angleOffsets) {
          const radius = baseRadius + layer + (childIndex % 2) * 10;
          const angle = primaryAngle + offset;
          const candidate = {
            x: parent.x + Math.cos(angle) * radius,
            y: parent.y + Math.sin(angle) * radius,
            r: childR
          };
          if (!isInsidePanel(candidate, panelWidth, panelHeight)) continue;
          keepInside(candidate, panelWidth, panelHeight);
          const score = placementScore(candidate, occupied, base, parent);
          if (!overlapsOccupied(candidate, occupied, 10)) return candidate;
          if (score > bestScore) {
            best = candidate;
            bestScore = score;
          }
        }
      }

      return best || first;
    }

    function keepInside(node, width, height) {
      const margin = node.r + 18;
      node.x = Math.min(Math.max(node.x, margin), width - margin);
      node.y = Math.min(Math.max(node.y, margin), height - margin);
    }

    function isInsidePanel(node, width, height) {
      const margin = node.r + 18;
      return node.x >= margin && node.x <= width - margin && node.y >= margin && node.y <= height - margin;
    }

    function resolveCollisions(nodes, width, height) {
      nodes.forEach(node => keepInside(node, width, height));

      for (let pass = 0; pass < 220; pass += 1) {
        let moved = false;
        for (let i = 0; i < nodes.length; i += 1) {
          for (let j = i + 1; j < nodes.length; j += 1) {
            const a = nodes[i];
            const b = nodes[j];
            const padding = a.kind === 'topic' && b.kind === 'topic' ? 42 : 18;
            const minDistance = a.r + b.r + padding;
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const distance = Math.max(Math.hypot(dx, dy), .01);

            if (distance >= minDistance) continue;

            const overlap = (minDistance - distance) / 2;
            const ux = dx / distance;
            const uy = dy / distance;
            const aWeight = a.kind === 'topic' ? .12 : 1;
            const bWeight = b.kind === 'topic' ? .12 : 1;
            const totalWeight = aWeight + bWeight;
            a.x -= ux * overlap * (bWeight / totalWeight) * 1.18;
            a.y -= uy * overlap * (bWeight / totalWeight) * 1.18;
            b.x += ux * overlap * (aWeight / totalWeight) * 1.18;
            b.y += uy * overlap * (aWeight / totalWeight) * 1.18;
            keepInside(a, width, height);
            keepInside(b, width, height);
            moved = true;
          }
        }

        if (!moved) break;
      }
    }

    function pushChildrenAwayFromOtherTopics(nodes, width, height) {
      const topics = nodes.filter(node => node.kind === 'topic');
      const children = nodes.filter(node => node.kind === 'child');

      children.forEach(child => {
        topics.forEach(topic => {
          if (topic === child.parent) return;
          const dx = child.x - topic.x;
          const dy = child.y - topic.y;
          const distance = Math.max(Math.hypot(dx, dy), .01);
          const minDistance = topic.r + child.r + 62;
          if (distance >= minDistance) return;
          const parent = child.parent;
          const outX = child.x - parent.x;
          const outY = child.y - parent.y;
          const outDistance = Math.max(Math.hypot(outX, outY), .01);
          const push = minDistance - distance;
          child.x += (dx / distance) * push * .7 + (outX / outDistance) * push * .5;
          child.y += (dy / distance) * push * .7 + (outY / outDistance) * push * .5;
          keepInside(child, width, height);
        });
      });
    }

    function relaxChildrenAroundTopics(nodes, width, height) {
      nodes.filter(node => node.kind === 'child').forEach(node => {
        const parent = node.parent;
        const dx = node.x - parent.x;
        const dy = node.y - parent.y;
        const distance = Math.max(Math.hypot(dx, dy), .01);
        const minDistance = parent.r + node.r + 34;
        if (distance >= minDistance) return;
        node.x = parent.x + (dx / distance) * minDistance;
        node.y = parent.y + (dy / distance) * minDistance;
        keepInside(node, width, height);
      });
    }

    function renderPanel(parent, groupKey, rows, x, y, width, height, options) {

        fill: '#ffffff', stroke: '#111827', 'stroke-width': 2
      }));
      const byTopic = new Map();
      rows.forEach(row => {
        if (!byTopic.has(row.depth1)) byTopic.set(row.depth1, []);
        byTopic.get(row.depth1).push(row);
      });

      const topics = [...byTopic.entries()];
      const topicR = options.compact ? 44 : 52;
      const childNodes = [];
      const edges = [];

      function overlaps(candidate, occupied, padding = 10) {

        const yOnLine = from.y + t * dy;

        });
      }

      function topicZone(topic, index, total) {
        const zones = {
          '수와 연산': {
            x: width * .025, y: height * .08, w: width * .36, h: height * .84,
            cx: width * .25, cy: height * .52,
            start: Math.PI * .60, end: Math.PI * 1.40
          },
          '측정': {
            x: width * .36, y: height * .045, w: width * .31, h: height * .43,
            cx: width * .52, cy: height * .36,
            start: Math.PI * 1.03, end: Math.PI * 1.95
          },
          '도형': {
            x: width * .67, y: height * .08, w: width * .31, h: height * .78,
            cx: width * .77, cy: height * .52,
            start: -Math.PI * .46, end: Math.PI * .48
          },
          '자료와 가능성': {
            x: width * .49, y: height * .55, w: width * .19, h: height * .37,
            cx: width * .55, cy: height * .70,
            start: Math.PI * .18, end: Math.PI * .82
          },
          '규칙성': {
            x: width * .32, y: height * .56, w: width * .17, h: height * .36,
            cx: width * .40, cy: height * .71,
            start: Math.PI * .20, end: Math.PI * .90
          }
        };
        if (zones[topic]) return zones[topic];

        const columns = Math.min(Math.max(total, 1), 3);
        const rowsCount = Math.ceil(total / columns);
        const col = index % columns;
        const row = Math.floor(index / columns);
        const margin = 24;
        const zoneW = (width - margin * 2) / columns;
        const zoneH = (height - margin * 2) / rowsCount;
        return {
          x: margin + col * zoneW,
          y: margin + row * zoneH,
          w: zoneW,
          h: zoneH,
          cx: margin + col * zoneW + zoneW / 2,
          cy: margin + row * zoneH + zoneH / 2,
          start: -Math.PI,
          end: Math.PI

      }

      function insideZone(node, zone) {

        return node.x >= zone.x + margin
          && node.x <= zone.x + zone.w - margin
          && node.y >= zone.y + margin
          && node.y <= zone.y + zone.h - margin;
      }

      function clampToZone(node, zone) {
        const margin = node.r + 10;
        node.x = Math.min(Math.max(node.x, zone.x + margin), zone.x + zone.w - margin);
        node.y = Math.min(Math.max(node.y, zone.y + margin), zone.y + zone.h - margin);
        return node;
      }

      function topicPoint(topic, index, total) {
        const zone = topicZone(topic, index, total);
        return {
          x: Math.min(Math.max(zone.cx, zone.x + topicR + 16), zone.x + zone.w - topicR - 16),
          y: Math.min(Math.max(zone.cy, zone.y + topicR + 16), zone.y + zone.h - topicR - 16),
          zone
        };
      }

      function placeChild(topicNode, topic, childIndex, childCount, occupied) {
        const zone = topicNode.zone;
        const childR = options.compact ? 40 : 46;
        const candidates = [];

        const span = zone.end - zone.start;
        const ratio = childCount <= 1 ? .5 : childIndex / (childCount - 1);
        const preferredAngle = zone.start + span * ratio;
        const angleOffsets = [0, -.12, .12, -.24, .24, -.38, .38, -.54, .54, -.72, .72, -.95, .95];
        const radii = [118, 146, 174, 202, 230, 258];
        radii.forEach(radius => {
          angleOffsets.forEach(offset => {
            const angle = preferredAngle + offset;
            candidates.push({
              x: topicNode.x + Math.cos(angle) * radius,
              y: topicNode.y + Math.sin(angle) * radius
            });
          });
        });

        const gridGap = childR * 2 + 20;
        for (let yPos = zone.y + childR + 14; yPos <= zone.y + zone.h - childR - 14; yPos += gridGap) {
          for (let xPos = zone.x + childR + 14; xPos <= zone.x + zone.w - childR - 14; xPos += gridGap) {
            candidates.push({ x: xPos, y: yPos });
          }
        }

        candidates.sort((a, b) => {
          const aa = Math.atan2(a.y - topicNode.y, a.x - topicNode.x);
          const ab = Math.atan2(b.y - topicNode.y, b.x - topicNode.x);
          const da = Math.abs(Math.atan2(Math.sin(aa - preferredAngle), Math.cos(aa - preferredAngle))) * 90
            + Math.abs(Math.hypot(a.x - topicNode.x, a.y - topicNode.y) - 150);
          const db = Math.abs(Math.atan2(Math.sin(ab - preferredAngle), Math.cos(ab - preferredAngle))) * 90
            + Math.abs(Math.hypot(b.x - topicNode.x, b.y - topicNode.y) - 150);
          return da - db;
        });

        let best = null;
        let bestClear = null;
        let bestGap = -Infinity;
        let bestClearGap = -Infinity;

        for (const point of candidates) {
          const candidate = clampToZone({
            x: point.x,
            y: point.y,
            r: childR
          }, zone);
          if (!insideZone(candidate, zone)) continue;
          const nearestGap = occupied.reduce((min, node) => Math.min(min, Math.hypot(candidate.x - node.x, candidate.y - node.y) - candidate.r - node.r), Infinity);
          const hasOverlap = overlaps(candidate, occupied, 10);
          const lineBlocked = lineHitsOccupied(topicNode, candidate, occupied, topicNode);
          if (!hasOverlap && !lineBlocked) return candidate;
          if (!hasOverlap && nearestGap > bestClearGap) {
            bestClear = candidate;
            bestClearGap = nearestGap;
          }
          const score = nearestGap - (lineBlocked ? 80 : 0);
          if (score > bestGap) {
            best = candidate;
            bestGap = score;
          }
        }

        if (bestClear) return bestClear;

        return best || clampToZone({
          x: topicNode.x + Math.cos(preferredAngle) * 140,
          y: topicNode.y + Math.sin(preferredAngle) * 140,
          r: childR
        }, zone);
      }

      const topicNodes = topics.map(([topic], index) => {
        const point = topicPoint(topic, index, topics.length);
        const key = positionKey(groupKey, 'topic', topic);
        const saved = savedPosition(groupKey, key);
        return {
          topic,
          x: saved ? saved.x : point.x,
          y: saved ? saved.y : point.y,
          r: topicR,
          kind: 'topic',
          zone: point.zone,
          key

      });

      const occupied = topicNodes.map(node => ({ x: node.x, y: node.y, r: node.r + 18 }));

      topics.forEach(([topic, topicRows], index) => {
        const topicNode = topicNodes[index];
        const children = uniqueChildren(topicRows, false);
        children.forEach((child, childIndex) => {
          const placed = placeChild(topicNode, topic, childIndex, children.length, occupied);
          const key = positionKey(groupKey, 'child', topic, child);
          const saved = savedPosition(groupKey, key);
          const childNode = {
            label: child,
            x: saved ? saved.x : placed.x,
            y: saved ? saved.y : placed.y,
            r: placed.r,
            parent: topicNode,
            kind: 'child',
            key
          };
          childNodes.push(childNode);
          occupied.push({ x: childNode.x, y: childNode.y, r: childNode.r + 10 });
          edges.push([topicNode, childNode]);
        });
      });

      function trimEndpoint(from, to, radiusOffset) {
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const distance = Math.max(Math.hypot(dx, dy), .01);
        return {
          x: from.x + (dx / distance) * radiusOffset,
          y: from.y + (dy / distance) * radiusOffset

      }

      function edgeLine(from, to) {
        const start = trimEndpoint(from, to, from.r + 5);
        const end = trimEndpoint(to, from, to.r + 5);
        return { start, end };
      }

      edges.forEach(([from, to]) => {
        const line = edgeLine(from, to);
        panel.appendChild(createSvgElement('line', {
          x1: line.start.x, y1: line.start.y, x2: line.end.x, y2: line.end.y,
          'data-from': from.key, 'data-to': to.key,
          stroke: '#a3a3a3', 'stroke-width': 3, 'stroke-linecap': 'round'

      function appendNode(node, label, maxChars, size, weight, circleAttrs) {

          'data-node-key': node.key,
          'data-panel-key': groupKey,
          'data-panel-x': x,
          'data-panel-y': y,
          'data-x': node.x,
          'data-y': node.y,
          'data-r': node.r,
          style: 'cursor: move;'

          cx: 0, cy: 0, r: node.r,

        addCenteredText(nodeGroup, label, 0, 0, maxChars, size, weight, '#111827', node.r * 1.58, node.r * 1.32);
        panel.appendChild(nodeGroup);
        if (rememberRenderedPosition(groupKey, node.key, node.x, node.y)) {
          renderedPositionChanged = true;
        }
      }

      childNodes.forEach(node => {
        appendNode(node, node.label, 8, 13, 800, { fill: '#f3f4f6', stroke: 'none' });
      });

      topicNodes.forEach(node => {
        appendNode(node, node.topic, 5, 22, 900, { fill: '#ffffff', stroke: '#111827', 'stroke-width': 4 });
      });

      if (renderedPositionChanged) {
        saveManualPositions();
      }
      updateEditLockUi();
    }

    function getOptions() {

        panelHeight: Number(els.panelHeight.value) || 600,

      const dy = to.y - from.y;

    function updatePanelLines(panel) {
